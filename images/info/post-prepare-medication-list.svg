="middle"><tspan x="90" dy="0">!</tspan></text><text x="112" y="519" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="112" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="90" cy="550" r="4.5" fill="#E8A33D"/><text x="104" y="556" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="104" dy="0">약을 먹은 뒤 두드러기·입술 붓기·숨참</tspan><tspan x="104" dy="20">→ 목이 조이면 바로 가까운 응급실</tspan></text><circle cx="90" cy="602" r="4.5" fill="#E8A33D"/><text x="104" y="608" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="104" dy="0">약을 바꾼 뒤 심한 어지럼·두근거림</tspan></text><rect x="720" y="478" width="420" height="150" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="746" y="514" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="746" dy="0">약은 임의로 끊지 않기</tspan></text><text x="746" y="548" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="746" dy="0">줄이거나 끊을 때는</tspan><tspan x="746" dy="25">처방한 의사·약사와 먼저 상의</tspan></text>
