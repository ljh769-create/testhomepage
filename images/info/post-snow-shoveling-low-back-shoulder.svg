/tspan><tspan x="834" dy="21">심한 숨 가쁨이 생길 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리 저림이나</tspan><tspan x="834" dy="21">힘 빠짐이 생길 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">빙판에 넘어진 뒤</tspan><tspan x="834" dy="21">통증이 심할 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">가슴 통증·숨 가쁨은 바로 가까운 응급실</tspan><tspan x="816" dy="19">심장·혈압 질환은 미리 알리기</tspan></text>
