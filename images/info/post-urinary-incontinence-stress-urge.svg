<text x="834" y="356" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">열이 나고 소변 볼 때</tspan><tspan x="834" dy="21">심하게 아프며 옆구리가 아플 때</tspan></text>
