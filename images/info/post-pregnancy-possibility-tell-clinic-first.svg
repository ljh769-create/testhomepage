<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#7A6BB5" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">임신 중이거나 가능성이 있다면</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">진료 중 배가 당기거나 불편하면 바로 말씀해 주세요</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#7A6BB5"/>
<rect x="60" y="160" width="470" height="466" rx="22" fill="#FFFFFF" filter="url(#sh)"/><rect x="92" y="194" width="406" height="400" rx="14" fill="#FFFDF2" stroke="#FBE78A" stroke-width="2"/><text x="295" y="240" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="21" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="295" dy="0">접수할 때 알려 주세요</tspan></text><rect x="118" y="274" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#38608F" stroke-width="2.5"/><text x="156" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="156" dy="0">마지막 생리 시작일</tspan><tspan x="156" dy="21">임신 테스트 결과</tspan></text><path d="M118 332 H472" stroke="#90B2DD" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="118" y="352" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#38608F" stroke-width="2.5"/><text x="156" y="366" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="156" dy="0">병원에서 들은</tspan><tspan x="156" dy="21">임신 주수와 주의 사항</tspan></text><path d="M118 410 H472" stroke="#90B2DD" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="118" y="430" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#38608F" stroke-width="2.5"/><text x="156" y="444" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="156" dy="0">복용 중인 약·영양제</tspan><tspan x="156" dy="21">(엽산 등)</tspan></text><path d="M118 488 H472" stroke="#90B2DD" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="118" y="508" width="24" height="24" rx="6" fill="#FFFFFF" stroke="#38608F" stroke-width="2.5"/><text x="156" y="522" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="156" dy="0">입덧·허리 골반 통증 등</tspan><tspan x="156" dy="21">지금 불편한 점</tspan></text><path d="M118 566 H472" stroke="#90B2DD" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="560" y="160" width="580" height="190" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="590" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="590" dy="0">왜 먼저 알려야 할까요</tspan></text><circle cx="598" cy="234" r="5" fill="#38608F"/><text x="614" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="614" dy="0">임신 초기에는 본인도 모를 수 있어요</tspan></text><circle cx="598" cy="270" r="5" fill="#38608F"/><text x="614" y="276" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="614" dy="0">침·약침·온열·한약을 더 신중히 정합니다</tspan></text><circle cx="598" cy="306" r="5" fill="#38608F"/><text x="614" y="312" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="614" dy="0">산부인과 주의 사항 범위 안에서 정합니다</tspan></text><rect x="560" y="370" width="580" height="256" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="590" cy="404" r="12" fill="#E8A33D"/><text x="590" y="410" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="590" dy="0">!</tspan></text><text x="612" y="411" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="612" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="590" cy="444" r="4.5" fill="#E8A33D"/><text x="604" y="450" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="604" dy="0">출혈이 있거나 아랫배가 심하게 아픈 경우</tspan></text><circle cx="590" cy="478" r="4.5" fill="#E8A33D"/><text x="604" y="484" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="604" dy="0">양수가 비치는 느낌이 있는 경우</tspan></text><circle cx="590" cy="512" r="4.5" fill="#E8A33D"/><text x="604" y="518" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="604" dy="0">심한 두통·시야 이상·갑작스러운 붓기</tspan></text><circle cx="590" cy="546" r="4.5" fill="#E8A33D"/><text x="604" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="604" dy="0">태동이 평소보다 뚜렷하게 줄어든 경우</tspan></text><text x="586" y="606" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="586" dy="0">이런 경우에는 산부인과·응급실 확인이 먼저입니다</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
