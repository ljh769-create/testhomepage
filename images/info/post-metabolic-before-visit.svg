 x="913.0" dy="0">중성지방</tspan></text><rect x="670" y="272" width="170" height="36" rx="18" fill="#2C4568"/><text x="755.0" y="296" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="755.0" dy="0">HDL 콜레스테롤</tspan></text><rect x="852" y="272" width="94" height="36" rx="18" fill="#2C4568"/><text x="899.0" y="296" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="899.0" dy="0">허리둘레</tspan></text><text x="670" y="348" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#90B2DD" text-anchor="start"><tspan x="670" dy="0">여러 항목이 함께 기준을 벗어나면</tspan><tspan x="670" dy="20">대사증후군이라고 부릅니다</tspan></text><rect x="640" y="430" width="500" height="200" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="670" cy="464" r="12" fill="#E8A33D"/><text x="670" y="470" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="670" dy="0">!</tspan></text><text x="692" y="471" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="692" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="670" cy="502" r="4.5" fill="#E8A33D"/><text x="684" y="508" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="684" dy="0">매우 높다는 말을 들었거나 약으로 조절이 어려울 때</tspan></text><circle cx="670" cy="534" r="4.5" fill="#E8A33D"/><text x="684" y="540" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="684" dy="0">가슴 통