="0">담당자 연락처</tspan></text><circle cx="516.0" cy="574" r="5" fill="#FBE78A"/><text x="530.0" y="580" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="530.0" dy="0">다른 병원 진단서</tspan></text><rect x="780" y="160" width="360" height="470" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="810" cy="194" r="12" fill="#E8A33D"/><text x="810" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="810" dy="0">!</tspan></text><text x="832" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="832" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="810" cy="232" r="4.5" fill="#E8A33D"/><text x="824" y="238" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="824" dy="0">의식이 흐리거나</tspan><tspan x="824" dy="20">심한 두통·구토</tspan></text><circle cx="810" cy="284" r="4.5" fill="#E8A33D"/><text x="824" y="290" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="824" dy="0">팔다리에 힘이 빠지거나</tspan><tspan x="824" dy="20">마비감이 있을 때</tspan></text><circle cx="810" cy="336" r="4.5" fill="#E8A33D"/><text x="824" y="342" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="824" dy="0">가슴이나 배 통증이</tspan><tspan x="824" dy="20">심할 때</tspan></text><circle cx="810" cy="388" r="4.5" fill="#E8A33D"/><text x="824" y="394" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" t