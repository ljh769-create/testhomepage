<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리자 - 좋은꿈참사랑한의원</title>
<link rel="stylesheet" href="style.css">
<meta name="google-site-verification" content="">
<script>window.addEventListener("load",function(){var id="G-XXXXXXXXXX";if(id.indexOf("XXXX")>-1)return;setTimeout(function(){var s=document.createElement("script");s.async=1;s.src="https://www.googletagmanager.com/gtag/js?id="+id;document.head.appendChild(s)},1500)});</script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-XXXXXXXXXX');</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1F3552">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
</head>
<body>
<div class="wrap">
<header class="hero">
  <h1>관리자 화면</h1>
  <p class="note">여기에 입력한 값은 <b>이 기기의 이 브라우저에만</b> 저장됩니다. 모든 방문자에게 반영하려면 아래 ‘설정 파일 내보내기’로 받은 config.js를 사이트 폴더의 config.js에 덮어쓰고 다시 올려 주세요. 실제 운영 전에는 비밀번호 등 접근 제한이 필요합니다.</p>
  <p id="summary" class="todo"></p>
</header>

<form id="f" autocomplete="off">
  <label for="booking">예약 링크 (https://…) <span data-for="booking"></span></label>
  <input id="booking" type="url" placeholder="https://">
  <label for="address">주소 <span data-for="address"></span></label>
  <input id="address" type="text">
  <label for="hours">진료시간 (줄바꿈 가능) <span data-for="hours"></span></label>
  <textarea id="hours"></textarea>
  <label for="phone">전화번호 (선택) <span data-for="phone"></span></label>
  <input id="phone" type="tel">
  <div class="row">
    <button class="btn primary" type="submit">이 기기에 저장</button>
    <button class="btn" type="button" id="export">설정 파일 내보내기</button>
    <a class="btn" href="index.html">홈페이지 보기</a>
  </div>
  <p id="msg" class="note"></p>
</form>
</div>
<script src="config.js"></script>
<script>
(function(){
  var KEY="goodDreamSiteConfig",F=["booking","address","hours","phone"];
  var cfg=Object.assign({booking:"",address:"",hours:"",phone:""},window.SITE_CONFIG||{});
  try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");F.forEach(function(k){if(s[k])cfg[k]=s[k];});}catch(e){}
  F.forEach(function(k){document.getElementById(k).value=cfg[k];});
  function read(){var o={};F.forEach(function(k){o[k]=document.getElementById(k).value.trim();});return o;}
  function badges(){
    var o=read(),n=0;
    F.forEach(function(k){
      var el=document.querySelector('[data-for="'+k+'"]');
      if(!o[k]){n++;el.innerHTML='<span class="badge">입력 필요</span>';}else el.innerHTML="";
    });
    document.getElementById("summary").textContent=n?("입력 필요 항목 "+n+"개"):"";
  }
  F.forEach(function(k){document.getElementById(k).addEventListener("input",badges);});
  badges();
  document.getElementById("f").addEventListener("submit",function(e){
    e.preventDefault();
    var o=read();
    if(o.booking&&!/^https?:\/\//i.test(o.booking)){document.getElementById("msg").textContent="예약 링크는 http:// 또는 https:// 로 시작해야 합니다.";return;}
    localStorage.setItem(KEY,JSON.stringify(o));
    document.getElementById("msg").textContent="저장했습니다. 이 기기에서 홈페이지를 열면 반영됩니다.";
  });
  document.getElementById("export").addEventListener("click",function(){
    var txt="window.SITE_CONFIG = "+JSON.stringify(read(),null,2)+";\n";
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([txt],{type:"text/javascript"}));
    a.download="config.js";a.click();
  });
})();
</script>
</body>
</html>
