<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#5BA68A" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">무거운 책가방에 언덕길, 아이가 어깨·허리를 아파할 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">가방 무게와 메는 법부터 바꿔 봅니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#5BA68A"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">가방은 양쪽 어깨로, 등에 붙여서</tspan></text><rect x="90" y="222" width="300" height="200" rx="14" fill="#FCEDEB"/><text x="240" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#D97F78" text-anchor="middle"><tspan x="240" dy="0">이렇게 멜 때</tspan></text><g transform="translate(240 320) scale(1.6)" fill="none" stroke="#D97F78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-14" r="6"/><path d="M0 -8 v16 M-12 -2 l12 -2 l12 2 M0 8 l-8 14 M0 8 l8 14"/></g><text x="240" y="382" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="240" dy="0">한쪽 어깨로 메기</tspan><tspan x="240" dy="19">엉덩이 아래로 처짐</tspan></text><path d="M400 322 H450" stroke="#38608F" stroke-width="4"/><path d="M446 313 l12 9 l-12 9" fill="none" stroke="#38608F" stroke-width="4"/><rect x="470" y="222" width="260" height="200" rx="14" fill="#E8F1FA"/><text x="600" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#38608F" text-anchor="middle"><tspan x="600" dy="0">이렇게 바꿔 보기</tspan></text><g transform="translate(600 320) scale(1.6)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-14" r="6"/><path d="M0 -8 v16 M-12 -2 l12 -2 l12 2 M0 8 l-8 14 M0 8 l8 14"/></g><text x="600" y="382" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="600" dy="0">양쪽 어깨로 조여 메기</tspan><tspan x="600" dy="19">아래쪽이 허리 위에</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일상에서 먼저 해 볼 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">필요 없는 책은</tspan><tspan x="110.0" dy="20">사물함·집에 두기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">무거운 책은</tspan><tspan x="330.0" dy="20">등 쪽에 가깝게</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">저녁에 어깨 돌리고</tspan><tspan x="550.0" dy="20">가슴 펴기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">통증으로 밤에 깨거나</tspan><tspan x="834" dy="21">아침에도 계속 아파할 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">열이 나고 등·허리를</tspan><tspan x="834" dy="21">만지면 아파할 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리가 저리거나 힘이</tspan><tspan x="834" dy="21">빠진다고 할 때 (바로 진료)</tspan></text><text x="816" y="606" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">가방 무게를 체중계로 재 보세요</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>