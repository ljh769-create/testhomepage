<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#C97B84" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">출산 뒤 유모차 오르막, 골반이 묵직할 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">팔이 아니라 다리 힘으로, 완만한 길로</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#C97B84"/>
<rect x="60" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><rect x="420" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="230" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#C97B84" text-anchor="middle"><tspan x="230" dy="0">팔 힘으로 밀 때</tspan></text><text x="590" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#5BA68A" text-anchor="middle"><tspan x="590" dy="0">다리 힘으로 밀 때</tspan></text><path d="M140 400 L320 330" stroke="#90B2DD" stroke-width="6" stroke-linecap="round"/><circle cx="200" cy="282" r="13" fill="none" stroke="#C97B84" stroke-width="3"/><path d="M200 295 l26 46 M200 310 l46 6 M226 341 l-14 34 M226 341 l16 30" stroke="#C97B84" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="246" y="300" width="44" height="30" rx="8" fill="none" stroke="#1F3552" stroke-width="3"/><circle cx="254" cy="336" r="6" fill="#1F3552"/><circle cx="284" cy="330" r="6" fill="#1F3552"/><path d="M500 400 L680 330" stroke="#90B2DD" stroke-width="6" stroke-linecap="round"/><circle cx="560" cy="282" r="13" fill="none" stroke="#5BA68A" stroke-width="3"/><path d="M560 295 l8 46 M560 310 l46 6 M568 341 l-14 34 M568 341 l16 30" stroke="#5BA68A" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="606" y="300" width="44" height="30" rx="8" fill="none" stroke="#1F3552" stroke-width="3"/><circle cx="614" cy="336" r="6" fill="#1F3552"/><circle cx="644" cy="330" r="6" fill="#1F3552"/><text x="230" y="432" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="230" dy="0">유모차가 몸에서 멀어지고</tspan><tspan x="230" dy="19">허리·골반에 힘이 계속</tspan></text><text x="590" y="432" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="590" dy="0">유모차를 몸 가까이,</tspan><tspan x="590" dy="19">가파른 길은 돌아가기</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">출산 뒤 회복 중인 몸을 위해</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">아기가 잘 때</tspan><tspan x="110.0" dy="20">함께 눕기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">아랫배·허리</tspan><tspan x="330.0" dy="20">따뜻하게</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">수유 중이라면</tspan><tspan x="550.0" dy="20">꼭 알려 주기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">출혈이 다시 많아지고</tspan><tspan x="834" dy="21">열이 날 때 → 산부인과</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">한쪽 다리가 붓고 아프거나</tspan><tspan x="834" dy="21">숨이 갑자기 찰 때 → 응급실</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">기분이 깊게 가라앉아</tspan><tspan x="834" dy="21">아기 돌보기가 힘들 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">마음이 힘들 땐 109</tspan><tspan x="816" dy="19">호르몬제는 임의로 끊지 않기</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
