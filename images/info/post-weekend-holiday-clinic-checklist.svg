n Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">진료 시간을 기다리지 말고</tspan><tspan x="816" dy="19">가까운 응급실로</tspan></text>
