<rect x="60" y="160" width="520" height="466" rx="22" fill="#FFFFFF" filter="url(#sh)"/><rect x="100" y="196" width="440" height="396" rx="14" fill="#FFFDF2" stroke="#FBE78A" stroke-width="2"/><rect x="270" y="184" width="100" height="26" rx="8" fill="#90B2DD"/><text x="320" y="248" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="21" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="320" dy="0">진료 전 세 줄 메모</tspan></text><circle cx="136" cy="300" r="15" fill="#38608F"/><text x="136" y="306" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="136" dy="0">1</tspan></text><text x="164" y="306" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="164" dy="0">지금 가장 불편한 점 한 가지</tspan></text><path d="M124 344 H516" stroke="#90B2DD" stroke-width="1.5" stroke-dasharray="4 5"/><text x="164" y="336" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="164" dy="0">예) 계단 내려갈 때 무릎</tspan></text><circle cx="136" cy="396" r="15" fill="#38608F"/><text x="136" y="402" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="136" dy="0">2</tspan></text><text x="164" y="402" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="164" dy="0">언제부터, 어떤 때 달라지는지</tspan></text><path d="M124 440 H516" stroke="#90B2DD" stroke-width="1.5" stroke-dasharray="4 5"/><text x="164" y="432" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="164" dy="0">예) 한 달 전부터, 저녁에 더</tspan></text><circle cx="136" cy="492" r="15" fill="#38608F"/><text x="136" y="498" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="136" dy="0">3</tspan></text><text x="164" y="498" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="164" dy="0">진료에서 바라는 것 한 가지</tspan></text><path d="M124 536 H516" stroke="#90B2DD" stroke-width="1.5" stroke-dasharray="4 5"/><text x="164" y="528" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="164" dy="0">예) 장 보러 걸어 다니기</tspan></text><rect x="610" y="160" width="530" height="200" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="640" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="640" dy="0">왜 세 줄이면 좋을까요</tspan></text><circle cx="648" cy="236" r="5" fill="#38608F"/><text x="664" y="242" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="664" dy="0">긴장하면 방금 떠오른 것부터 말하게 돼요</tspan></text><circle cx="648" cy="274" r="5" fill="#38608F"/><text x="664" y="280" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="664" dy="0">불편이 여러 가지면 핵심이 흐려지기 쉬워요</tspan></text><circle cx="648" cy="312" r="5" fill="#38608F"/><text x="664" y="318" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="664" dy="0">바라는 점을 말해야 목표가 같아져요</tspan></text><rect x="610" y="380" width="530" height="246" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="640" cy="414" r="12" fill="#E8A33D"/><text x="640" y="420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="640" dy="0">!</tspan></text><text x="662" y="421" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="662" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="640" cy="454" r="4.5" fill="#E8A33D"/><text x="654" y="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="654" dy="0">가슴·머리·배에 갑자기 생긴 심한 통증</tspan></text><circle cx="640" cy="488" r="4.5" fill="#E8A33D"/><text x="654" y="494" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="654" dy="0">숨이 차거나 의식이 흐려지는 느낌</tspan></text><circle cx="640" cy="522" r="4.5" fill="#E8A33D"/><text x="654" y="528" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="654" dy="0">이유 없이 체중이 줄고 열이 이어질 때</tspan></text><text x="636" y="606" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="636" dy="0">이런 경우에는 다른 의료기관이나 119 확인이 먼저입니다</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
