<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">집중 구간과 배경 소리, 이렇게 활용해요</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">의지 문제로만 보기보다 잠·식사·환경을 함께 살핍니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">짧게 집중하고 짧게 쉬는 구간 (예시)</tspan></text><rect x="90" y="226" width="260.6666666666667" height="50" rx="10" fill="#38608F"/><text x="220.33333333333334" y="257" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="220.33333333333334" dy="0">25분 집중</tspan></text><rect x="356.6666666666667" y="226" width="47.333333333333336" height="50" rx="10" fill="#3E9C8A"/><text x="380.33333333333337" y="257" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="380.33333333333337" dy="0">5분</tspan></text><rect x="410.0" y="226" width="260.6666666666667" height="50" rx="10" fill="#38608F"/><text x="540.3333333333334" y="257" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="540.3333333333334" dy="0">25분 집중</tspan></text><rect x="676.6666666666667" y="226" width="47.333333333333336" height="50" rx="10" fill="#3E9C8A"/><text x="700.3333333333334" y="257" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="700.3333333333334" dy="0">5분</tspan></text><text x="90" y="302" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#4A5D75" text-anchor="start"><tspan x="90" dy="0">25분이 짧으면 40~50분 집중, 10분 쉬기도 괜찮아요</tspan></text><rect x="90" y="324" width="204" height="112" rx="14" fill="#F4F8FC"/><circle cx="126" cy="380" r="22" fill="#DCE8F5"/><g transform="translate(126 380) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 -10 h26 v14 a13 13 0 0 1 -26 0 z"/><path d="M10 -4 h4 a6 6 0 0 1 0 12 h-4"/></g><text x="156" y="374" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="156" dy="0">쉬는 때엔 물 마시기,</tspan><tspan x="156" dy="19">스트레칭하기</tspan></text><rect x="306" y="324" width="204" height="112" rx="14" fill="#F4F8FC"/><circle cx="342" cy="380" r="22" fill="#DCE8F5"/><g transform="translate(342 380) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-11" y="-18" width="22" height="36" rx="5"/><path d="M-4 12 h8"/></g><text x="372" y="374" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="372" dy="0">휴대전화는 다른</tspan><tspan x="372" dy="19">방이나 가방에</tspan></text><rect x="522" y="324" width="204" height="112" rx="14" fill="#F4F8FC"/><circle cx="558" cy="380" r="22" fill="#DCE8F5"/><g transform="translate(558 380) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 0 q5 -10 10 0 t10 0 t10 0 t10 0"/><path d="M-20 10 q5 -10 10 0 t10 0 t10 0 t10 0"/></g><text x="588" y="374" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="588" dy="0">빗소리·선풍기 소리로</tspan><tspan x="588" dy="19">주변 소음 가리기</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">함께 챙기면 오래 이어 가기 쉬워요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">잠은 충분히,</tspan><tspan x="110.0" dy="20">식사는 규칙적으로</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">할 일은 작게 쪼개</tspan><tspan x="330.0" dy="20">첫 단계만 시작</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">배경 소리가 방해되면</tspan><tspan x="550.0" dy="20">바로 끄기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">집중이 안 되는 상태가 몇 주</tspan><tspan x="834" dy="21">이상 이어지고 일상이 무너질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">기억이 갑자기 흐려지거나</tspan><tspan x="834" dy="21">말이 어눌해질 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">우울감이 깊거나</tspan><tspan x="834" dy="21">극단적인 생각이 들 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">109에 바로</tspan><tspan x="816" dy="19">도움을 요청하세요</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
