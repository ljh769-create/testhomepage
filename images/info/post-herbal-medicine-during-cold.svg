<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">한약을 먹는 중에 감기에 걸렸다면</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">처방과 지금의 증상에 따라 달라 먼저 전화로 알려 주세요</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">감기에 걸렸다면, 이 순서로</tspan></text><rect x="90" y="222" width="640" height="66" rx="14" fill="#FFF1E0"/><text x="410" y="252" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#8A5A12" text-anchor="middle"><tspan x="410" dy="0">38도 이상 열이 이어지거나 숨이 차고 가슴이 아프면</tspan></text><text x="410" y="276" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#8A5A12" text-anchor="middle"><tspan x="410" dy="0">→ 한약보다 의과 진료가 먼저 (응급 시 119)</tspan></text><rect x="90" y="304" width="148" height="140" rx="14" fill="#DCE8F5"/><circle cx="164" cy="336" r="22" fill="#FFFFFF"/><g transform="translate(164 338) scale(0.75)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -12 h36 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 h-20 l-10 8 v-8 h-6 a6 6 0 0 1 -6 -6 v-16 a6 6 0 0 1 6 -6 z"/><path d="M-8 0 h16"/></g><text x="164" y="386" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="164" dy="0">전화 먼저</tspan></text><text x="164" y="408" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="164" dy="0">계속 드실지 멈출지</tspan><tspan x="164" dy="17">한의원에 문의</tspan></text><rect x="252" y="304" width="148" height="140" rx="14" fill="#DCE8F5"/><circle cx="326" cy="336" r="22" fill="#FFFFFF"/><g transform="translate(326 338) scale(0.75)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 12 L8 -10 L14 -4 L-8 18 L-16 20 Z"/><path d="M4 -6 L10 0"/></g><text x="326" y="386" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="326" dy="0">약 이름 알리기</tspan></text><text x="326" y="408" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="326" dy="0">새 감기약·해열제</tspan><tspan x="326" dy="17">이름을 알려 주세요</tspan></text><rect x="414" y="304" width="148" height="140" rx="14" fill="#DCE8F5"/><circle cx="488" cy="336" r="22" fill="#FFFFFF"/><g transform="translate(488 338) scale(0.75)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -18 C10 -4 14 2 14 8 a14 14 0 0 1 -28 0 c0 -6 4 -12 14 -26 z"/></g><text x="488" y="386" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="488" dy="0">물과 쉼</tspan></text><text x="488" y="408" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="488" dy="0">물을 충분히,</tspan><tspan x="488" dy="17">부드러운 음식</tspan></text><rect x="576" y="304" width="148" height="140" rx="14" fill="#DCE8F5"/><circle cx="650" cy="336" r="22" fill="#FFFFFF"/><g transform="translate(650 338) scale(0.75)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-18" y="-12" width="36" height="28" rx="6"/><path d="M-8 -2 a8 8 0 0 1 16 0"/><path d="M0 -2 l4 -5"/></g><text x="650" y="386" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="650" dy="0">체온 적기</tspan></text><text x="650" y="408" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="650" dy="0">하루 두세 번</tspan><tspan x="650" dy="17">재어 적어 두기</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 기록해 오세요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">증상이 시작된 날과</tspan><tspan x="110.0" dy="20">체온</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">한약을 멈춘 날과</tspan><tspan x="330.0" dy="20">남은 파우치 수</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">설사·구토가 있었다면</tspan><tspan x="550.0" dy="20">횟수</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">38도 이상 열이</tspan><tspan x="834" dy="21">계속될 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">숨이 차거나</tspan><tspan x="834" dy="21">가슴이 아플 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">소변이 줄고 어지러운</tspan><tspan x="834" dy="21">탈수 증상</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">숨참·가슴 통증은 119·응급실</tspan><tspan x="816" dy="19">양약은 임의로 끊지 않기</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
