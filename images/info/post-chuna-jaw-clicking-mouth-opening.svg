eo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="152" dy="0">턱 괴기</tspan></text><text x="152" y="468" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="152" dy="0">손으로 턱을 받치는 버릇</tspan></text><rect x="90" y="502" width="380" height="78" rx="14" fill="#F4F8FC"/><rect x="108" y="526" width="28" height="28" rx="7" fill="#FFFFFF" stroke="#38608F" stroke-width="3"/><path d="M114 540 l7 7 l12 -14" fill="none" stroke="#38608F" stroke-width="3.5"/><text x="152" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="152" dy="0">고개 내민 자세</tspan></text><text x="152" y="560" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="152" dy="0">목·어깨 긴장과 함께</tspan></text><rect x="520" y="160" width="250" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">먼저 해 볼 것</tspan></text><rect x="546" y="226" width="200" height="84" rx="14" fill="#2C4568"/><text x="560" y="260" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="560" dy="0">딱딱하고 질긴</tspan><tspan x="560" dy="21">음식 줄이기</tspan></text><rect x="546" y="324" width="200" height="84" rx="14" fill="#2C4568"/><text x="560" y="358" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="560" dy="0">양쪽으로</tspan><tspan x="560" dy="21">고르게 씹기</tspan></text><rect x="546" y="422" width="200" height="84" rx="14" fill="#2C4568"/><text x="560" y="456" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="560" dy="0">혀는 입천장에,</tspan><tspan x="560" dy="21">위아래 이는 떼기</tspan></text><rect x="546" y="520" width="200" height="84" rx="14" fill="#2C4568"/><text x="560" y="554" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="560" dy="0">하품할 때 입을</tspan><tspan x="560" dy="21">너무 크게 벌리지 않기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">입이 갑자기 다물어지지</tspan><tspan x="834" dy="21">않거나 벌어지지 않을 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">턱 부위가 붓고</tspan><tspan x="834" dy="21">열이 날 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">얼굴 감각이 둔해지거나</tspan><tspan x="834" dy="21">한쪽 얼굴이 처질 때</tspan><tspan x="834" dy="21">(가까운 응급실로 바로)</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">치아·교합 문제로 보이면</tspan><tspan x="816" dy="19">치과를 안내합니다</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
