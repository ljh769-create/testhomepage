<rect x="60" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="230" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="230" dy="0">한쪽 골반에 걸쳐 안기</tspan></text><g transform="rotate(8 230 400)" stroke="#1F3552" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="230" cy="250" r="20"/><line x1="230" y1="270" x2="230" y2="350"/><line x1="230" y1="350" x2="208" y2="420"/><line x1="230" y1="350" x2="252" y2="420"/></g><circle cx="200" cy="300" r="14" fill="#FBE78A" stroke="#E8A33D" stroke-width="3"/><text x="230" y="446" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#8A5A12" text-anchor="middle"><tspan x="230" dy="0">몸이 한쪽으로 기울어요</tspan></text><rect x="420" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="590" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="590" dy="0">번갈아 안기 · 아기띠</tspan></text><g transform="rotate(0 560 400)" stroke="#1F3552" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="560" cy="250" r="20"/><line x1="560" y1="270" x2="560" y2="350"/><line x1="560" y1="350" x2="538" y2="420"/><line x1="560" y1="350" x2="582" y2="420"/></g><circle cx="590" cy="300" r="14" fill="#FBE78A" stroke="#E8A33D" stroke-width="3"/><g transform="rotate(0 630 400)" stroke="#1F3552" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="630" cy="250" r="20"/><line x1="630" y1="270" x2="630" y2="350"/><line x1="630" y1="350" x2="608" y2="420"/><line x1="630" y1="350" x2="652" y2="420"/></g><circle cx="600" cy="300" r="14" fill="#DCE8F5" stroke="#E8A33D" stroke-width="3"/><text x="590" y="446" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#38608F" text-anchor="middle"><tspan x="590" dy="0">좌우를 의식해서 바꿔요</tspan></text><rect x="780" y="160" width="360" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="960" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="960" dy="0">들어 올릴 때</tspan></text><g stroke="#1F3552" stroke-width="5" fill="none" stroke-linecap="round"><circle cx="940" cy="262" r="18"/><line x1="940" y1="280" x2="950" y2="340"/><path d="M950 340 L 915 370 L 935 410"/><path d="M950 340 L 985 372 L 975 412"/></g><circle cx="995" cy="400" r="14" fill="#FBE78A" stroke="#E8A33D" stroke-width="3"/><text x="960" y="446" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#38608F" text-anchor="middle"><tspan x="960" dy="0">허리 대신 무릎을 굽혀요</tspan></text><rect x="60" y="480" width="640" height="110" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="518" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">집에서 쉬는 법</tspan></text><circle cx="96.0" cy="552" r="6" fill="#FBE78A"/><text x="110.0" y="558" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">무릎 세우고 누워 허리 쉬기</tspan></text><circle cx="386.0" cy="552" r="6" fill="#FBE78A"/><text x="400.0" y="558" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="400.0" dy="0">오래 설 땐 벽·의자에 기대기</tspan></text><rect x="720" y="466" width="420" height="164" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="750" cy="500" r="12" fill="#E8A33D"/><text x="750" y="506" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="750" dy="0">!</tspan></text><text x="772" y="507" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="772" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="750" cy="534" r="4.5" fill="#E8A33D"/><text x="764" y="540" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="764" dy="0">다리 저림·발에 힘 빠짐</tspan></text><circle cx="750" cy="564" r="4.5" fill="#E8A33D"/><text x="764" y="570" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="764" dy="0">대소변이 갑자기 어려움 → 응급실</tspan></text><circle cx="750" cy="594" r="4.5" fill="#E8A33D"/><text x="764" y="600" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="764" dy="0">열이 나거나 밤에도 계속 심할 때</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
