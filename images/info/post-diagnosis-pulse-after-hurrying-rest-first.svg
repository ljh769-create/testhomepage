pan></text><path d="M504 297 H524" stroke="#38608F" stroke-width="4"/><path d="M520 288 l12 9 l-12 9" fill="none" stroke="#38608F" stroke-width="4"/><rect x="534" y="222" width="190" height="150" rx="14" fill="#F4F8FC"/><circle cx="629" cy="258" r="24" fill="#DCE8F5"/><g transform="translate(629 258) scale(0.7)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-6 16 v-20 a4 4 0 0 1 8 0 v12"/><path d="M2 4 v-6 a4 4 0 0 1 8 0 v8"/><path d="M10 6 v-2 a4 4 0 0 1 8 0 v8 a14 14 0 0 1 -14 14 h-4 a12 12 0 0 1 -10 -6 l-8 -12 a4 4 0 0 1 6 -4 l6 6"/></g><text x="629" y="308" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="629" dy="0">양쪽 손목 진맥</tspan></text><text x="629" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="629" dy="0">손목은 편하게,</tspan><tspan x="629" dy="19">힘 빼고 올리기</tspan></text><text x="90" y="404" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">맥을 빠르게 할 수 있는 것</tspan></text><rect x="90" y="418" width="150" height="40" rx="20" fill="#DCE8F5"/><text x="165" y="444" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="165" dy="0">커피·에너지 음료</tspan></text><rect x="252" y="418" width="150" height="40" rx="20" fill="#DCE8F5"/><text x="327" y="444" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="327" dy="0">긴장·걱정</tspan></text><rect x="414" y="418" width="150" height="40" rx="20" fill="#DCE8F5"/><text x="489" y="444" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="489" dy="0">식사 직후</tspan></text><rect x="576" y="418" width="150" height="40" rx="20" fill="#DCE8F5"/><text x="651" y="444" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="651" dy="0">더운 날씨·감기 기운</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">오시기 전에</tspan></text><circle cx="96.0" cy="566" r="5" fill="#FBE78A"/><text x="110.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">예약 시간보다</tspan><tspan x="110.0" dy="20">5~10분 일찍 도착</tspan></text><circle cx="316.0" cy="566" r="5" fill="#FBE78A"/><text x="330.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">손목시계·팔찌는</tspan><tspan x="330.0" dy="20">미리 빼 두기</tspan></text><circle cx="536.0" cy="566" r="5" fill="#FBE78A"/><text x="550.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">진료 전 커피는</tspan><tspan x="550.0" dy="20">가능하면 피하기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy