ddle"><tspan x="110" dy="0">4</tspan></text><text x="140" y="448" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="140" dy="0">젤을 바르고 탐촉자를 대어 보기</tspan></text><circle cx="110" cy="508" r="15" fill="#38608F"/><text x="110" y="514" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="110" dy="0">5</tspan></text><text x="140" y="514" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="140" dy="0">아픈 동작을 천천히 하며 확인</tspan></text><circle cx="110" cy="574" r="15" fill="#38608F"/><text x="110" y="580" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="110" dy="0">6</tspan></text><text x="140" y="580" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="140" dy="0">화면을 함께 보며 설명</tspan></text><circle cx="560" cy="250" r="46" fill="#DCE8F5"/><g transform="translate(560 252) scale(1.4)" fill="none" stroke="#1F3552" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-6" y="-18" width="12" height="22" rx="4"/><path d="M-10 4 h20 l-3 12 h-14 z"/></g><rect x="680" y="160" width="460" height="250" rx="22" fill="#EEF4FB" filter="url(#sh)"/><text x="708" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="708" dy="0">알아 둘 점</tspan></text><circle cx="714" cy="230" r="6" fill="#38608F"/><text x="732" y="236" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="732" dy="0">모든 분이 받는</tspan><tspan x="732" dy="20">검사가 아닙니다</tspan></text><circle cx="714" cy="288" r="6" fill="#38608F"/><text x="732" y="294" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="732" dy="0">뼈 속·깊은 부위는</tspan><tspan x="732" dy="20">병원 영상 검사를 안내</tspan></text><circle cx="714" cy="346" r="6" fill="#38608F"/><text x="732" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="732" dy="0">결과만으로 정하지 않고</tspan><tspan x="732" dy="20">증상과 함께 판단</tspan></text><rect x="680" y="428" width="460" height="192" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="710" cy="462" r="12" fill="#E8A33D"/><text x="710" y="468" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="710" dy="0">!</tspan></text><text x="732" y="469" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="732" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="710" cy="500" r="4.5" fill="#E8A33D"/><text x="724" y="506" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="724" dy="0">갑자기 심하게 붓고 열이 날 때</tspan></text><circle cx="710" cy="532" r="4.5" fill="#E8A33D"/><text x="724" y="538" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="724" dy="0">팔다리 힘이 빠지거나 감각이 둔할 때</tspan></text><circle cx="710" cy="564" r="4.5" fill="#E8A33D"/><text x="724" y="570" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" 