<text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">이유 없이 열나고</tspan><tspan x="834" dy="21">체중이 줄 때</tspan></text>
