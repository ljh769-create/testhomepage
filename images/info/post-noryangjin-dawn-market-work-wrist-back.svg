<rect x="60" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><rect x="82" y="182" width="6" height="44" rx="3" fill="#38608F"/><text x="100" y="204" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="100" dy="0">손목·손</tspan></text><text x="100" y="226" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#38608F" text-anchor="start"><tspan x="100" dy="0">찬물과 젖은 장갑</tspan></text><rect x="82" y="246" width="296" height="58" rx="10" fill="#F4F8FC"/><circle cx="102" cy="275.0" r="5" fill="#38608F"/><text x="116" y="271.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="116" dy="0">방수 장갑 안에</tspan><tspan x="116" dy="19">얇은 면장갑 겹쳐 끼기</tspan></text><rect x="82" y="314" width="296" height="58" rx="10" fill="#F4F8FC"/><circle cx="102" cy="343.0" r="5" fill="#38608F"/><text x="116" y="348.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="116" dy="0">젖으면 바로 갈아 끼기</tspan></text><rect x="82" y="382" width="296" height="58" rx="10" fill="#F4F8FC"/><circle cx="102" cy="411.0" r="5" fill="#38608F"/><text x="116" y="407.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="116" dy="0">쉬는 틈에 따뜻한 물로</tspan><tspan x="116" dy="19">녹이고 물기 닦기</tspan></text><rect x="420" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><rect x="442" y="182" width="6" height="44" rx="3" fill="#5BA68A"/><text x="460" y="204" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="460" dy="0">허리</tspan></text><text x="460" y="226" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#5BA68A" text-anchor="start"><tspan x="460" dy="0">숙여 들고 비트는 동작</tspan></text><rect x="442" y="246" width="296" height="58" rx="10" fill="#F4F8FC"/><circle cx="462" cy="275.0" r="5" fill="#5BA68A"/><text x="476" y="271.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="476" dy="0">무릎을 굽히고 상자를</tspan><tspan x="476" dy="19">몸 가까이 붙여 들기</tspan></text><rect x="442" y="314" width="296" height="58" rx="10" fill="#F4F8FC"/><circle cx="462" cy="343.0" r="5" fill="#5BA68A"/><text x="476" y="339.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="476" dy="0">몸을 비틀지 말고</tspan><tspan x="476" dy="19">발을 옮겨 방향 바꾸기</tspan></text><rect x="442" y="382" width="296" height="58" rx="10" fill="#F4F8FC"/><circle cx="462" cy="411.0" r="5" fill="#5BA68A"/><text x="476" y="407.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="476" dy="0">낮잠은 빛을 가리고</tspan><tspan x="476" dy="19">일정한 시각에</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">기록해 오시면 좋은 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">일하는 시간과 가장</tspan><tspan x="110.0" dy="20">무거운 상자 무게</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">손이 시린 시간대와</tspan><tspan x="330.0" dy="20">작업</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">허리가 아픈 동작</tspan><tspan x="550.0" dy="20">(들 때·비틀 때)</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손가락이 하얗게 변하고</tspan><tspan x="834" dy="21">감각이 돌아오지 않을 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손에 힘이 빠져 물건을</tspan><tspan x="834" dy="21">자주 떨어뜨릴 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">허리 통증과 함께 다리 저림·</tspan><tspan x="834" dy="21">대소변 이상이 생길 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">이런 경우에는 다른 의료기관</tspan><tspan x="816" dy="19">확인이 먼저입니다</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
