<rect x="60" y="160" width="222" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><circle cx="171.0" cy="224" r="34" fill="#DCE8F5"/><g transform="translate(171.0 224) scale(1.0)" fill="none" stroke="#C9788A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -16 a16 16 0 1 0 8 26 a13 13 0 1 1 -8 -26 z"/></g><text x="171.0" y="292" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="171.0" dy="0">잠</tspan></text><text x="171.0" y="326" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="171.0" dy="0">잠드는 시각을</tspan><tspan x="171.0" dy="20">조금씩 함께 맞추기</tspan></text><rect x="141.0" y="432" width="60" height="5" rx="2.5" fill="#C9788A"/><rect x="299" y="160" width="222" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><circle cx="410.0" cy="224" r="34" fill="#DCE8F5"/><g transform="translate(410.0 224) scale(1.0)" fill="none" stroke="#C9788A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 -2 h40 a20 18 0 0 1 -40 0 z"/><path d="M-8 -8 q4 -6 0 -12 M2 -8 q4 -6 0 -12"/></g><text x="410.0" y="292" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="410.0" dy="0">술·담배</tspan></text><text x="410.0" y="326" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="410.0" dy="0">두 사람이</tspan><tspan x="410.0" dy="20">함께 줄이기</tspan></text><rect x="380.0" y="432" width="60" height="5" rx="2.5" fill="#C9788A"/><rect x="538" y="160" width="222" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><circle cx="649.0" cy="224" r="34" fill="#DCE8F5"/><g transform="translate(649.0 224) scale(1.0)" fill="none" stroke="#C9788A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-14" r="6"/><path d="M0 -8 v16 M-12 -2 l12 -2 l12 2 M0 8 l-8 14 M0 8 l8 14"/></g><text x="649.0" y="292" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="649.0" dy="0">걷기</tspan></text><text x="649.0" y="326" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="649.0" dy="0">일주일에 몇 번</tspan><tspan x="649.0" dy="20">함께 걷는 시간</tspan></text><rect x="619.0" y="432" width="60" height="5" rx="2.5" fill="#C9788A"/><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">상담 때 가져오시면 좋은 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">최근 생리 시작일과</tspan><tspan x="110.0" dy="20">주기 기록</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">두 분의 근무·수면</tspan><tspan x="330.0" dy="20">음주·흡연 정도</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">복용 약·영양제</tspan><tspan x="550.0" dy="20">산부인과·비뇨의학과 결과</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 경우</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">1년 이상 임신이</tspan><tspan x="834" dy="21">되지 않는 경우</tspan><tspan x="834" dy="21">(35세 이상은 6개월)</tspan></text><circle cx="820" cy="310" r="4.5" fill="#E8A33D"/><text x="834" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">생리가 매우 불규칙하거나</tspan><tspan x="834" dy="21">심한 통증이 있는 경우</tspan></text><circle cx="820" cy="365" r="4.5" fill="#E8A33D"/><text x="834" y="371" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">기존 질환으로</tspan><tspan x="834" dy="21">약을 드시는 경우</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">산부인과·비뇨의학과 확인이 먼저</tspan><tspan x="816" dy="19">영양제는 의사·약사와 상의</tspan></text>
