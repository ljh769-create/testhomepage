 font-size="13" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="148.0" dy="0">다음 끼니</tspan><tspan x="148.0" dy="18">굶기</tspan></text><text x="280" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#C9575B" text-anchor="middle"><tspan x="280" dy="0">먹은 것보다</tspan><tspan x="280" dy="20">먹게 된 순간의</tspan><tspan x="280" dy="20">마음을 살펴요</tspan></text><rect x="90" y="534" width="380" height="70" rx="12" fill="#DCE8F5"/><text x="280" y="563" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="280" dy="0">한 번 많이 먹었다고 그동안의</tspan><tspan x="280" dy="20">노력이 사라지지 않습니다</tspan></text><rect x="520" y="160" width="250" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">일상에서 해 볼 것</tspan></text><rect x="546" y="220" width="200" height="68" rx="14" fill="#2C4568"/><text x="562" y="250" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">끼니를 거르지 않고</tspan><tspan x="562" dy="20">규칙적으로 먹기</tspan></text><rect x="546" y="298" width="200" height="68" rx="14" fill="#2C4568"/><text x="562" y="328" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">먹고 싶었던 마음을</tspan><tspan x="562" dy="20">한 줄로 적기</tspan></text><rect x="546" y="376" width="200" height="68" rx="14" fill="#2C4568"/><text x="562" y="406" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">5분 산책·샤워·</tspan