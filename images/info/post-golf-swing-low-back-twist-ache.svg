<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#5BA68A" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">골프 스윙 뒤 허리가 비틀리듯 아플 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">한 방향 회전이 쌓이면 한쪽 허리에 부담이 몰립니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#5BA68A"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">어느 구간에서 아픈지 나눠 보세요</tspan></text><rect x="90" y="222" width="200" height="112" rx="16" fill="#DCE8F5"/><path d="M120 300 q70 -80 140 0" fill="none" stroke="#5BA68A" stroke-width="4" stroke-dasharray="8 6"/><circle cx="190" cy="252" r="8" fill="#5BA68A"/><text x="190" y="322" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="190" dy="0">백스윙</tspan></text><text x="190" y="360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="190" dy="0">몸을 돌려 올릴 때</tspan></text><rect x="310" y="222" width="200" height="112" rx="16" fill="#DCE8F5"/><path d="M340 300 q70 -80 140 0" fill="none" stroke="#5BA68A" stroke-width="4" stroke-dasharray=""/><circle cx="410" cy="262" r="8" fill="#E8A33D"/><text x="410" y="322" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="410" dy="0">임팩트</tspan></text><text x="410" y="360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="410" dy="0">공을 치는 순간</tspan></text><rect x="530" y="222" width="200" height="112" rx="16" fill="#DCE8F5"/><path d="M560 300 q70 -80 140 0" fill="none" stroke="#5BA68A" stroke-width="4" stroke-dasharray="8 6"/><circle cx="630" cy="252" r="8" fill="#5BA68A"/><text x="630" y="322" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="630" dy="0">마무리</tspan></text><text x="630" y="360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="630" dy="0">끝까지 돌아갈 때</tspan></text><text x="90" y="410" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#38608F" text-anchor="start"><tspan x="90" dy="0">연습량은 갑자기 늘리지 않고 며칠에 걸쳐 조금씩</tspan></text><text x="90" y="436" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="90" dy="0">중간중간 반대 방향으로 가볍게 몸을 돌려 균형 맞추기</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">라운드 전후에 이렇게</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">허리·고관절·어깨를</tspan><tspan x="110.0" dy="20">천천히 풀고 시작</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">아픈 날은 스윙을</tspan><tspan x="330.0" dy="20">작게 하거나 쉬기</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">마친 뒤 허리를</tspan><tspan x="550.0" dy="20">앞뒤로 천천히</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">스윙 중 뜨끔한 뒤</tspan><tspan x="834" dy="21">움직이기 어려울 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리로 뻗치는 통증과</tspan><tspan x="834" dy="21">저림이 이어질 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">대소변 조절이 어렵거나</tspan><tspan x="834" dy="21">사타구니 감각이 둔할 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">대소변 문제는 바로 응급실</tspan><tspan x="816" dy="19">복용 약은 임의로 끊지 않기</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>