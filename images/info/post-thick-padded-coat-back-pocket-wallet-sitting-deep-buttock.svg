<text x="562" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">1시간마다 일어나</tspan><tspan x="562" dy="20">물 마시러 다녀오기</tspan></text>
