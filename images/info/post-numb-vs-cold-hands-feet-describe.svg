middle"><tspan x="355" dy="0">같은 자세 뒤, 밤에</tspan></text><rect x="490" y="288" width="250" height="44" rx="10" fill="#F4F8FC"/><text x="615" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="middle"><tspan x="615" dy="0">찬 곳·찬물에 닿을 때</tspan></text><rect x="80" y="340" width="140" height="44" rx="10" fill="#DCE8F5"/><text x="150" y="368" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="150" dy="0">함께 볼 것</tspan></text><rect x="230" y="340" width="250" height="44" rx="10" fill="#F4F8FC"/><text x="355" y="368" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="middle"><tspan x="355" dy="0">손목·목, 작업 자세</tspan></text><rect x="490" y="340" width="250" height="44" rx="10" fill="#F4F8FC"/><text x="615" y="368" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="middle"><tspan x="615" dy="0">몸의 온기와 순환</tspan></text><rect x="80" y="392" width="140" height="44" rx="10" fill="#DCE8F5"/><text x="150" y="420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="150" dy="0">이렇게 해 보기</tspan></text><rect x="230" y="392" width="250" height="44" rx="10" fill="#F4F8FC"/><text x="355" y="420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="middle"><tspan x="355" dy="0">한 시간에 한 번 풀기</tspan></text><rect x="490" y="392" width="250" height="44" rx="10" fill="#F4F8FC"/><text x="615" y="420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="middle"><tspan x="615" dy="0">면장갑·양말로 따뜻하게</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 표시해 오세요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">불편한 손가락·발가락을</tspan><tspan x="110.0" dy="20">그림에 표시</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">날마다 저림인지 시림인지</tspan><tspan x="330.0" dy="20">한 단어로</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">복용 약과</tspan><tspan x="550.0" dy="20">최근 혈당 기록</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갑자기 한쪽 팔다리에 힘이</tspan><tspan x="834" dy="21">빠지거나 말이 어눌할 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">저림이 넓어지고 물건을</tspan><tspan x="834" dy="21">자주 떨어뜨릴 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">대소변 조절이</tspan><tspan x="834" dy="21">어려워졌을 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손발 색이 변하고 상처가</tspan><tspan x="834" dy="21">잘 낫지 않을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">말이 어눌하거나 힘이 빠지면</tspan><tspan x="816" dy="19">바로 119</tspan></text>
