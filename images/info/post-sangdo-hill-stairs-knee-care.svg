<circle cx="312" cy="326" r="12" fill="#E8A33D" opacity="0.55"/>
<text x="470" y="236" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="470" dy="0">허벅지 앞쪽이</tspan><tspan x="470" dy="22">브레이크처럼 버티며</tspan><tspan x="470" dy="22">무릎 앞쪽에 부담</tspan></text>
<text x="470" y="330" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="470" dy="0">무거운 장바구니,</tspan><tspan x="470" dy="22">쿠션 적은 신발도</tspan><tspan x="470" dy="22">부담을 늘립니다</tspan></text>
