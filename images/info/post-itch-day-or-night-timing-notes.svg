gun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">두드러기가 갑자기 번지고</tspan><tspan x="834" dy="21">어지러울 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">긁은 곳이 붓고 뜨겁고</tspan><tspan x="834" dy="21">고름이 생길 때</tspan></text><text x="816" y="606" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">바르는 약은 이름과 기간을 알려 주세요</tspan></text>
