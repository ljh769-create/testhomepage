ize="15" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="502" dy="0">필요한 책만 넣기</tspan></text><rect x="457" y="350" width="296" height="50" rx="14" fill="#DCE8F5"/><path d="M474 375 l6 6 l10 -12" stroke="#38608F" stroke-width="3" fill="none" stroke-linecap="round"/><text x="502" y="381" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="502" dy="0">한쪽이면 좌우 번갈아</tspan></text><rect x="457" y="414" width="296" height="50" rx="14" fill="#DCE8F5"/><path d="M474 439 l6 6 l10 -12" stroke="#38608F" stroke-width="3" fill="none" stroke-linecap="round"/><text x="502" y="445" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="502" dy="0">저녁에 어깨 돌리고 가슴 펴기</tspan></text><rect x="790" y="160" width="350" height="330" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="232" r="4.5" fill="#E8A33D"/><text x="834" y="238" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">팔이나 손이 저리고</tspan><tspan x="834" dy="20">힘이 빠지는 경우</tspan></text><circle cx="820" cy="284" r="4.5" fill="#E8A33D"/><text x="834" y="290" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">어깨·등 통증이 밤에</tspan><tspan x="834" dy="20">더 심해지는 경우</tspan></text><circle cx="820" cy="336" r="4.5" fill="#E8A33D"/><text x="834" y="342" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">등이 한쪽으로 휘어 보이고</tspan><tspan x="834" dy="20">점점 심해지는 경우</tspan></text><rect x="60" y="510" width="1080" height="120" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="546" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">기록해 오시면 좋은 것</tspan></text><circle cx="96.0" cy="580" r="5" fill="#FBE78A"/><text x="110.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">가방 무게와 메는 쪽</tspan></text><circle cx="436.0" cy="580" r="5" fill="#FBE78A"/><text x="450.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="450.0" dy="0">달라 보이는 부위 사진</tspan></text><circle cx="776.0" cy="580" r="5" fill="#FBE78A"/><text x="790.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="790.0" dy="0">측만 검사 결과(있다면)</tspan></text>
