y="378.0" r="24" fill="#DCE8F5"/><g transform="translate(128 378.0) scale(0.7)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 0 q5 -10 10 0 t10 0 t10 0 t10 0"/><path d="M-20 10 q5 -10 10 0 t10 0 t10 0 t10 0"/></g><text x="164" y="364" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="164" dy="0">설태</tspan></text><text x="164" y="390" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="164" dy="0">혀 위에 덮인</tspan><tspan x="164" dy="19">막의 모습</tspan></text><rect x="420" y="330" width="310" height="96" rx="14" fill="#F4F8FC"/><circle cx="458" cy="378.0" r="24" fill="#DCE8F5"/><g transform="translate(458 378.0) scale(0.7)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -18 C10 -4 14 2 14 8 a14 14 0 0 1 -28 0 c0 -6 4 -12 14 -26 z"/></g><text x="494" y="364" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="494" dy="0">물기</tspan></text><text x="494" y="390" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="494" dy="0">혀가 촉촉한지,</tspan><tspan x="494" dy="19">마른 편인지</tspan></text><text x="410" y="456" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#4A5D75" text-anchor="middle"><tspan x="410" dy="0">밝은 곳에서 혀를 내밀어 잠깐 봅니다 · 아프지 않아요</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">방문 전에 해 볼 것</tspan></text><circle cx="96.0" cy="566" r="5" fill="#FBE78A"/><text x="110.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">커피·카레·사탕 등</tspan><tspan x="110.0" dy="20">물드는 음식 피하기</tspan></text><circle cx="316.0" cy="566" r="5" fill="#FBE78A"/><text x="330.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">양치는 평소처럼,</tspan><tspan x="330.0" dy="20">혀는 세게 긁지 않기</tspan></text><circle cx="536.0" cy="566" r="5" fill="#FBE78A"/><text x="550.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">같은 시간·조명에서</tspan><tspan x="550.0" dy="20">혀 사진 남기기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">혀에 2주 넘게 낫지 않는</tspan><tspan x="834" dy="21">상처나 궤양이 있을 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">하얗거나 붉은 반점,</tspan><tspan x="834" dy="21">단단한 덩어리가 보일 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">혀가 갑자기 붓고 숨쉬기나</tspan><tspan x="834" dy="21">삼키기가 어려울 때</tspan><tspan x="834" dy="21">(즉시 119나 응급실)</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">치과나 이비인후과 등에서</tspan><tspan x="816" dy="19">먼저 확인받으세요</tspan></text>
