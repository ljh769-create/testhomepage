ic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">두근거림·손떨림,</tspan><tspan x="834" dy="21">체중 변화가 있을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">해칠 것 같은 생각이 들면</tspan><tspan x="816" dy="19">109로 바로</tspan></text>
