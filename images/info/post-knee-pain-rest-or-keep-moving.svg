<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">무릎이 아프면 운동을 다 쉬어야 할까요</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">지금 무릎 상태에 맞는 움직임을 찾아요</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="320" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">쉴 때와 움직일 때를 나눠요</tspan></text><rect x="90.0" y="222" width="201.33333333333334" height="116" rx="14" fill="#F4F8FC"/><circle cx="116.0" cy="250" r="15" fill="#38608F"/><text x="116.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="116.0" dy="0">1</tspan></text><text x="138.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="138.0" dy="0">붓기·열감 시기</tspan></text><text x="108.0" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="108.0" dy="0">무리한 운동보다</tspan><tspan x="108.0" dy="19">쉬는 것이 먼저</tspan></text><path d="M295.33333333333337 273.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="309.33333333333337" y="222" width="201.33333333333334" height="116" rx="14" fill="#F4F8FC"/><circle cx="335.33333333333337" cy="250" r="15" fill="#38608F"/><text x="335.33333333333337" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="335.33333333333337" dy="0">2</tspan></text><text x="357.33333333333337" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="357.33333333333337" dy="0">그렇지 않다면</tspan></text><text x="327.33333333333337" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="327.33333333333337" dy="0">완전히 멈추기보다</tspan><tspan x="327.33333333333337" dy="19">강도·종류 조절</tspan></text><path d="M514.6666666666667 273.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="528.6666666666667" y="222" width="201.33333333333334" height="116" rx="14" fill="#F4F8FC"/><circle cx="554.6666666666667" cy="250" r="15" fill="#38608F"/><text x="554.6666666666667" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="554.6666666666667" dy="0">3</tspan></text><text x="576.6666666666667" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="576.6666666666667" dy="0">다음 날 확인</tspan></text><text x="546.6666666666667" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="546.6666666666667" dy="0">통증이 더 심하면</tspan><tspan x="546.6666666666667" dy="19">양을 절반으로</tspan></text><circle cx="96" cy="373" r="5" fill="#38608F"/><text x="110" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">오래 쉬면 허벅지 근육이 줄어</tspan><tspan x="110" dy="20">무릎 부담이 커지기도 해요</tspan></text><circle cx="96" cy="433" r="5" fill="#38608F"/><text x="110" y="438" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">계단 내려가기·쪼그려 앉기는 부담이 돼요</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일상에서 해 볼 것</tspan></text><circle cx="96.0" cy="566" r="5" fill="#FBE78A"/><text x="110.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">평지 걷기</tspan><tspan x="110.0" dy="20">10~15분부터</tspan></text><circle cx="316.0" cy="566" r="5" fill="#FBE78A"/><text x="330.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">계단은 난간 잡고</tspan><tspan x="330.0" dy="20">한 칸씩 천천히</tspan></text><circle cx="536.0" cy="566" r="5" fill="#FBE78A"/><text x="550.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">무릎 펴고 5초</tspan><tspan x="550.0" dy="20">버티기 하루 10회</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">무릎이 갑자기 크게</tspan><tspan x="834" dy="21">붓고 뜨거워졌을 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어진 뒤 체중을</tspan><tspan x="834" dy="21">싣기 어려울 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">무릎이 걸려서</tspan><tspan x="834" dy="21">펴지지 않을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">다친 직후 심하게 붓거나 변형되면</tspan><tspan x="816" dy="19">정형외과·응급실 먼저</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
