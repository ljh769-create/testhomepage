<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">진료 전 증상 메모, 세 가지면 됩니다</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">언제부터 · 어떤 동작에서 · 얼마나</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="226" height="150" rx="22" fill="#FFFFFF" filter="url(#sh)"/><circle cx="94" cy="194" r="15" fill="#38608F"/><text x="94" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="94" dy="0">1</tspan></text><text x="118" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="118" dy="0">언제부터</tspan></text><text x="84" y="246" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="84" dy="0">며칠 전, 몇 주 전,</tspan><tspan x="84" dy="22">어떤 계기 뒤</tspan></text><rect x="297" y="160" width="226" height="150" rx="22" fill="#FFFFFF" filter="url(#sh)"/><circle cx="331" cy="194" r="15" fill="#38608F"/><text x="331" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="331" dy="0">2</tspan></text><text x="355" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="355" dy="0">어떤 동작에서</tspan></text><text x="321" y="246" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="321" dy="0">계단 내려갈 때,</tspan><tspan x="321" dy="22">일어설 때, 누울 때</tspan></text><rect x="534" y="160" width="226" height="150" rx="22" fill="#FFFFFF" filter="url(#sh)"/><circle cx="568" cy="194" r="15" fill="#38608F"/><text x="568" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="568" dy="0">3</tspan></text><text x="592" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="592" dy="0">얼마나</tspan></text><text x="558" y="246" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="558" dy="0">난간을 잡는다,</tspan><tspan x="558" dy="22">밤에 깬다</tspan></text><rect x="60" y="330" width="700" height="130" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="364" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">이런 한 줄이면 충분합니다</tspan></text><rect x="86" y="380" width="212" height="62" rx="14" fill="#F4F8FC"/><text x="192" y="406" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#1F3552" text-anchor="middle"><tspan x="192" dy="0">“계단 내려갈 때 오른쪽</tspan><tspan x="192" dy="19">무릎이 아파 난간을 잡아요”</tspan></text><rect x="310" y="380" width="212" height="62" rx="14" fill="#F4F8FC"/><text x="416" y="406" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#1F3552" text-anchor="middle"><tspan x="416" dy="0">“새벽 4시쯤 깨서</tspan><tspan x="416" dy="19">다시 잠들기 어려워요”</tspan></text><rect x="534" y="380" width="212" height="62" rx="14" fill="#F4F8FC"/><text x="640" y="406" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#1F3552" text-anchor="middle"><tspan x="640" dy="0">“식후 30분쯤 속이</tspan><tspan x="640" dy="19">더부룩하고 트림이 나요”</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">다시 오시는 날에는</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">지난 치료 뒤 달라진</tspan><tspan x="110.0" dy="20">점 한 가지</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">좋아진 점과 아직</tspan><tspan x="330.0" dy="20">그대로인 점</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">새로 생긴 불편과</tspan><tspan x="550.0" dy="20">바뀐 약</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갑자기 시작된 심한 통증,</tspan><tspan x="834" dy="21">점점 심해지는 통증</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">열, 숨참, 가슴 통증이</tspan><tspan x="834" dy="21">함께 있을 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">팔다리에 힘이 빠지거나</tspan><tspan x="834" dy="21">말이 어눌해질 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">메모보다 진료가 먼저입니다.</tspan><tspan x="816" dy="19">응급이면 가까운 응급실</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>