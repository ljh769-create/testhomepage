<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">라운드숄더 직장인, 두통이 잦을 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">자세·눈·잠·카페인·두통약 2~4주 기록</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="440" height="466" rx="22" fill="#FFFFFF" filter="url(#sh)"/>
<text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">먼저 이렇게 여쭙니다</tspan></text>
<rect x="90" y="222" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="255" r="21" fill="#DCE8F5"/><g transform="translate(124 255) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-18" y="-14" width="36" height="32" rx="5"/><path d="M-18 -4 h36 M-9 -20 v8 M9 -20 v8"/></g>
<text x="158" y="261" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">두통은 어디서 시작되나요</tspan></text>
<rect x="90" y="300" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="333" r="21" fill="#DCE8F5"/><g transform="translate(124 333) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -18 a18 18 0 1 0 10 26 a14 14 0 0 1 -10 -26 z"/></g>
<text x="158" y="339" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">조이나요, 욱신거리나요</tspan></text>
<rect x="90" y="378" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="411" r="21" fill="#DCE8F5"/><g transform="translate(124 411) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="17"/><path d="M0 -9 v9 l7 5"/></g>
<text x="158" y="417" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">하루 중 언제 심해지나요</tspan></text>
<rect x="90" y="456" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="489" r="21" fill="#DCE8F5"/><g transform="translate(124 489) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 -10 h20 v12 a10 10 0 0 1 -20 0 z M6 -6 h4 a5 5 0 0 1 0 10 h-4 M-8 -20 v5 M-2 -20 v5"/></g>
<text x="158" y="495" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">두통약은 주에 며칠 드시나요</tspan></text>
<rect x="90" y="540" width="380" height="64" rx="14" fill="#DCE8F5"/>
<text x="110" y="565" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="110" dy="0">어깨를 억지로 펴기보다</tspan></text>
<text x="110" y="589" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">한 시간에 한 번 가슴 펴고 어깨 돌리기</tspan></text>
<rect x="520" y="160" width="250" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/>
<text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">자리별로 다시 맞추기</tspan></text>
<rect x="546" y="218" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">모니터: 위쪽을 눈높이에</tspan></text>
<rect x="546" y="288" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">노트북: 받침대 위에,</tspan><tspan x="562" dy="20">키보드는 따로</tspan></text>
<rect x="546" y="358" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">스마트폰: 눈높이로 들기</tspan></text>
<rect x="546" y="428" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">통화가 잦으면 이어폰 쓰기</tspan></text>
<rect x="546" y="500" width="200" height="104" rx="14" fill="#FFFFFF"/>
<text x="562" y="526" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="562" dy="0">틈틈이 풀어 주기</tspan></text>
<text x="562" y="550" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="562" dy="0">고개 천천히 좌우로 돌리기</tspan><tspan x="562" dy="19">어깨 올렸다가 툭 내리기</tspan><tspan x="562" dy="19">윗니·아랫니 살짝 떼기</tspan></text>
<rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/>
<text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text>
<text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text>
<circle cx="820" cy="234" r="4.5" fill="#E8A33D"/>
<text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갑작스러운 극심한 두통·전과 다른 두통</tspan></text>
<circle cx="820" cy="289" r="4.5" fill="#E8A33D"/>
<text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">말 어눌함·한쪽 힘 빠짐·시야 이상</tspan></text>
<circle cx="820" cy="344" r="4.5" fill="#E8A33D"/>
<text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">열과 함께 목이 뻣뻣할 때</tspan></text>
<circle cx="820" cy="399" r="4.5" fill="#E8A33D"/>
<text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">50세 이후 처음 생긴 두통</tspan></text>
<circle cx="820" cy="454" r="4.5" fill="#E8A33D"/>
<text x="834" y="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">머리를 다친 뒤 점점 심해지는 두통</tspan></text>
<text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">위 신호는 가까운 응급실·의과 진료 먼저</tspan><tspan x="816" dy="19">두통약은 의사·약사와 먼저 상의</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>
