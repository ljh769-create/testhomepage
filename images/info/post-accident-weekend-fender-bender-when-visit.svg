D Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">머리를 부딪혔거나</tspan><tspan x="834" dy="20">두통·구토·어지럼</tspan></text><circle cx="820" cy="284" r="4.5" fill="#E8A33D"/><text x="834" y="290" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">팔다리 저림이나</tspan><tspan x="834" dy="20">힘 빠짐이 있는 경우</tspan></text><circle cx="820" cy="336" r="4.5" fill="#E8A33D"/><text x="834" y="342" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">가슴·배가 아프거나</tspan><tspan x="834" dy="20">숨쉬기 불편한 경우</tspan></text><rect x="60" y="510" width="1080" height="120" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="546" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">사고 당일과 다음 날</tspan></text><circle cx="96.0" cy="580" r="5" fill="#FBE78A"/><text x="110.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">무리한 운동과 술 피하기</tspan></text><circle cx="436.0" cy="580" r="5" fill="#FBE78A"/><text x="450.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="450.0" dy="0">통증이 처음 느껴진 시각 기록</tspan></text><circle cx="776.0" cy="580" r="5" fill="#FBE78A"/><text x="790.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="790.0" dy="0">앉은 자리·충돌 방향 메모</tspan></text>
