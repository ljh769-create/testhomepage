-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">코피·딱지가 한쪽인지 양쪽인지</tspan></text><rect x="90" y="456" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="489" r="21" fill="#DCE8F5"/><g transform="translate(124 489) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-20" y="-8" width="40" height="16" rx="8"/><path d="M0 -8 v16"/></g><text x="158" y="495" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">감기약이나 코 스프레이 사용</tspan></text><rect x="520" y="160" width="250" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">일상에서 해 볼 것</tspan></text><rect x="546" y="218" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">실내 습도 40~60%,</tspan><tspan x="562" dy="20">가습기 물 매일 갈기</tspan></text><rect x="546" y="288" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">물을 한두 시간마다</tspan><tspan x="562" dy="20">나누어 마시기</tspan></text><rect x="546" y="358" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">코는 한쪽씩 살살,</tspan><tspan x="562" dy="20">식염수 분무하기</tspan></text><rect x="546" y="428" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">손가락으로 딱지</tspan><tspan x="562" dy="20">떼지 않기</tspan></text><rect x="546" y="500" width="200" height="104" rx="14" fill="#FFFFFF"/><text x="562" y="526" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="562" dy="0">적어 오시면 좋아요</tspan></text><text x="562" y="550" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="562" dy="0">코피 난 날짜와 쪽,</tspan><tspan x="562" dy="19">쓰는 약 이름</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">코피가 잦거나 10~20분</tspan><tspan x="834" dy="21">눌러도 안 멈출 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">한쪽만 막히고 피 섞인</tspan><tspan x="834" dy="21">분비물이 있을 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">얼굴 통증과 열이</tspan><tspan x="834" dy="21">함께 있을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">코피가 안 멈추면</tspan><tspan x="816" dy="19">바로 응급실로</tspan></text>
