o Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="446" dy="0">앉았다 일어서거나</tspan></text><text x="446" y="286" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="446" dy="0">계단을 오르기 시작할 때</tspan></text><text x="446" y="330" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#38608F" text-anchor="start"><tspan x="446" dy="0">혈압이 잠깐 떨어지는</tspan></text><text x="446" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#38608F" text-anchor="start"><tspan x="446" dy="0">경우가 있어요</tspan></text><rect x="60" y="398" width="700" height="228" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="436" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">역 계단에서는 넘어지지 않는 것이 먼저</tspan></text><path d="M96 600 h70 v-34 h70 v-34 h70 v-34 h70" stroke="#90B2DD" stroke-width="5" fill="none" stroke-linejoin="round"/><path d="M100 560 L376 458" stroke="#E8A33D" stroke-width="4" stroke-linecap="round"/><text x="240" y="470" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="800" fill="#8A5A12" text-anchor="middle"><tspan x="240" dy="0">난간</tspan></text><rect x="420" y="458" width="156" height="68" rx="14" fill="#F4F8FC"/><circle cx="442" cy="480" r="15" fill="#38608F"/><text x="442" y="486" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="442" dy="0">1</tspan></text><text x="466" y="486" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight=