name: 매일 새 글 반영 및 배포

# 매일 한국 시간 오전 6시에 build.py 를 돌려 그날 올라갈 글(예약 발행)을 반영한 뒤 사이트를 배포합니다.
# main 에 푸시할 때와 수동 실행(Actions 탭 > Run workflow)에서도 배포됩니다.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = KST 06:00
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 오늘 날짜 기준으로 글 빌드
        run: python build.py
      - name: 끊긴 링크 검사
        run: python tools/check_links.py
      - name: 배포 폴더 만들기
        run: |
          mkdir _site
          cp -r guide icons art images audio data _site/
          cp *.html *.css *.js *.txt *.xml CNAME _site/
          cp favicon.ico favicon.svg apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest _site/
          rm -f _site/admin.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  ping:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 새 글 주소를 검색엔진(네이버·빙)에 알리기
        run: |
          python build.py
          sleep 30
          python tools/indexnow.py || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
