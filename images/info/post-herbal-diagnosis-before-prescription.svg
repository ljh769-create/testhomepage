chor="middle"><tspan x="651" dy="0">맥진</tspan></text><text x="651" y="276" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="651" dy="0">맥의 느낌</tspan></text><rect x="90" y="304" width="150" height="70" rx="14" fill="#F4F8FC"/><text x="165" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="165" dy="0">혈압·맥박</tspan></text><text x="165" y="358" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="165" dy="0">기본 수치</tspan></text><rect x="252" y="304" width="150" height="70" rx="14" fill="#F4F8FC"/><text x="327" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="327" dy="0">검사 결과</tspan></text><text x="327" y="358" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="327" dy="0">있으면 참고</tspan></text><rect x="414" y="304" width="150" height="70" rx="14" fill="#F4F8FC"/><text x="489" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="489" dy="0">체질 경향</tspan></text><text x="489" y="358" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="489" dy="0">참고로만</tspan></text><rect x="576" y="304" width="154" height="70" rx="14" fill="#3E9C8A"/><text x="653" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="653" dy="0">그다음에</tspan></text><text x="653" y="356" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="653" dy="0">처방 여부 결정</tspan></text><rect x="90" y="392" width="640" height="64" rx="12" fill="#DCE8F5"/><text x="410" y="418" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="410" dy="0">같은 피로도 잠 부족·소화 불편·몸의 변화·긴장 등</tspan><tspan x="410" dy="20">이유가 달라 한약이 필요 없다고 안내하기도 해요</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">상담 전에 챙기면 좋은 것</tspan></text><circle cx="96.0" cy="566" r="5" fill="#FBE78A"/><text x="110.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">최근 건강검진</tspan><tspan x="110.0" dy="20">결과지</tspan></text><circle cx="316.0" cy="566" r="5" fill="#FBE78A"/><text x="330.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">먹는 약·영양제</tspan><tspan x="330.0" dy="20">목록</tspan></text><circle cx="536.0" cy="566" r="5" fill="#FBE78A"/><text x="550.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">1~2주 식사 시각과</tspan><tspan x="550.0" dy="20">잠 메모</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갑작스러운 가슴 통증,</tspan><tspan x="834" dy="21">호흡곤란, 심한 두통,</tspan><tspan x="834" dy="21">한쪽 팔다리 마비 (바로 가까운 응급실)</tspan></text><circle cx="820" cy="310" r="4.5" fill="#E8A33D"/><text x="834" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">원인 모를 체중 감소나</tspan><tspan x="834" dy="21">혈변이 있을 때</tspan></text><circle cx="820" cy="365" r="4.5" fill="#E8A33D"/><text x="834" y="371" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">임신 중이거나</tspan><tspan x="834" dy="21">임신을 계획 중일 때</tspan><tspan x="834" dy="21">(반드시 미리 알려 주세요)</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">복용 중인 약은 상의 없이</tspan><tspan x="816" dy="19">줄이거나 끊지 않습니다</tspan></text>
