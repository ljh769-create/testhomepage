<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">같은 쪽으로만 쓰는 습관, 이렇게 나눠요</tspan></text><text x="90" y="260" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="90" dy="0">돌아설 때</tspan></text><rect x="186" y="222" width="240" height="62" rx="14" fill="#F4F8FC"/><text x="306" y="259" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#4A5D75" text-anchor="middle"><tspan x="306" dy="0">허리만 비틀기</tspan></text><path d="M432 253 H460" stroke="#38608F" stroke-width="4"/><path d="M456 244 l12 9 l-12 9" fill="none" stroke="#38608F" stroke-width="4"/><rect x="476" y="222" width="254" height="62" rx="14" fill="#DCE8F5"/><text x="603" y="259" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="603" dy="0">발을 돌려 방향 바꾸기</tspan></text><text x="90" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="90" dy="0">서 있을 때</tspan></text><rect x="186" y="296" width="240" height="62" rx="14" fill="#F4F8FC"/><text x="306" y="333" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#4A5D75" text-anchor="middle"><tspan x="306" dy="0">한쪽 다리에만 체중</tspan></text><path d="M432 327 H460" stroke="#38608F" stroke-width="4"/><path d="M456 318 l12 9 l-12 9" fill="none" stroke="#38608F" stroke-width="4"/><rect x="476" y="296" width="254" height="62" rx="14" fill="#DCE8F5"/><text x="603" y="333" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="603" dy="0">가끔 반대쪽으로 옮기기</tspan></text><text x="90" y="408" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="90" dy="0">무거운 짐</tspan></text><rect x="186" y="370" width="240" height="62" rx="14" fill="#F4F8FC"/><text x="306" y="407" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#4A5D75" text-anchor="middle"><tspan x="306" dy="0">팔 뻗은 채 들기</tspan></text><path d="M432 401 H460" stroke="#38608F" stroke-width="4"/><path d="M456 392 l12 9 l-12 9" fill="none" stroke="#38608F" stroke-width="4"/><rect x="476" y="370" width="254" height="62" rx="14" fill="#DCE8F5"/><text x="603" y="407" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="603" dy="0">몸 가까이, 무릎 굽혀 들기</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">함께 해 볼 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">쉬는 시간엔 짧게</tspan><tspan x="110.0" dy="20">앉아 허리 힘 빼기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">퇴근 후 허리를</tspan><tspan x="330.0" dy="20">천천히 앞뒤로</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">아픈 쪽과 주로</tspan><tspan x="550.0" dy="20">돌리는 방향 적기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리로 뻗치는 통증과</tspan><tspan x="834" dy="21">감각이 둔해질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">허리 통증과 함께 열이 나거나</tspan><tspan x="834" dy="21">소변 보기 어려울 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">한쪽 다리가 눈에 띄게</tspan><tspan x="834" dy="21">붓고 아플 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">다리가 갑자기 붓고 아프면</tspan><tspan x="816" dy="19">다른 의료기관 확인이 먼저</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
