<rect x="60" y="160" width="440" height="466" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">먼저 이렇게 여쭙니다</tspan></text><rect x="90" y="222" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="255" r="21" fill="#DCE8F5"/><g transform="translate(124 255) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="18"/><path d="M0 -10 v10 l8 6"/></g><text x="158" y="261" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">재는 시각(공복·식후)</tspan></text><rect x="90" y="300" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="333" r="21" fill="#DCE8F5"/><g transform="translate(124 333) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -20 c8 10 14 18 14 26 a14 14 0 0 1 -28 0 c0 -8 6 -16 14 -26 z"/></g><text x="158" y="339" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">씻고 물기를 말리는지</tspan></text><rect x="90" y="378" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="411" r="21" fill="#DCE8F5"/><g transform="translate(124 411) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-20" y="-8" width="40" height="16" rx="3"/><path d="M-12 -8 v6 M-4 -8 v8 M4 -8 v6 M12 -8 v8"/></g><text x="158" y="417" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">어느 손가락·어느 자리</tspan></text><rect x="90" y="456" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="489" r="21" fill="#DCE8F5"/><g transform="translate(124 489) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-18" width="28" height="36" rx="4"/><path d="M-7 -8 h14 M-7 0 h14 M-7 8 h8"/></g><text x="158" y="495" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">측정기·시험지 보관 장소</tspan></text><rect x="520" y="160" width="250" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">일상에서 해 볼 것</tspan></text><rect x="546" y="218" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">따뜻한 물로 30초 씻고</tspan><tspan x="562" dy="20">물기를 완전히 닦기</tspan></text><rect x="546" y="288" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">팔을 아래로 내려</tspan><tspan x="562" dy="20">손끝에 피 모으기</tspan></text><rect x="546" y="358" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">손끝 옆쪽을 찌르고</tspan><tspan x="562" dy="20">손가락은 돌아가며</tspan></text><rect x="546" y="428" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">세게 짜지 말고 손바닥에서</tspan><tspan x="562" dy="20">손끝 방향으로 쓸기</tspan></text><rect x="546" y="500" width="200" height="104" rx="14" fill="#FFFFFF"/><text x="562" y="526" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="562" dy="0">적어 오시면 좋아요</tspan></text><text x="562" y="550" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="562" dy="0">수치와 함께 손이 찼는지,</tspan><tspan x="562" dy="19">다시 찔렀는지 메모</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">식은땀·손떨림·두근거림</tspan><tspan x="834" dy="21">등 저혈당 의심 증상</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갈증·잦은 소변에</tspan><tspan x="834" dy="21">체중이 줄 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">정해 준 범위를 크게</tspan><tspan x="834" dy="21">벗어나는 날이 이어질 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손발 끝 색이 변하고</tspan><tspan x="834" dy="21">상처가 잘 안 나을 때</tspan></text><circle cx="820" cy="454" r="4.5" fill="#E8A33D"/><text x="834" y="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">발 감각이 둔해지거나</tspan><tspan x="834" dy="21">저림·통증이 심할 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">의식이 흐려지거나 말이</tspan><tspan x="816" dy="19">어눌해지면 바로 119</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
