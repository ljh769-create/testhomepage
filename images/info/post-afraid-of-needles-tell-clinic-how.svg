<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">침이 무서울 때, 이렇게 말하면 됩니다</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">무엇을 어떤 순서로 하는지 먼저 말씀드립니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">접수나 상담 때 이렇게 말해 보세요</tspan></text><rect x="90" y="222" width="310" height="84" rx="18" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M126 306 l-6 16 l22 -16 z" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M120 305 h26" stroke="#F4F8FC" stroke-width="4"/><text x="112" y="258" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="112" dy="0">“침이 무서워요.”</tspan></text><text x="112" y="284" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="112" dy="0">먼저 말해 주시면 됩니다</tspan></text><rect x="420" y="222" width="310" height="84" rx="18" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M456 306 l-6 16 l22 -16 z" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M450 305 h26" stroke="#F4F8FC" stroke-width="4"/><text x="442" y="258" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="442" dy="0">“예전에 어지러웠어요.”</tspan></text><text x="442" y="284" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="442" dy="0">식은땀·어지럼 경험</tspan></text><rect x="90" y="334" width="310" height="84" rx="18" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M126 418 l-6 16 l22 -16 z" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M120 417 h26" stroke="#F4F8FC" stroke-width="4"/><text x="112" y="370" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="112" dy="0">“다른 방법부터 할게요.”</tspan></text><text x="112" y="396" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="112" dy="0">침 없이 시작할지 함께 정해요</tspan></text><rect x="420" y="334" width="310" height="84" rx="18" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M456 418 l-6 16 l22 -16 z" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M450 417 h26" stroke="#F4F8FC" stroke-width="4"/><text x="442" y="370" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="442" dy="0">“누워서 받고 싶어요.”</tspan></text><text x="442" y="396" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="442" dy="0">편한 자세를 말해 주세요</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">오시는 날에는</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">가볍게 식사하고 오기</tspan><tspan x="110.0" dy="20">(공복이면 어지럽기 쉬움)</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">치료 중 천천히</tspan><tspan x="330.0" dy="20">깊게 숨 쉬기</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">가족과 함께 와서</tspan><tspan x="550.0" dy="20">옆에 있어 달라고 하기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">치료 중 어지럽거나 식은땀,</tspan><tspan x="834" dy="21">메스꺼움 (참지 말고 바로 말씀)</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">가슴이 답답하거나</tspan><tspan x="834" dy="21">숨쉬기 어려울 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">바늘을 보고 쓰러진 적이</tspan><tspan x="834" dy="21">있다면 미리 꼭 알리기</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">숨쉬기 어렵거나 의식이 흐려지면</tspan><tspan x="816" dy="19">즉시 가까운 응급실</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>