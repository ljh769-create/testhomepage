<rect x="40" y="496" width="1120" height="104" rx="22" fill="#1F3552"/>
<text x="70" y="534" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="700" fill="#FBE78A" text-anchor="start"><tspan x="70" dy="0">다시 잴 때는</tspan></text>
<circle cx="78.0" cy="566" r="7" fill="#FBE78A"/>
<text x="94.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" fill="#fff" text-anchor="start"><tspan x="94.0" dy="0">결과지를 날짜별로 모아 두기</tspan></text>
<circle cx="431.3333333333333" cy="566" r="7" fill="#FBE78A"/>
<text x="447.3333333333333" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" fill="#fff" text-anchor="start"><tspan x="447.3333333333333" dy="0">비슷한 시간대·식사 간격으로</tspan></text>
<circle cx="784.6666666666666" cy="566" r="7" fill="#FBE78A"/>
<text x="800.6666666666666" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" fill="#fff" text-anchor="start"><tspan x="800.6666666666666" dy="0">한 번보다 몇 주의 흐름으로</tspan></text>
<text x="600" y="640" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#38608F" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
