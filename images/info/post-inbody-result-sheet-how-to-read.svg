<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="38" font-weight="800" fill="#1F3552">인바디 결과지, 이 칸부터 보세요</text>
<text x="60" y="112" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" fill="#38608F">체중 한 칸보다 골격근량·체지방량의 변화를 함께</text>
