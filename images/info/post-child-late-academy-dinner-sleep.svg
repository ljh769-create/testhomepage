<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">학원 가는 날, 이렇게 나눠 보세요</tspan></text><path d="M110 270 H710" stroke="#90B2DD" stroke-width="4"/><circle cx="130" cy="270" r="14" fill="#38608F"/><text x="130" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#4A5D75" text-anchor="middle"><tspan x="130" dy="0">방과 후</tspan></text><text x="130" y="312" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="130" dy="0">든든한 간식</tspan></text><text x="130" y="336" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="130" dy="0">주먹밥·김밥</tspan></text><circle cx="320" cy="270" r="14" fill="#38608F"/><text x="320" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#4A5D75" text-anchor="middle"><tspan x="320" dy="0">학원 전</tspan></text><text x="320" y="312" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="320" dy="0">숙제 일부</tspan></text><text x="320" y="336" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="320" dy="0">저녁 전에</tspan></text><circle cx="510" cy="270" r="14" fill="#E8A33D"/><text x="510" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#4A5D75" text-anchor="middle"><tspan x="510" dy="0">늦은 저녁</tspan></text><text x="510" y="312" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="510" dy="0">양은 적게</tspan></text><text x="510" y="336" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="510" dy="0">기름진 것 피하기</tspan></text><circle cx="700" cy="270" r="14" fill="#38608F"/><text x="700" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#4A5D75" text-anchor="middle"><tspan x="700" dy="0">잠들기 1시간 전</tspan></text><text x="700" y="312" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="700" dy="0">화면 끄기</tspan></text><text x="700" y="336" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="700" dy="0">씻고 눕기</tspan></text><rect x="90" y="370" width="640" height="66" rx="14" fill="#F4F8FC"/><text x="410" y="410" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="410" dy="0">아침은 우유·과일처럼 부담 없는 것부터</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일주일만 적어 오세요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">학원 시간표와</tspan><tspan x="110.0" dy="20">간식·저녁 시각</tspa