<text x="562" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">주말이라고 건너뛰지 않고</tspan><tspan x="562" dy="20">맥부터 짚기</tspan></text>
<rect x="546" y="358" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">잠·식사·대변까지 여쭙고,</tspan><tspan x="562" dy="20">필요하면 혀·배 살피기</tspan></text>
<rect x="546" y="428" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">해 볼 생활 습관 한두 가지</tspan><tspan x="562" dy="20">함께 정하기</tspan></text>
<rect x="546" y="500" width="200" height="104" rx="14" fill="#FFFFFF"/>
<text x="562" y="526" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="562" dy="0">토·일·공휴일은</tspan></text>
<text x="562" y="550" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="562" dy="0">점심시간 없이 이어서 진료</tspan><tspan x="562" dy="19">명절 연휴는 전화로 먼저 확인</tspan><tspan x="562" dy="19">늦게 오실 땐 전화로 먼저</tspan></text>
<rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/>
<text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text>
<text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text>
<circle cx="820" cy="234" r="4.5" fill="#E8A33D"/>
<text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">가슴이 조이거나 짓누르는 듯한 통증,</tspan><tspan x="834" dy="21">갑자기 숨이 찰 때</tspan></text>
<circle cx="820" cy="289" r="4.5" fill="#E8A33D"/>
<text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">얼굴 한쪽이 처지거나 말이 어눌해지거나</tspan><tspan x="834" dy="21">한쪽 팔다리 힘이 빠질 때</tspan></text>
<circle cx="820" cy="344" r="4.5" fill="#E8A33D"/>
<text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">지금까지 겪어 본 적 없는 심한 두통이</tspan><tspan x="834" dy="21">갑자기 시작됐을 때</tspan></text>
<circle cx="820" cy="399" r="4.5" fill="#E8A33D"/>
<text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어지거나 부딪힌 뒤 심하게 붓고</tspan><tspan x="834" dy="21">움직이기 어려울 때</tspan></text>
<circle cx="820" cy="454" r="4.5" fill="#E8A33D"/>
<text x="834" y="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">피를 토하거나 검은 변을 보거나,</tspan><tspan x="834" dy="21">갑작스러운 심한 복통</tspan></text>
<text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">이럴 땐 한의원보다 가까운 응급실이 먼저</tspan><tspan x="816" dy="19">기분이 깊이 가라앉아 힘들면 109</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
