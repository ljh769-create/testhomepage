<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">인바디 결과지 두 장, 이렇게 비교</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">숫자보다 측정 조건부터 맞춰 봅니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="440" height="466" rx="22" fill="#FFFFFF" filter="url(#sh)"/>
<text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">먼저 이렇게 여쭙니다</tspan></text>
<rect x="90" y="218" width="380" height="64" rx="14" fill="#F4F8FC"/><circle cx="124" cy="250" r="21" fill="#DCE8F5"/><g transform="translate(124 250) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="18"/><path d="M0 -10 V0 L8 6"/></g>
<text x="158" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">두 번 잰 시간대가 같았나요</tspan></text>
<rect x="90" y="292" width="380" height="64" rx="14" fill="#F4F8FC"/><circle cx="124" cy="324" r="21" fill="#DCE8F5"/><g transform="translate(124 324) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 -8 h22 v12 a9 9 0 0 1 -9 9 h-4 a9 9 0 0 1 -9 -9 z M7 -4 h4 a5 5 0 0 1 0 10 h-4 M-9 -20 v6 M-1 -20 v6"/></g>
<text x="158" y="330" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">측정 전 식사·물·커피는요</tspan></text>
<rect x="90" y="366" width="380" height="64" rx="14" fill="#F4F8FC"/><circle cx="124" cy="398" r="21" fill="#DCE8F5"/><g transform="translate(124 398) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -20 C 8 -8 14 0 14 8 a14 14 0 0 1 -28 0 C -14 0 -8 -8 0 -20 z"/></g>
<text x="158" y="404" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">운동·목욕 직후에 쟀나요</tspan></text>
<rect x="90" y="440" width="380" height="64" rx="14" fill="#F4F8FC"/><circle cx="124" cy="472" r="21" fill="#DCE8F5"/><g transform="translate(124 472) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-20" width="24" height="40" rx="3"/><path d="M6 0 v4"/></g>
<text x="158" y="478" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">화장실은 다녀오셨나요</tspan></text>
<rect x="90" y="514" width="380" height="64" rx="14" fill="#F4F8FC"/><circle cx="124" cy="546" r="21" fill="#DCE8F5"/><g transform="translate(124 546) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-18" y="-8" width="36" height="16" rx="8"/><path d="M0 -8 v16"/></g>
<text x="158" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">그사이 식사·잠·약은 어땠나요</tspan></text>
<text x="90" y="606" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="90" dy="0">조건이 다르면 조건 차이부터 봅니다</tspan></text>
<rect x="520" y="160" width="250" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/>
<text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">나란히 적는 순서</tspan></text>
<rect x="546" y="218" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">날짜·시간을 먼저 적고</tspan><tspan x="562" dy="20">같은 시간대인지 보기</tspan></text>
<rect x="546" y="288" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">체중 바로 옆에 체수분</tspan><tspan x="562" dy="20">함께 움직였는지 보기</tspan></text>
<rect x="546" y="358" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">골격근량과 체지방량</tspan><tspan x="562" dy="20">어느 쪽 변화인지 보기</tspan></text>
<rect x="546" y="428" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">체지방률·복부지방률</tspan><tspan x="562" dy="20">작은 차이는 흐름으로</tspan></text>
<rect x="546" y="500" width="200" height="104" rx="14" fill="#FFFFFF"/>
<text x="562" y="526" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="562" dy="0">적어 오시면 좋아요</tspan></text>
<text x="562" y="550" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="562" dy="0">지난 결과지 사진·날짜</tspan><tspan x="562" dy="19">측정 전 식사·운동 여부</tspan><tspan x="562" dy="19">새로 먹는 약·영양제</tspan></text>
<rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/>
<text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text>
<text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text>
<circle cx="820" cy="244" r="4.5" fill="#E8A33D"/>
<text x="834" y="250" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">일부러 줄이지 않았는데</tspan><tspan x="834" dy="21">몇 달 새 체중이 줄 때</tspan></text>
<circle cx="820" cy="309" r="4.5" fill="#E8A33D"/>
<text x="834" y="315" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리·얼굴이 계속 붓고</tspan><tspan x="834" dy="21">숨차거나 소변이 줄 때</tspan></text>
<circle cx="820" cy="374" r="4.5" fill="#E8A33D"/>
<text x="834" y="380" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갈증과 소변이 함께 늘고</tspan><tspan x="834" dy="21">피로가 심해질 때</tspan></text>
<circle cx="820" cy="439" r="4.5" fill="#E8A33D"/>
<text x="834" y="445" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">숨참·가슴 통증·식은땀은</tspan><tspan x="834" dy="21">가까운 응급실로 바로</tspan></text>
<text x="816" y="567" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">이럴 땐 결과지 비교보다</tspan><tspan x="816" dy="19">내과 진료와 검사가 먼저입니다</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>
