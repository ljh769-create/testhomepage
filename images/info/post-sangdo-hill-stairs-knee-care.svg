<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="38" font-weight="800" fill="#1F3552">상도동 언덕·계단, 무릎은 이렇게 챙깁니다</text>
