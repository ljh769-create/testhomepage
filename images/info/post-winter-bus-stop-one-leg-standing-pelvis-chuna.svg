<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">정류장 한쪽 다리 서기, 골반이 뻐근하면</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">서는 습관부터 바꿔 보고 2~3주 살펴요</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="440" height="466" rx="22" fill="#FFFFFF" filter="url(#sh)"/>
<text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">먼저 이렇게 여쭙니다</tspan></text>
<rect x="90" y="222" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="255" r="21" fill="#DCE8F5"/><g transform="translate(124 255) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-18" y="-14" width="36" height="32" rx="5"/><path d="M-18 -4 h36 M-9 -20 v8 M9 -20 v8"/></g>
<text x="158" y="261" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">하루에 서서 기다리는 시간은요</tspan></text>
<rect x="90" y="300" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="333" r="21" fill="#DCE8F5"/><g transform="translate(124 333) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -14 h36 v22 h-20 l-10 8 v-8 h-6 z"/></g>
<text x="158" y="339" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">주로 어느 쪽 다리에 체중을 싣나요</tspan></text>
<rect x="90" y="378" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="411" r="21" fill="#DCE8F5"/><g transform="translate(124 411) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-4 -20 v18 q0 10 -4 18 h16 M6 -20 v20 q2 6 6 8"/></g>
<text x="158" y="417" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">엉덩이 옆인가요, 허리 아래인가요</tspan></text>
<rect x="90" y="456" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="489" r="21" fill="#DCE8F5"/><g transform="translate(124 489) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -18 a18 18 0 1 0 10 26 a14 14 0 0 1 -10 -26 z"/></g>
<text x="158" y="495" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">아침에 굳고 움직이면 풀리나요</tspan></text>
<rect x="520" y="160" width="250" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/>
<text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">일상에서 해 볼 것</tspan></text>
<rect x="546" y="218" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">양발에 반씩 싣고</tspan><tspan x="562" dy="20">1~2분마다 발 바꾸기</tspan></text>
<rect x="546" y="288" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">기다리며 발뒤꿈치</tspan><tspan x="562" dy="20">들었다 내리기 10번</tspan></text>
<rect x="546" y="358" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">한쪽 가방은 배낭으로</tspan><tspan x="562" dy="20">또는 메는 쪽 바꾸기</tspan></text>
<rect x="546" y="428" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">도착 시간 보고 나가</tspan><tspan x="562" dy="20">바깥 대기 시간 줄이기</tspan></text>
<rect x="546" y="500" width="200" height="104" rx="14" fill="#FFFFFF"/>
<text x="562" y="526" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="562" dy="0">적어 오시면 좋아요</tspan></text>
<text x="562" y="550" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="562" dy="0">기다린 시간·싣는 다리</tspan><tspan x="562" dy="19">뻐근한 자리·통증 점수</tspan></text>
<rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/>
<text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text>
<text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text>
<circle cx="820" cy="234" r="4.5" fill="#E8A33D"/>
<text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리로 저림이 내려가고</tspan><tspan x="834" dy="21">발목·발가락 힘이 빠질 때</tspan></text>
<circle cx="820" cy="289" r="4.5" fill="#E8A33D"/>
<text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">대소변 보기·참기 어렵고</tspan><tspan x="834" dy="21">사타구니 감각이 둔할 때</tspan></text>
<circle cx="820" cy="344" r="4.5" fill="#E8A33D"/>
<text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어진 뒤 통증이 심하고</tspan><tspan x="834" dy="21">골다공증이 있거나 연세 많을 때</tspan></text>
<circle cx="820" cy="399" r="4.5" fill="#E8A33D"/>
<text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">허리 통증과 열·오한, 또는</tspan><tspan x="834" dy="21">이유 없는 체중 감소</tspan></text>
<circle cx="820" cy="454" r="4.5" fill="#E8A33D"/>
<text x="834" y="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">허리 깊은 통증과 함께</tspan><tspan x="834" dy="21">소변이 붉거나 아플 때</tspan></text>
<text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">갑자기 다리 힘 빠짐·대소변 어려움은</tspan><tspan x="816" dy="19">119·가까운 응급실</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>