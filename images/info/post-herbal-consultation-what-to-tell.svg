 l6 6 l10 -12" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round"/><text x="134" y="406" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="134" dy="0">임신 · 수유 중이거나 계획 중인지</tspan></text><line x1="134" y1="420" x2="670" y2="420" stroke="#DCE8F5" stroke-width="2"/><rect x="92" y="434" width="26" height="26" rx="6" fill="none" stroke="#38608F" stroke-width="3"/><path d="M98 447 l6 6 l10 -12" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round"/><text x="134" y="456" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="134" dy="0">알레르기와 앓고 있는 질환</tspan></text><line x1="134" y1="470" x2="670" y2="470" stroke="#DCE8F5" stroke-width="2"/><rect x="92" y="484" width="26" height="26" rx="6" fill="none" stroke="#38608F" stroke-width="3"/><path d="M98 497 l6 6 l10 -12" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round"/><text x="134" y="506" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="134" dy="0">예전에 먹은 한약과 그때의 반응</tspan></text><line x1="134" y1="520" x2="670" y2="520" stroke="#DCE8F5" stroke-width="2"/><rect x="92" y="534" width="26" height="26" rx="6" fill="none" stroke="#38608F" stroke-width="3"/><path d="M98 547 l6 6 l10 -12" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round"/><text x="134" y="556" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="134" dy="0">최근 건강검진 결과지</tspan></text><line x1="134" y1="570" x2="670" y2="570" stroke="#DCE8F5" stroke-width="2"/><rect x="720" y="160" width="420" height="230" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="748" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="748" dy="0">왜 이 정보가 필요할까요</tspan></text><text x="748" y="236" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="748" dy="0">같은 증상도 잠·소화·생활에 따라</tspan><tspan x="748" dy="24">맞는 처방이 달라질 수 있어요</tspan><tspan x="748" dy="24"></tspan><tspan x="748" dy="24">이전 불편 경험은 같은 일이</tspan><tspan x="748" dy="24">반복되지 않게 하는 정보예요</tspan></text><rect x="720" y="405" width="420" height="225" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="750" cy="439" r="12" fill="#E8A33D"/><text x="750" y="445" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="750" dy="0">!</tspan></text><text x="772" y="446" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="772" dy="0">꼭 먼저 알려 주세요</tspan></text><circle cx="750" cy="477" r="4.5" fill="#E8A33D"/><text x="764" y="483" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="764" dy="0">간·신장 질환이 있는 경우</tspan></text><circle cx="750" cy="509" r="4.5" fill="#E8A33D"/><text x="764" y="515" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="764" dy="0">최근 수술했거나 예정인 경우</tspan></text><circle cx="750" cy="541" r="4.5" fill="#E8A33D"/><text x="764" y="547" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="764" dy="0">임신 중이거나 수유 중인 경우</tspan></text><circle cx="750" cy="573" r="4.5" fill="#E8A33D"/><text x="764" y="579" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="764" dy="0">양약은 처방한 의사와 상의 없이</tspan><tspan x="764" dy="20">줄이거나 끊지 않습니다</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 노량진점 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
