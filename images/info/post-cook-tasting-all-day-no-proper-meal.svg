 x="485.0" dy="19">한 끼 더</tspan></text><circle cx="635.0" cy="290" r="11" fill="#38608F" stroke="#FFFFFF" stroke-width="3"/><text x="635.0" y="268" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#38608F" text-anchor="middle"><tspan x="635.0" dy="0">저녁</tspan></text><text x="635.0" y="326" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="635.0" dy="0">저녁 장사</tspan><tspan x="635.0" dy="19">물 몇 모금씩</tspan></text><rect x="90" y="384" width="640" height="76" rx="14" fill="#DCE8F5"/><text x="110" y="414" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">맛보기는 작은 숟가락으로, 횟수는 줄이기</tspan></text><text x="110" y="440" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="110" dy="0">밥·국·반찬 두 가지로 앉아서 한 끼</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일이 끝난 뒤에는</tspan></text><circle cx="96.0" cy="566" r="5" fill="#FBE78A"/><text x="110.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">기름진 음식보다</tspan><tspan x="110.0" dy="20">소화가 편한 음식</tspan></text><circle cx="316.0" cy="566" r="5" fill="#FBE78A"/><text x="330.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">늦은 식사 뒤</tspan><tspan x="330.0" dy="