pan><tspan x="540" dy="20">임신 가능성</tspan></text><rect x="88" y="332" width="206" height="98" rx="14" fill="#F4F8FC"/><circle cx="114" cy="360" r="13" fill="#E8A33D"/><text x="114" y="365" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="114" dy="0">4</tspan></text><text x="104" y="396" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="104" dy="0">치료 부위에 상처·</tspan><tspan x="104" dy="20">붓기·열감</tspan></text><rect x="306" y="332" width="206" height="98" rx="14" fill="#F4F8FC"/><circle cx="332" cy="360" r="13" fill="#E8A33D"/><text x="332" y="365" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="332" dy="0">5</tspan></text><text x="322" y="396" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="322" dy="0">금속 보형물, 심장 박동기</tspan><tspan x="322" dy="20">같은 몸 안의 기기</tspan></text><rect x="524" y="332" width="206" height="98" rx="14" fill="#F4F8FC"/><circle cx="550" cy="360" r="13" fill="#E8A33D"/><text x="550" y="365" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="550" dy="0">6</tspan></text><text x="540" y="396" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="540" dy="0">오늘 열이 나거나</tspan><tspan x="540" dy="20">몸 상태가 평소와 다름</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-