 Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">자살예방 상담전화 109 · 응급 119</tspan><tspan x="816" dy="19">수면제는 임의로 줄이지 않기</tspan></text>
