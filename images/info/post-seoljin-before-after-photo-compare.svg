<rect x="60" y="160" width="700" height="320" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">이렇게 비교해요</tspan></text><rect x="90.0" y="222" width="201.33333333333334" height="116" rx="14" fill="#F4F8FC"/><circle cx="116.0" cy="250" r="15" fill="#38608F"/><text x="116.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="116.0" dy="0">1</tspan></text><text x="138.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="138.0" dy="0">같은 조건</tspan></text><text x="108.0" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="108.0" dy="0">비슷한 시간대,</tspan><tspan x="108.0" dy="19">밝은 곳에서 찍기</tspan></text><path d="M295.33333333333337 273.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="309.33333333333337" y="222" width="201.33333333333334" height="116" rx="14" fill="#F4F8FC"/><circle cx="335.33333333333337" cy="250" r="15" fill="#38608F"/><text x="335.33333333333337" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="335.33333333333337" dy="0">2</tspan></text><text x="357.33333333333337" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="357.33333333333337" dy="0">몇 주 간격</tspan></text><text x="327.33333333333337" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="327.33333333333337" dy="0">처음 사진과</tspan><tspan x="327.33333333333337" dy="19">나란히 놓기</tspan></text><path d="M514.6666666666667 273.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="528.6666666666667" y="222" width="201.33333333333334" height="116" rx="14" fill="#F4F8FC"/><circle cx="554.6666666666667" cy="250" r="15" fill="#38608F"/><text x="554.6666666666667" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="554.6666666666667" dy="0">3</tspan></text><text x="576.6666666666667" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="576.6666666666667" dy="0">함께 보기</tspan></text><text x="546.6666666666667" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="546.6666666666667" dy="0">잠·식사·불편 점수와</tspan><tspan x="546.6666666666667" dy="19">흐름 비교</tspan></text><circle cx="96" cy="373" r="5" fill="#38608F"/><text x="110" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">아침 사진과 식사 직후 사진은</tspan><tspan x="110" dy="20">다르게 보일 수 있어요</tspan></text><circle cx="96" cy="433" r="5" fill="#38608F"/><text x="110" y="438" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">사진 속 변화는 참고 자료로만 써요</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">사진 찍을 때</tspan></text><circle cx="96.0" cy="566" r="5" fill="#FBE78A"/><text x="110.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">찍기 1시간 전</tspan><tspan x="110.0" dy="20">커피·진한 음식 피하기</tspan></text><circle cx="316.0" cy="566" r="5" fill="#FBE78A"/><text x="330.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">그날 컨디션을</tspan><tspan x="330.0" dy="20">한 줄로 적기</tspan></text><circle cx="536.0" cy="566" r="5" fill="#FBE78A"/><text x="550.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">지난 사진은</tspan><tspan x="550.0" dy="20">지우지 말고 모으기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">혀나 입안 상처가</tspan><tspan x="834" dy="21">2주 넘게 낫지 않을 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic',