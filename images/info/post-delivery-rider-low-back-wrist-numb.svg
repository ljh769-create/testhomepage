<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">배달 오토바이, 허리와 손목이 함께 불편할 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">저림은 손목뿐 아니라 목·어깨에서 이어지는 경우도 있습니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="350" height="330" rx="22" fill="#FFFFFF" filter="url(#sh)"/><circle cx="104" cy="200" r="22" fill="#DCE8F5"/><g transform="translate(104 200) scale(0.7)" fill="none" stroke="#1F3552" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 0 q5 -10 10 0 t10 0 t10 0 t10 0"/><path d="M-20 10 q5 -10 10 0 t10 0 t10 0 t10 0"/></g><text x="138" y="207" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="138" dy="0">허리가 뻐근할 때</tspan></text><text x="90" y="252" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="90" dy="0">진동과 숙인 자세가 오래</tspan><tspan x="90" dy="23">이어지면 허리·골반 주변</tspan><tspan x="90" dy="23">근육이 지치기 쉽습니다</tspan></text><rect x="84" y="346" width="302" height="48" rx="14" fill="#DCE8F5"/><text x="235" y="376" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="235" dy="0">배달 사이 내려서 허리 젖히기</tspan></text><rect x="84" y="408" width="302" height="48" rx="14" fill="#DCE8F5"/><text x="235" y="438" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="235" dy="0">허리 덮는 겉옷으로 따뜻하게</tspan></text><rect x="425" y="160" width="350" height="330" rx="22" fill="#FFFFFF" filter="url(#sh)"/><circle cx="469" cy="200" r="22" fill="#DCE8F5"/><g transform="translate(469 200) scale(0.7)" fill="none" stroke="#1F3552" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-6 16 v-20 a4 4 0 0 1 8 0 v12"/><path d="M2 4 v-6 a4 4 0 0 1 8 0 v8"/><path d="M10 6 v-2 a4 4 0 0 1 8 0 v8 a14 14 0 0 1 -14 14 h-4 a12 12 0 0 1 -10 -6 l-8 -12 a4 4 0 0 1 6 -4 l6 6"/></g><text x="503" y="207" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="503" dy="0">손목·손이 저릴 때</tspan></text><text x="455" y="252" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="455" dy="0">핸들을 세게 쥐고 손목을</tspan><tspan x="455" dy="23">꺾은 채 오래 타면 손목 쪽</tspan><tspan x="455" dy="23">신경이 눌릴 수 있습니다</tspan></text><rect x="449" y="346" width="302" height="48" rx="14" fill="#DCE8F5"/><text x="600" y="376" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="600" dy="0">손바닥 전체로 가볍게 쥐기</tspan></text><rect x="449" y="408" width="302" height="48" rx="14" fill="#DCE8F5"/><text x="600" y="438" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="600" dy="0">쉴 때 손목 털고 방풍 장갑</tspan></text><rect x="790" y="160" width="350" height="330" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="232" r="4.5" fill="#E8A33D"/><text x="834" y="238" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손에 힘이 빠져 물건을</tspan><tspan x="834" dy="20">자주 떨어뜨리는 경우</tspan></text><circle cx="820" cy="284" r="4.5" fill="#E8A33D"/><text x="834" y="290" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리 힘 빠짐·대소변 조절</tspan><tspan x="834" dy="20">어려움은 바로 응급실</tspan></text><circle cx="820" cy="336" r="4.5" fill="#E8A33D"/><text x="834" y="342" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어지거나 부딪힌 뒤</tspan><tspan x="834" dy="20">통증·붓기가 심해질 때</tspan></text><rect x="60" y="510" width="1080" height="120" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="546" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 기록해 오시면 상담이 쉬워집니다</tspan></text><circle cx="96.0" cy="580" r="5" fill="#FBE78A"/><text x="110.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">하루 운행·쉬는 간격</tspan></text><circle cx="436.0" cy="580" r="5" fill="#FBE78A"/><text x="450.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="450.0" dy="0">저린 손가락과 저린 때</tspan></text><circle cx="776.0" cy="580" r="5" fill="#FBE78A"/><text x="790.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="790.0" dy="0">허리 통증이 다리로 가는지</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
