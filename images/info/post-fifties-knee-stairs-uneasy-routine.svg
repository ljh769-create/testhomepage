<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">계단에서 불안해질 수 있는 이유</tspan></text><rect x="90" y="222" width="312" height="98" rx="14" fill="#F4F8FC"/><circle cx="128" cy="271.0" r="23" fill="#DCE8F5"/><g transform="translate(128 271.0) scale(0.66)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 16 h10 v-10 h10 v-10 h10 v-10 h10"/></g><text x="162" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="162" dy="0">허벅지 앞쪽 힘</tspan></text><text x="162" y="280" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="162" dy="0">내려올 땐 이 근육이</tspan><tspan x="162" dy="18">브레이크처럼 무게를 받아요</tspan></text><rect x="416" y="222" width="312" height="98" rx="14" fill="#F4F8FC"/><circle cx="454" cy="271.0" r="23" fill="#DCE8F5"/><g transform="translate(454 271.0) scale(0.66)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-14" r="6"/><path d="M0 -8 v16 M-12 -2 l12 -2 l12 2 M0 8 l-8 14 M0 8 l8 14"/></g><text x="488" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="488" dy="0">무릎뼈 뒤쪽</tspan></text><text x="488" y="280" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="488" dy="0">예민해지면 오르내릴 때</tspan><tspan x="488" dy="18">시큰한 느낌이 들 수 있어요</tspan></text><rect x="90" y="332" width="312" height="98" rx="14" fill="#F4F8FC"/><circle cx="128" cy="381.0" r="23" fill="#DCE8F5"/><g transform="translate(128 381.0) scale(0.66)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="2" cy="-16" r="5"/><path d="M0 -10 l-4 12 l8 6 l2 10 M-4 2 l-8 12 M-2 -6 l-8 6 M2 -6 l10 4"/></g><text x="162" y="366" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="162" dy="0">신발</tspan></text><text x="162" y="390" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="162" dy="0">굽이 높거나 바닥이 닳으면</tspan><tspan x="162" dy="18">발목·무릎 균형이 흐트러져요</tspan></text><rect x="416" y="332" width="312" height="98" rx="14" fill="#F4F8FC"/><circle cx="454" cy="381.0" r="23" fill="#DCE8F5"/><g transform="translate(454 381.0) scale(0.66)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle r="18"/><path d="M0 -10 v10 l8 6"/></g><text x="488" y="366" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="488" dy="0">활동량</tspan></text><text x="488" y="390" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="488" dy="0">줄면 다리 근육이 약해져</tspan><tspan x="488" dy="18">같은 계단도 부담스러워요</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일상에서 먼저 해 볼 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">내려올 땐 한 계단씩</tspan><tspan x="110.0" dy="20">발 전체로 딛기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">의자에 앉아 다리</tspan><tspan x="330.0" dy="20">폈다 내리기 반복</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">언덕길은 마을버스</tspan><tspan x="550.0" dy="20">섞어 부담 나누기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">무릎이 갑자기 붓고 열이</tspan><tspan x="834" dy="21">나며 짚기 어려울 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">무릎이 자주 풀려</tspan><tspan x="834" dy="21">넘어질 뻔했을 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어지거나 부딪힌 뒤 무릎을</tspan><tspan x="834" dy="21">펴거나 굽히기 어려울 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">불안한 방향(오르기·내려오기)을</tspan><tspan x="816" dy="19">적어 오시면 상담이 쉬워요</tspan></text>
