<text x="562" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">결과지 숫자를</tspan><tspan x="562" dy="20">작년과 나란히 적기</tspan></text>
