<text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">주말 진료는 이렇게</tspan></text>
<rect x="546" y="218" width="200" height="62" rx="14" fill="#2C4568"/>
<text x="562" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">어디가 불편한지,</tspan><tspan x="562" dy="20">언제부터인지 먼저 듣기</tspan></text>
