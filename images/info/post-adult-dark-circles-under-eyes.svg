<text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">한쪽 눈 주변이</tspan><tspan x="834" dy="21">갑자기 붉게 부을 때</tspan></text>
<circle cx="820" cy="292" r="4.5" fill="#E8A33D"/>
<text x="834" y="298" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">열이나 시력 변화가</tspan><tspan x="834" dy="21">함께 있을 때</tspan></text>
<circle cx="820" cy="350" r="4.5" fill="#E8A33D"/>
<text x="834" y="356" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">숨참·심한 어지럼</tspan><tspan x="834" dy="21">멍이 쉽게 들 때</tspan></text>
<rect x="812" y="554" width="306" height="2" fill="#E8A33D" opacity="0.5"/>
<text x="816" y="580" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">이런 신호가 있으면 가까운 병원이나 응급실을</tspan><tspan x="816" dy="20">먼저 찾으세요.</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
