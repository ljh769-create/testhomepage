<rect x="60" y="160" width="330" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="86" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="86" dy="0">어느 손가락인가요</tspan></text><rect x="115" y="280" width="30" height="90" rx="15" fill="#38608F"/><rect x="157" y="240" width="30" height="130" rx="15" fill="#38608F"/><rect x="199" y="230" width="30" height="140" rx="15" fill="#DCE8F5"/><rect x="241" y="242" width="30" height="128" rx="15" fill="#DCE8F5"/><rect x="283" y="266" width="30" height="104" rx="15" fill="#7A6BB5"/><rect x="112" y="344" width="204" height="76" rx="26" fill="#DCE8F5"/><text x="150" y="444" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="150" dy="0">엄지·검지 쪽</tspan></text><text x="290" y="444" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#7A6BB5" text-anchor="middle"><tspan x="290" dy="0">새끼손가락 쪽</tspan></text><rect x="410" y="160" width="350" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="436" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="436" dy="0">이런 점을 여쭙니다</tspan></text><rect x="432" y="220" width="306" height="50" rx="10" fill="#F4F8FC"/><circle cx="452" cy="245.0" r="5" fill="#38608F"/><text x="466" y="241.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="466" dy="0">고개를 젖히거나 기울이면</tspan><tspan x="466" dy="19">심해지는지</tspan></text><rect x="432" y="278" width="306" height="50" rx="10" fill="#F4F8FC"/><circle cx="452" cy="303.0" r="5" fill="#38608F"/><text x="466" y="299.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="466" dy="0">팔 힘이 빠지거나 물건을</tspan><tspan x="466" dy="19">떨어뜨리는지</tspan></text><rect x="432" y="336" width="306" height="50" rx="10" fill="#F4F8FC"/><circle cx="452" cy="361.0" r="5" fill="#38608F"/><text x="466" y="366.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="466" dy="0">밤에 저려서 깨는지</tspan></text><rect x="432" y="394" width="306" height="50" rx="10" fill="#F4F8FC"/><circle cx="452" cy="419.0" r="5" fill="#38608F"/><text x="466" y="424.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="466" dy="0">손목·팔꿈치 쪽은 아닌지</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일상에서 먼저 해 볼 수 있는 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">화면을 눈높이로</tspan><tspan x="110.0" dy="20">올리기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">베개 높이</tspan><tspan x="330.0" dy="20">점검하기</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">무리한 목 꺾기·강한</tspan><tspan x="550.0" dy="20">마사지는 하지 않기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">팔과 손에 힘이 빠지거나</tspan><tspan x="834" dy="21">저림이 점점 심해질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">걸음이 불안정하거나</tspan><tspan x="834" dy="21">손놀림이 둔해질 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갑자기 말이 어눌하거나 한쪽</tspan><tspan x="834" dy="21">팔다리에 힘이 빠질 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어지거나 다친 뒤</tspan><tspan x="834" dy="21">시작됐을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">영상 검사가 가능한 의료기관이</tspan><tspan x="816" dy="19">먼저, 말이 어눌하면 가까운 응급실</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
