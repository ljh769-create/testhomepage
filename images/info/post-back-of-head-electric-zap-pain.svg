<rect x="60" y="160" width="440" height="466" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">먼저 이렇게 여쭙니다</tspan></text><rect x="90" y="222" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="255" r="21" fill="#DCE8F5"/><g transform="translate(124 255) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 20 c-12 -14 -16 -22 -16 -30 a16 16 0 0 1 32 0 c0 8 -4 16 -16 30 z"/><circle cx="0" cy="-10" r="5"/></g><text x="158" y="261" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">한가운데, 귀 뒤, 정수리까지</tspan></text><rect x="90" y="300" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="333" r="21" fill="#DCE8F5"/><g transform="translate(124 333) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="18"/><path d="M0 -10 v10 l8 6"/></g><text x="158" y="339" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">몇 초 지속, 하루 몇 번 반복</tspan></text><rect x="90" y="378" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="411" r="21" fill="#DCE8F5"/><g transform="translate(124 411) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -12 h36 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 h-20 l-10 8 v-8 h-6 a6 6 0 0 1 -6 -6 v-16 a6 6 0 0 1 6 -6 z"/><path d="M-8 0 h16"/></g><text x="158" y="417" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">고개 돌림·머리 빗기·베개</tspan></text><rect x="90" y="456" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="489" r="21" fill="#DCE8F5"/><g transform="translate(124 489) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-5 6 v-20 a5 5 0 0 1 10 0 v20 a10 10 0 1 1 -10 0 z"/><path d="M0 -4 v14"/></g><text x="158" y="495" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">찬바람, 잘못 잔 잠, 숙인 자세</tspan></text><rect x="520" y="160" width="250" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">일상에서 해 볼 것</tspan></text><rect x="546" y="218" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">외출 땐 목도리로</tspan><tspan x="562" dy="20">뒷목 따뜻하게</tspan></text><rect x="546" y="288" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">모니터 위 끝을</tspan><tspan x="562" dy="20">눈높이에 맞추기</tspan></text><rect x="546" y="358" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">50분 일하면 5분</tspan><tspan x="562" dy="20">일어나 어깨 돌리기</tspan></text><rect x="546" y="428" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">저녁 9시, 따뜻한</tspan><tspan x="562" dy="20">수건 뒷목에 10분</tspan></text><rect x="546" y="500" width="200" height="104" rx="14" fill="#FFFFFF"/><text x="562" y="526" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="562" dy="0">적어 오시면 좋아요</tspan></text><text x="562" y="550" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="562" dy="0">통증 시각·위치·지속,</tspan><tspan x="562" dy="19">직전 동작과 진통제</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">난생처음 심한 두통이</tspan><tspan x="834" dy="21">갑자기 터지듯 올 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">열이 나고 목이 뻣뻣해</tspan><tspan x="834" dy="21">고개 숙이기 어려울 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">말이 어눌하거나 한쪽 얼굴·</tspan><tspan x="834" dy="21">팔다리 힘이 빠질 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">물체가 둘로 보이거나</tspan><tspan x="834" dy="21">시야가 갑자기 흐릴 때</tspan></text><circle cx="820" cy="454" r="4.5" fill="#E8A33D"/><text x="834" y="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">뒷머리 피부에 붉은 반점과</tspan><tspan x="834" dy="21">물집이 줄지어 생길 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">터지듯 심한 두통·한쪽 힘 빠짐은</tspan><tspan x="816" dy="19">119에 바로 연락</tspan></text>
