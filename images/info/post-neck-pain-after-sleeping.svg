<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">자고 일어나면 목이 아플 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">베개와 자는 자세, 낮의 화면 습관을 함께 봅니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">베개 높이, 이렇게 맞춰 보세요</tspan></text><rect x="96" y="222" width="204" height="150" rx="14" fill="#F4F8FC"/><rect x="116" y="340" width="164" height="12" rx="6" fill="#DCE8F5"/><rect x="120" y="310" width="56" height="30" rx="8" fill="#90B2DD"/><circle cx="148" cy="292" r="15" fill="none" stroke="#1F3552" stroke-width="3"/><path d="M164 290.0 Q206 324.6666666666667 272 332" stroke="#1F3552" stroke-width="10" stroke-linecap="round" fill="none"/><text x="198" y="250" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#8A5A12" text-anchor="middle"><tspan x="198" dy="0">너무 높을 때</tspan></text><rect x="318" y="222" width="204" height="150" rx="14" fill="#F4F8FC"/><rect x="338" y="340" width="164" height="12" rx="6" fill="#DCE8F5"/><rect x="342" y="322" width="56" height="18" rx="8" fill="#FBE78A"/><circle cx="370" cy="304" r="15" fill="none" stroke="#1F3552" stroke-width="3"/><path d="M386 310 Q428 330.0 494 332" stroke="#1F3552" stroke-width="10" stroke-linecap="round" fill="none"/><text x="420" y="250" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#4E9A86" text-anchor="middle"><tspan x="420" dy="0">알맞을 때</tspan></text><rect x="540" y="222" width="204" height="150" rx="14" fill="#F4F8FC"/><rect x="560" y="340" width="164" height="12" rx="6" fill="#DCE8F5"/><rect x="564" y="332" width="56" height="8" rx="8" fill="#90B2DD"/><circle cx="592" cy="314" r="15" fill="none" stroke="#1F3552" stroke-width="3"/><path d="M608 327.0 Q650 334.6666666666667 716 332" stroke="#1F3552" stroke-width="10" stroke-linecap="round" fill="none"/><text x="642" y="250" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#8A5A12" text-anchor="middle"><tspan x="642" dy="0">너무 낮을 때</tspan></text><text x="410" y="404" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#38608F" text-anchor="middle"><tspan x="410" dy="0">바로 누웠을 때 턱이 들리거나 숙여지지 않는 높이</tspan></text><text x="410" y="432" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="410" dy="0">엎드려 자는 습관은 옆이나 바로 누운 자세로</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">낮에도 챙길 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">화면을 눈높이에 맞추고</tspan><tspan x="110.0" dy="20">30~40분마다 고개 들기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">따뜻한 수건을</tspan><tspan x="330.0" dy="20">목 뒤에 잠깐</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">억지로 끝까지 돌리지</tspan><tspan x="550.0" dy="20">않고 편한 범위만</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">팔이나 손으로 저림,</tspan><tspan x="834" dy="21">힘 빠짐이 퍼지는 경우</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어지거나 부딪힌 뒤</tspan><tspan x="834" dy="21">갑자기 생긴 목 통증</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">열, 심한 두통, 구토가</tspan><tspan x="834" dy="21">함께 있는 경우</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">몇 주가 지나도</tspan><tspan x="834" dy="21">점점 심해지는 경우</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">적어 오기: 자는 자세, 베개,</tspan><tspan x="816" dy="19">돌리기 어려운 방향</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
