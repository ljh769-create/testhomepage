<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">진료를 시작하기 전에 물어보세요</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">과정을 알고 시작하면 긴장이 덜합니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">이런 질문, 편하게 하셔도 됩니다</tspan></text><rect x="84" y="222" width="318" height="78" rx="18" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M120 300 l-4 18 l24 -18 z" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><rect x="114" y="294" width="30" height="8" fill="#F4F8FC"/><text x="243" y="268" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="243" dy="0">오늘은 어떤 순서로 진행되나요?</tspan></text><rect x="424" y="222" width="318" height="78" rx="18" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M460 300 l-4 18 l24 -18 z" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><rect x="454" y="294" width="30" height="8" fill="#F4F8FC"/><text x="583" y="268" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="583" dy="0">진료 뒤 조심할 점이 있나요?</tspan></text><rect x="84" y="332" width="318" height="78" rx="18" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M120 410 l-4 18 l24 -18 z" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><rect x="114" y="404" width="30" height="8" fill="#F4F8FC"/><text x="243" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="243" dy="0">다음엔 언제 오면 되나요?</tspan></text><rect x="424" y="332" width="318" height="78" rx="18" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><path d="M460 410 l-4 18 l24 -18 z" fill="#F4F8FC" stroke="#90B2DD" stroke-width="2"/><rect x="454" y="404" width="30" height="8" fill="#F4F8FC"/><text x="583" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="583" dy="0">비용·보험은 어디서 안내받나요?</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">오시기 전에 적어 두면 좋은 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">꼭 묻고 싶은 질문</tspan><tspan x="110.0" dy="20">서너 가지</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">진료 뒤 일정</tspan><tspan x="330.0" dy="20">(운전·운동·출근)</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">걱정되는 점과 이유</tspan><tspan x="550.0" dy="20">복용 중인 약</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">질문보다 급한 심한 통증이나</tspan><tspan x="834" dy="21">새로 생긴 증상이 있는 경우</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">치료 중 어지럼·식은땀·</tspan><tspan x="834" dy="21">가슴 답답함이 생기는 경우</tspan><tspan x="834" dy="21">(바로 말씀해 주세요)</tspan></text><circle cx="820" cy="365" r="4.5" fill="#E8A33D"/><text x="834" y="371" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">숨쉬기 어렵거나</tspan><tspan x="834" dy="21">의식이 흐려지는 경우</tspan><tspan x="834" dy="21">(즉시 가까운 응급실)</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">이해가 안 되면 그 자리에서</tspan><tspan x="816" dy="19">다시 물어보셔도 됩니다</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>