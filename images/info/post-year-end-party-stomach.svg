ight="600" fill="#1F3552" text-anchor="middle"><tspan x="410" dy="0">채소·국물 먼저, 천천히</tspan><tspan x="410" dy="22">술 한 잔에 물 한 잔</tspan></text><text x="410" y="426" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#4A5D75" text-anchor="middle"><tspan x="410" dy="0">2차는 되도록 줄이기</tspan></text><rect x="536" y="160" width="224" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><rect x="536" y="160" width="224" height="58" rx="22" fill="#5BA68A"/><rect x="536" y="196" width="224" height="22" fill="#5BA68A"/><text x="648" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="648" dy="0">다음 날</tspan></text><circle cx="648" cy="282" r="40" fill="#DCE8F5"/><g transform="translate(648 286) scale(1.2)" fill="none" stroke="#5BA68A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 -2 h40 a20 18 0 0 1 -40 0 z"/><path d="M-8 -8 q4 -6 0 -12 M2 -8 q4 -6 0 -12"/></g><text x="648" y="366" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="648" dy="0">따뜻한 물과</tspan><tspan x="648" dy="22">소화 쉬운 식사</tspan></text><text x="648" y="426" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#4A5D75" text-anchor="middle"><tspan x="648" dy="0">속을 쉬게 하는 날</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">모임이 연달아 있다면</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">중간에 일찍 귀가하는</tspan><tspan x="110.0" dy="20">날 정해 두기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">끝난 시각과</tspan><tspan x="330.0" dy="20">마신 양 적어 두기</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">불편했던 시간대와</tspan><tspan x="550.0" dy="20">증상 적기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">검은 변, 피 섞인 변,</tspan><tspan x="834" dy="21">피를 토할 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">참기 어려운 복통이</tspan><tspan x="834" dy="21">계속될 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">삼킬 때 걸리거나</tspan><tspan x="834" dy="21">이유 없이 체중이 줄 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">가슴 통증이나</tspan><tspan x="834" dy="21">숨참이 함께 있을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">피를 토하거나 심한 복통은</tspan><tspan x="816" dy="19">가까운 응급실이 먼저입니다</tspan></text>
