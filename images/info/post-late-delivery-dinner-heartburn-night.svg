610" r="5" fill="#FBE78A"/><text x="618" y="616" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#fff" text-anchor="start"><tspan x="618" dy="0">속쓰림·신물이 오는 때</tspan></text><circle cx="869" cy="610" r="5" fill="#FBE78A"/><text x="883" y="616" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#fff" text-anchor="start"><tspan x="883" dy="0">드시는 위장약</tspan></text>
