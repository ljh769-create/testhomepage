ic Neo',sans-serif" font-size="19" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="604" dy="0">오늘 밤 설정</tspan></text><rect x="604" y="214" width="20" height="20" rx="5" fill="none" stroke="#38608F" stroke-width="2.5"/><path d="M608 224 l5 5 l8 -10" fill="none" stroke="#38608F" stroke-width="2.5"/><text x="636" y="232" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#33475F" text-anchor="start"><tspan x="636" dy="0">방해금지 모드,</tspan><tspan x="636" dy="22">급한 연락처만 허용</tspan></text><rect x="604" y="288" width="20" height="20" rx="5" fill="none" stroke="#38608F" stroke-width="2.5"/><path d="M608 298 l5 5 l8 -10" fill="none" stroke="#38608F" stroke-width="2.5"/><text x="636" y="306" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#33475F" text-anchor="start"><tspan x="636" dy="0">전화만 울리게,</tspan><tspan x="636" dy="22">메신저는 아침에</tspan></text><rect x="604" y="362" width="20" height="20" rx="5" fill="none" stroke="#38608F" stroke-width="2.5"/><path d="M608 372 l5 5 l8 -10" fill="none" stroke="#38608F" stroke-width="2.5"/><text x="636" y="380" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#33475F" text-anchor="start"><tspan x="636" dy="0">알람은 따로 쓰거나</tspan><tspan x="636" dy="22">작고 부드럽게</tspan></text><rect x="604" y="436" width="20" height="20" rx="5" fill="none" stroke="#38608F" stroke-width="2.5"/><path d="M608 446 l5 5 l8 -10" fill="none" stroke="#38608F" stroke-width="2.5"/><text x="636" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#33475F" text-anchor="start"><tspan x="636" dy="0">자기 전 30분은</tspan><tspan x="636" dy="22">화면 멀리하기</tspan></text><rect x="860" y="150" width="300" height="380" rx="22" fill="#FFF7E8" stroke="#E8A33D" stroke-width="2"/><text x="886" y="190" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#9A5B00" text-anchor="start"><tspan x="886" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="892" cy="222" r="5" fill="#E8A33D"/><text x="908" y="228" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#5C4310" text-anchor="start"><tspan x="908" dy="0">업무 연락에 대한 불안이</tspan><tspan x="908" dy="21">심해 일상이 어려움</tspan></text><circle cx="892" cy="280" r="5" fill="#E8A33D"/><text x="908" y="286" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#5C4310" text-anchor="start"><tspan x="908" dy="0">가슴 두근거림이나</tspan><tspan x="908" dy="21">숨 가쁨이 함께 있음</tspan></text><circle cx="892" cy="338" r="5" fill="#E8A33D"/><text x="908" y="344" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#5C4310" text-anchor="start"><tspan x="908" dy="0">두 주 넘게</tspan><tspan x="908" dy="21">거의 잠을 못 잠</tspan></text><text x="886" y="510" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#9A5B00" text-anchor="start"><tspan x="886" dy="0">수면제는 임의로 끊지 않습니다</tspan></text><rect x="40" y="546" width="1120" height="88" rx="20" fill="#1F3552"/><text x="68" y="582" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#FBE78A" text-anchor="start"><tspan x="68" dy="0">이렇게 적어 오시면 상담이 쉬워집니다</tspan></text><circle cx="74" cy="610" r="5" fill="#FBE78A"/><text x="88" y="616" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#fff" text-anchor="start"><tspan x="88" dy="0">밤에 깬 시각과 폰 확인 여부</tspan></text><circle cx="427" cy="610" r="5" fill="#FBE78A"/><text x="441" y="616" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#fff" text-anchor="start"><tspan x="441" dy="0">다시 잠들기까지 걸린 시간</tspan></text><circle cx="780" cy="610" r="5" fill="#FBE78A"/><text x="794" y="616" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#fff" text-anchor="start"><tspan x="794" dy="0">잠들기 직전 화면 본 시간</tspan></text>
