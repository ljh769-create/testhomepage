o Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다른 병원에서</tspan><tspan x="834" dy="21">새 약을 처방받았을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">숨이 차거나 얼굴이 부으면</tspan><tspan x="816" dy="19">복용을 멈추고 가까운 응급실로</tspan></text>
