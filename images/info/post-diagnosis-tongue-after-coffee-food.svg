y="0">삼키기 어려운 증상이</tspan><tspan x="834" dy="21">함께 있을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">치과·이비인후과 등</tspan><tspan x="816" dy="19">해당 의료기관 확인이 먼저</tspan></text>
