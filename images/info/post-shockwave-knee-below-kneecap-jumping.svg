608F" text-anchor="middle"><tspan x="646" dy="0">점프·착지</tspan></text><rect x="546" y="276" width="200" height="42" rx="21" fill="#DCE8F5"/><text x="646" y="303" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="646" dy="0">쪼그려 앉기</tspan></text><rect x="546" y="330" width="200" height="42" rx="21" fill="#DCE8F5"/><text x="646" y="357" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="646" dy="0">계단 내려가기</tspan></text><rect x="546" y="384" width="200" height="42" rx="21" fill="#DCE8F5"/><text x="646" y="411" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="646" dy="0">운동량이 갑자기 늘 때</tspan></text><rect x="520" y="476" width="250" height="150" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="546" y="512" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">먼저 해 볼 것</tspan></text><text x="546" y="544" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="546" dy="0">점프 횟수·높이 줄이기</tspan><tspan x="546" dy="22">쪼그리기 대신 낮은 의자</tspan><tspan x="546" dy="22">쿠션 있는 운동화</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어지거나 부딪힌 뒤</tspan><tspan x="834" dy="21">무릎이 크게 부을 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">무릎이 펴지지 않거나</tspan><tspan x="834" dy="21">체중을 싣지 못할 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">착지하다 '툭' 소리와 함께</tspan><tspan x="834" dy="21">힘이 빠졌을 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">붉고 뜨겁고 열이 날 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">청소년은 키가 많이 컸는지</tspan><tspan x="816" dy="19">함께 알려 주세요</tspan></text>
