<circle cx="1120" cy="70" r="120" fill="#7B6FC0" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">몸이 부을 때, 병원은 언제 먼저 가나요</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">붓는 곳·시간·한쪽인지를 먼저 나눠 봅니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#7B6FC0"/>
<rect x="60" y="160" width="700" height="320" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">붓기를 이렇게 나눠 봅니다</tspan></text><rect x="90" y="220" width="640" height="42" rx="10" fill="#F4F8FC"/><text x="110" y="247" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="110" dy="0">어디가?</tspan></text><text x="280" y="247" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="280" dy="0">얼굴 · 손 · 다리</tspan></text><rect x="90" y="270" width="640" height="42" rx="10" fill="#FFFFFF"/><text x="110" y="297" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="110" dy="0">언제?</tspan></text><text x="280" y="297" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="280" dy="0">아침 · 저녁</tspan></text><rect x="90" y="320" width="640" height="42" rx="10" fill="#F4F8FC"/><text x="110" y="347" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="110" dy="0">한쪽? 양쪽?</tspan></text><text x="280" y="347" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="280" dy="0">한쪽만 갑자기면 먼저 확인</tspan></text><rect x="90" y="370" width="640" height="42" rx="10" fill="#FFFFFF"/><text x="110" y="397" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="110" dy="0">누르면?</tspan></text><text x="280" y="397" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="280" dy="0">자국이 남는지</tspan></text><rect x="90" y="420" width="640" height="42" rx="10" fill="#F4F8FC"/><text x="110" y="447" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="110" dy="0">주기?</tspan></text><text x="280" y="447" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="280" dy="0">생리 주기 · 계절</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일상에서 먼저 해 볼 것</tspan></text><circle cx="96.0" cy="566" r="5" fill="#FBE78A"/><text x="110.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">한 시간에 20번쯤</tspan><tspan x="110.0" dy="20">발목 까딱이기</tspan></text><circle cx="316.0" cy="566" r="5" fill="#FBE78A"/><text x="330.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">누울 때 다리를</tspan><tspan x="330.0" dy="20">약간 높게</tspan></text><circle cx="536.0" cy="566" r="5" fill="#FBE78A"/><text x="550.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">짠 음식 줄이고</tspan><tspan x="550.0" dy="20">물은 나눠 마시기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">한쪽 다리만 갑자기 붓고</tspan><tspan x="834" dy="21">아프거나 붉어질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">숨이 차고</tspan><tspan x="834" dy="21">가슴이 답답할 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">얼굴·눈 주위가 붓고</tspan><tspan x="834" dy="21">소변이 줄거나 달라질 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">몸무게가 단기간에</tspan><tspan x="834" dy="21">크게 늘었을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">복용 중인 약(혈압약·진통제·</tspan><tspan x="816" dy="19">호르몬제)도 알려 주세요</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
