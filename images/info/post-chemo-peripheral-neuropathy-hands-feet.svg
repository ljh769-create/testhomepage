<text x="508" y="372" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="508" dy="0">저녁마다 상처·물집 확인</tspan></text>
<circle cx="484" cy="410" r="15" fill="#38608F"/>
<text x="484" y="416" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="484" dy="0">4</tspan></text>
<text x="508" y="406" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="508" dy="0">따뜻하게, 뜨겁지 않게</tspan></text>
<text x="508" y="428" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="508" dy="0">찜질팩 직접 대지 않기</tspan></text>
<rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/>
<text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 기록해 오세요</tspan></text>
