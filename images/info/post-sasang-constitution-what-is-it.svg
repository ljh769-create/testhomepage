<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">사상체질은 무엇이고 어떤 한계가 있나요</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">근거가 제한적이라 참고 자료로만 씁니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#7B6FC0"/>
<rect x="60" y="160" width="700" height="320" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">사람의 경향을 네 가지로 나누어 보는 이론</tspan></text><circle cx="160" cy="268" r="44" fill="#DCE8F5"/><text x="160" y="275" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#7B6FC0" text-anchor="middle"><tspan x="160" dy="0">태양인</tspan></text><circle cx="326" cy="268" r="44" fill="#DCE8F5"/><text x="326" y="275" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#7B6FC0" text-anchor="middle"><tspan x="326" dy="0">소양인</tspan></text><circle cx="492" cy="268" r="44" fill="#DCE8F5"/><text x="492" y="275" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#7B6FC0" text-anchor="middle"><tspan x="492" dy="0">태음인</tspan></text><circle cx="658" cy="268" r="44" fill="#DCE8F5"/><text x="658" y="275" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#7B6FC0" text-anchor="middle"><tspan x="658" dy="0">소음인</tspan></text><text x="410" y="340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#4A5D75" text-anchor="middle"><tspan x="410" dy="0">이제마 선생이 정리한 한의학 이론입니다</tspan></text><text x="90" y="380" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="90" dy="0">함께 살펴 경향을 가늠하는 것</tspan></text><rect x="90" y="396" width="150" height="40" rx="20" fill="#DCE8F5"/><text x="165" y="422" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="165" dy="0">타고난 성향</tspan></text><rect x="252" y="396" width="150" height="40" rx="20" fill="#DCE8F5"/><text x="327" y="422" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="327" dy="0">체형</tspan></text><rect x="414" y="396" width="150" height="40" rx="20" fill="#DCE8F5"/><text x="489" y="422" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="489" dy="0">소화·땀의 특징</tspan></text><rect x="576" y="396" width="150" height="40" rx="20" fill="#DCE8F5"/><text x="651" y="422" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="651" dy="0">감정 반응</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 참고합니다</tspan></text><circle cx="96.0" cy="566" r="5" fill="#FBE78A"/><text x="110.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">병을 진단하는</tspan><tspan x="110.0" dy="20">도구가 아닌 참고 자료</tspan></text><circle cx="316.0" cy="566" r="5" fill="#FBE78A"/><text x="330.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">체질을 이유로</tspan><tspan x="330.0" dy="20">복용 약 바꾸지 않기</tspan></text><circle cx="536.0" cy="566" r="5" fill="#FBE78A"/><text x="550.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">먹고 불편했던</tspan><tspan x="550.0" dy="20">음식을 먼저 기록</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">특정 음식을 크게 끊은 뒤</tspan><tspan x="834" dy="21">체중이 급히 줄거나</tspan><tspan x="834" dy="21">기운이 크게 떨어질 때</tspan></text><circle cx="820" cy="310" r="4.5" fill="#E8A33D"/><text x="834" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">체질을 이유로 약을 멈춘 뒤</tspan><tspan x="834" dy="21">증상이 다시 나빠질 때</tspan></text><circle cx="820" cy="365" r="4.5" fill="#E8A33D"/><text x="834" y="371" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">체질과 상관없이 새로 생긴</tspan><tspan x="834" dy="21">심한 증상이 있을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">담당 의료기관에서</tspan><tspan x="816" dy="19">먼저 확인하세요</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
