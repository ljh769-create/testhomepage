<rect x="60" y="160" width="360" height="330" rx="22" fill="#22385A" filter="url(#sh)"/><path d="M330 205 a24 24 0 1 0 14 38 a19 19 0 1 1 -14 -38 z" fill="#FBE78A"/><rect x="100" y="360" width="280" height="60" rx="14" fill="#3B5579"/><rect x="100" y="330" width="90" height="40" rx="14" fill="#DCE8F5"/><circle cx="220" cy="336" r="22" fill="#F2D9C4"/><path d="M200 360 h170 v-10 a20 20 0 0 0 -20 -20 h-110 z" fill="#90B2DD"/><text x="260" y="300" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#FBE78A" text-anchor="middle"><tspan x="260" dy="0">z z Z</tspan></text><text x="240" y="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="240" dy="0">먼저 이비인후과·소아청소년과에서</tspan><tspan x="240" dy="20">원인 확인</tspan></text><rect x="440" y="160" width="380" height="330" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="470" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="470" dy="0">보호자가 챙길 기록</tspan></text><circle cx="490" cy="252" r="22" fill="#DCE8F5"/><g transform="translate(490 252) scale(0.8)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-6" y="-18" width="12" height="22" rx="4"/><path d="M-10 4 h20 l-3 12 h-14 z"/></g><text x="526" y="258" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="526" dy="0">코골이·숨 멎음 짧은 영상</tspan></text><circle cx="490" cy="312" r="22" fill="#DCE8F5"/><g transform="translate(490 312) scale(0.8)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -16 a16 16 0 1 0 8 26 a13 13 0 1 1 -8 -26 z"/></g><text x="526" y="318" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="526" dy="0">잠든 시각·일어난 시각</tspan></text><circle cx="490" cy="372" r="22" fill="#DCE8F5"/><g transform="translate(490 372) scale(0.8)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -12 h36 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 h-20 l-10 8 v-8 h-6 a6 6 0 0 1 -6 -6 v-16 a6 6 0 0 1 6 -6 z"/><path d="M-8 0 h16"/></g><text x="526" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="526" dy="0">1년 감기·비염 진료 횟수</tspan></text><circle cx="490" cy="432" r="22" fill="#DCE8F5"/><g transform="translate(490 432) scale(0.8)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 12 L8 -10 L14 -4 L-8 18 L-16 20 Z"/><path d="M4 -6 L10 0"/></g><text x="526" y="438" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="526" dy="0">이비인후과 결과·복용 약</tspan></text><rect x="840" y="160" width="300" height="330" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="870" cy="194" r="12" fill="#E8A33D"/><text x="870" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="870" dy="0">!</tspan></text><text x="892" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="892" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="870" cy="232" r="4.5" fill="#E8A33D"/><text x="884" y="238" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="884" dy="0">숨이 멎는 것 같거나</tspan><tspan x="884" dy="20">아주 시끄럽게 코를 골 때</tspan></text><circle cx="870" cy="284" r="4.5" fill="#E8A33D"/><text x="884" y="290" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="884" dy="0">낮에 지나치게 졸려</tspan><tspan x="884" dy="20">학교생활이 어려울 때</tspan></text><circle cx="870" cy="336" r="4.5" fill="#E8A33D"/><text x="884" y="342" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="884" dy="0">숨쉬기 힘들어하며</tspan><tspan x="884" dy="20">입술이 파래지면 119</tspan></text><rect x="60" y="512" width="1080" height="112" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="548" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">노량진점에서는 이렇게 살핍니다</tspan></text><text x="90" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="90" dy="0">보호자와 함께 잠·코·식사 이야기를 듣고, 아이가 무서워하지 않게 천천히 설명합니다.</tspan></text><text x="90" y="610" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#90B2DD" text-anchor="start"><tspan x="90" dy="0">나이·체중·상태에 맞춰 방법을 신중하게 정합니다.</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 노량진점 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
