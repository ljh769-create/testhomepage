<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">허리 통증과 다리 저림, 어떻게 나눠 볼까요</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">저림의 범위와 심해지는 자세를 먼저 확인합니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="330" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="86" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="86" dy="0">저림은 어디까지 내려가나요</tspan></text><rect x="92" y="218" width="266" height="46" rx="12" fill="#38608F" opacity="0.2"/><text x="112" y="247" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="112" dy="0">허리에 머무름</tspan></text><rect x="106" y="276" width="252" height="46" rx="12" fill="#38608F" opacity="0.42000000000000004"/><text x="126" y="305" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="126" dy="0">엉덩이까지</tspan></text><rect x="120" y="334" width="238" height="46" rx="12" fill="#38608F" opacity="0.64"/><text x="140" y="363" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="140" dy="0">무릎 아래까지</tspan></text><rect x="134" y="392" width="224" height="46" rx="12" fill="#38608F" opacity="0.8600000000000001"/><text x="154" y="421" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="154" dy="0">발끝까지</tspan></text><rect x="410" y="160" width="350" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="436" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="436" dy="0">이럴 때 더 심해지나요</tspan></text><rect x="436" y="216" width="200" height="34" rx="17.0" fill="#DCE8F5"/><text x="536.0" y="238.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="536.0" dy="0">앉아 있을 때</tspan></text><rect x="436" y="260" width="200" height="34" rx="17.0" fill="#DCE8F5"/><text x="536.0" y="282.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="536.0" dy="0">허리를 숙일 때</tspan></text><rect x="436" y="304" width="200" height="34" rx="17.0" fill="#DCE8F5"/><text x="536.0" y="326.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="536.0" dy="0">기침·재채기할 때</tspan></text><text x="436" y="372" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="436" dy="0">한쪽인지 양쪽인지,</tspan><tspan x="436" dy="21">대소변은 평소와 같은지도</tspan><tspan x="436" dy="21">함께 여쭙니다</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일상에서 먼저 해 볼 수 있는 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">무거운 것 들기·오래</tspan><tspan x="110.0" dy="20">숙이기 잠시 줄이기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">앉는 시간 줄이고</tspan><tspan x="330.0" dy="20">자주 일어나 걷기</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">기침할 땐 무릎 굽히고</tspan><tspan x="550.0" dy="20">허리 받치기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">대소변을 보기 어렵거나</tspan><tspan x="834" dy="21">조절이 안 될 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리에 힘이 빠져 걷기</tspan><tspan x="834" dy="21">어렵거나 발이 처질 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">사타구니·항문 주변</tspan><tspan x="834" dy="21">감각이 둔해졌을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">진료를 기다리지 말고</tspan><tspan x="816" dy="19">119나 가까운 응급실로</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
