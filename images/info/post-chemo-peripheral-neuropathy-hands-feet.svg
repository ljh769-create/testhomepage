<circle cx="484" cy="242" r="15" fill="#38608F"/>
<text x="484" y="248" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="484" dy="0">1</tspan></text>
<text x="508" y="238" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="508" dy="0">담당 선생님께 먼저</tspan></text>
<text x="508" y="260" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="508" dy="0">저림 시작·변화 알리기</tspan></text>
