othic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">심한 복통이나 설사가</tspan><tspan x="834" dy="21">이어지는 경우</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">복용 중인 양약은 의사와 상의</tspan><tspan x="816" dy="19">없이 줄이거나 끊지 않습니다</tspan></text>
