" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="530" dy="0">3</tspan></text><text x="530" y="246" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="530" dy="0">먹고 나서</tspan></text><text x="530" y="346" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#4A5D75" text-anchor="middle"><tspan x="530" dy="0">2~3시간은</tspan><tspan x="530" dy="21">눕지 않기</tspan></text><circle cx="700" cy="290" r="24" fill="#DCE8F5" stroke="#38608F" stroke-width="3"/><text x="700" y="296" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="700" dy="0">4</tspan></text><text x="700" y="246" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="700" dy="0">쉴 때</tspan></text><text x="700" y="346" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#4A5D75" text-anchor="middle"><tspan x="700" dy="0">허리띠 풀고</tspan><tspan x="700" dy="21">상체 조금 높이기</tspan></text><rect x="68" y="420" width="684" height="84" rx="16" fill="#F4F8FC"/><text x="92" y="452" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="92" dy="0">왜 불편해지기 쉬울까요</tspan></text><text x="92" y="480" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="92" dy="0">배가 부른 채로 누우면 위의 내용물이 식도로 올라오기 쉽습니다</tspan></text><rect x="800" y="150" width="360" height="380" rx="22" fill="#FFF7E8" stroke="#E8A