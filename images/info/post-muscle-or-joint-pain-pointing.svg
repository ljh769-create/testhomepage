<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">어디가, 언제 아픈지 짚어 보세요</tspan></text><rect x="90" y="222" width="200" height="210" rx="14" fill="#DCE8F5"/><rect x="90" y="222" width="200" height="44" rx="14" fill="#38608F"/><text x="190" y="251" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="190" dy="0">근육</tspan></text><text x="190" y="302" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="190" dy="0">살이 많은 부분</tspan></text><text x="190" y="340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="190" dy="0">많이 쓴 다음 날</tspan></text><text x="190" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="190" dy="0">누르면 아픔</tspan></text><rect x="306" y="222" width="200" height="210" rx="14" fill="#DCE8F5"/><rect x="306" y="222" width="200" height="44" rx="14" fill="#D97F78"/><text x="406" y="251" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="406" dy="0">관절</tspan></text><text x="406" y="302" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="406" dy="0">뼈가 만나는 마디</tspan></text><text x="406" y="340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="406" dy="0">뻣뻣하고 범위 줄어듦</tspan></text><text x="406" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="406" dy="0">아침에 굳기도</tspan></text><rect x="522" y="222" width="200" height="210" rx="14" fill="#DCE8F5"/><rect x="522" y="222" width="200" height="44" rx="14" fill="#3E8E9C"/><text x="622" y="251" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="622" dy="0">힘줄</tspan></text><text x="622" y="302" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="622" dy="0">근육과 뼈를 잇는 곳</tspan></text><text x="622" y="340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="622" dy="0">특정 동작에서</tspan></text><text x="622" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#1F3552" text-anchor="middle"><tspan x="622" dy="0">찌릿하게 아픔</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">찜질은 이렇게</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">갑자기 붓고 열감</tspan><tspan x="110.0" dy="20">→ 차갑게</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">뻐근하고 굳은 느낌</tspan><tspan x="330.0" dy="20">→ 따뜻하게</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">아픈 곳은 사진이나</tspan><tspan x="550.0" dy="20">몸 그림에 표시</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">관절이 갑자기 붓고</tspan><tspan x="834" dy="21">뜨겁고 열이 날 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어진 뒤 체중을</tspan><tspan x="834" dy="21">싣기 어려울 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">여러 관절이 아침마다</tspan><tspan x="834" dy="21">한 시간 넘게 굳을 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">밤에도 아프고</tspan><tspan x="834" dy="21">체중이 줄어들 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">다친 뒤라면 영상 검사가</tspan><tspan x="816" dy="19">가능한 병원 먼저</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
