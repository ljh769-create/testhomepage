<text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">소변·대변 보는</tspan><tspan x="834" dy="21">감각이 달라질 때</tspan></text>
<circle cx="820" cy="344" r="4.5" fill="#E8A33D"/>
<text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">발끝이 끌리고</tspan><tspan x="834" dy="21">계단에서 휘청일 때</tspan></text>
