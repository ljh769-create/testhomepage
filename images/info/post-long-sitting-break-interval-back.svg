o',sans-serif" font-size="15.5" font-weight="400" fill="#5C4310" text-anchor="start"><tspan x="908" dy="0">다리에 힘이 빠지거나</tspan><tspan x="908" dy="21">저림이 점점 심해짐</tspan></text><circle cx="892" cy="280" r="5" fill="#E8A33D"/><text x="908" y="286" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#5C4310" text-anchor="start"><tspan x="908" dy="0">대소변 조절이 어렵거나</tspan><tspan x="908" dy="21">감각이 이상함</tspan></text><circle cx="892" cy="338" r="5" fill="#E8A33D"/><text x="908" y="344" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#5C4310" text-anchor="start"><tspan x="908" dy="0">밤에 쉬어도 통증이 심해</tspan><tspan x="908" dy="21">잠을 깸</tspan></text><rect x="40" y="546" width="1120" height="88" rx="20" fill="#1F3552"/><text x="68" y="582" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#FBE78A" text-anchor="start"><tspan x="68" dy="0">이렇게 적어 오시면 상담이 쉬워집니다</tspan></text><circle cx="74" cy="610" r="5" fill="#FBE78A"/><text x="88" y="616" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#fff" text-anchor="start"><tspan x="88" dy="0">하루 앉아 있는 시간</tspan></text><circle cx="427" cy="610" r="5" fill="#FBE78A"/><text x="441" y="616" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#fff" text-anchor="start"><tspan x="441" dy="0">뻐근함이 시작되는 시각·자세</tspan></text><circle cx="780" cy="610" r="5" fill="#FBE78A"/><text x="794" y="616" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15.5" font-weight="400" fill="#fff" text-anchor="start"><tspan x="794" dy="0">의자·책상 높이(사진도 좋음)</tspan></text>
