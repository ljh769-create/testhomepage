<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">시험 전 불안, 없애기보다 다루기</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">짧게 숨 고르고, 걱정은 종이로 옮깁니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#7A5AA8"/>
<rect x="60" y="160" width="520" height="220" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">하루 몇 번, 숨 고르기</tspan></text><rect x="100" y="240" width="176" height="56" rx="28" fill="#90B2DD"/><text x="188" y="275" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="188" dy="0">4초 들이쉬고</tspan></text><rect x="290" y="240" width="250" height="56" rx="28" fill="#38608F"/><text x="415" y="275" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="415" dy="0">6초 내쉬기</tspan></text><text x="320" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="320" dy="0">몇 차례 반복 · 어지러우면 멈추기</tspan></text><rect x="600" y="160" width="540" height="220" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="630" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="630" dy="0">걱정을 종이에 옮겨 나누기</tspan></text><rect x="630" y="220" width="235" height="138" rx="14" fill="#DCE8F5"/><text x="747" y="250" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="747" dy="0">오늘 할 수 있는 일</tspan></text><text x="747" y="282" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="747" dy="0">단원 하나 복습</tspan><tspan x="747" dy="22">문제 10개 풀기</tspan></text><rect x="880" y="220" width="235" height="138" rx="14" fill="#EEF1F6"/><text x="997" y="250" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="997" dy="0">지금 바꿀 수 없는 일</tspan></text><text x="997" y="282" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="997" dy="0">시험 결과</tspan><tspan x="997" dy="22">다른 사람의 기대</tspan></text><text x="885" y="372" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="400" fill="#4A5D75" text-anchor="middle"><tspan x="885" dy="0">(예시)</tspan></text><rect x="60" y="400" width="640" height="230" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="440" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">하루를 닫는 작은 순서</tspan></text><circle cx="104" cy="478" r="14" fill="#FBE78A"/><text x="104" y="483" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="104" dy="0">1</tspan></text><text x="130" y="484" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="130" dy="0">내일 할 일 세 가지만 적고 덮기</tspan></text><circle cx="104" cy="524" r="14" fill="#FBE78A"/><text x="104" y="529" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="104" dy="0">2</tspan></text><text x="130" y="530" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="130" dy="0">가볍게 걷거나 스트레칭</tspan></text><circle cx="104" cy="570" r="14" fill="#FBE78A"/><text x="104" y="575" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="104" dy="0">3</tspan></text><text x="130" y="576" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="130" dy="0">잠들기 30분 전엔 자료 대신 샤워</tspan></text><rect x="720" y="400" width="420" height="230" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="750" cy="434" r="12" fill="#E8A33D"/><text x="750" y="440" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="750" dy="0">!</tspan></text><text x="772" y="441" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="772" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="750" cy="468" r="4.5" fill="#E8A33D"/><text x="764" y="474" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="764" dy="0">숨이 막히거나 가슴 통증이 갑자기</tspan></text><circle cx="750" cy="498" r="4.5" fill="#E8A33D"/><text x="764" y="504" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="764" dy="0">불안이 몇 주 넘게 이어져</tspan><tspan x="764" dy="20">일상이 어려울 때</tspan></text><circle cx="750" cy="548" r="4.5" fill="#E8A33D"/><text x="764" y="554" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="764" dy="0">삶을 포기하고 싶은 생각이 들 때</tspan><tspan x="764" dy="20">→ 109 · 119 바로 연락</tspan></text>
