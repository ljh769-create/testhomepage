<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">다른 곳에서 치료받다 옮겨 오실 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">지난 치료를 알면 같은 방법을 되풀이하지 않습니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">옮겨 오실 때 챙기면 좋은 4가지</tspan></text><rect x="90" y="222" width="310" height="92" rx="16" fill="#F4F8FC"/><circle cx="134" cy="268" r="28" fill="#DCE8F5"/><g transform="translate(134 270) scale(0.85)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 12 L8 -10 L14 -4 L-8 18 L-16 20 Z"/><path d="M4 -6 L10 0"/></g><rect x="176" y="252" width="22" height="22" rx="5" fill="none" stroke="#38608F" stroke-width="2.5"/><text x="208" y="272" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="208" dy="0">이전 기관·기간·치료 이름</tspan></text><rect x="420" y="222" width="310" height="92" rx="16" fill="#F4F8FC"/><circle cx="464" cy="268" r="28" fill="#DCE8F5"/><g transform="translate(464 270) scale(0.85)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -12 h36 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 h-20 l-10 8 v-8 h-6 a6 6 0 0 1 -6 -6 v-16 a6 6 0 0 1 6 -6 z"/><path d="M-8 0 h16"/></g><rect x="506" y="252" width="22" height="22" rx="5" fill="none" stroke="#38608F" stroke-width="2.5"/><text x="538" y="272" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="538" dy="0">좋아진 점, 그대로인 점</tspan></text><rect x="90" y="328" width="310" height="92" rx="16" fill="#F4F8FC"/><circle cx="134" cy="374" r="28" fill="#DCE8F5"/><g transform="translate(134 376) scale(0.85)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-6" y="-18" width="12" height="22" rx="4"/><path d="M-10 4 h20 l-3 12 h-14 z"/></g><rect x="176" y="358" width="22" height="22" rx="5" fill="none" stroke="#38608F" stroke-width="2.5"/><text x="208" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="208" dy="0">영상·혈액 검사 결과지 사진</tspan></text><rect x="420" y="328" width="310" height="92" rx="16" fill="#F4F8FC"/><circle cx="464" cy="374" r="28" fill="#DCE8F5"/><g transform="translate(464 376) scale(0.85)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -18 C10 -4 14 2 14 8 a14 14 0 0 1 -28 0 c0 -6 4 -12 14 -26 z"/></g><rect x="506" y="358" width="22" height="22" rx="5" fill="none" stroke="#38608F" stroke-width="2.5"/><text x="538" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="538" dy="0">약·한약·영양제와 시작 시기</tspan></text><text x="480" y="450" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="480" dy="0">사진·메모로 충분합니다. 원본은 없어도 괜찮아요</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">미리 해 두면 좋은 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">치료 이름과 기간을</tspan><tspan x="110.0" dy="20">휴대폰 메모로</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">약 봉투나 처방전을</tspan><tspan x="330.0" dy="20">사진으로</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">불편했던 치료가</tspan><tspan x="550.0" dy="20">있었다면 적기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">치료 중 저림이나</tspan><tspan x="834" dy="21">힘 빠짐이 새로 생겼을 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">이유 모를 체중 감소,</tspan><tspan x="834" dy="21">밤에 심해지는 통증</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">함께 먹은 뒤 두드러기·</tspan><tspan x="834" dy="21">숨 가쁨이 있었을 때</tspan></text><text x="816" y="606" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">복용 중인 약은 임의로 끊지 않기</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>