<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">검진 결과표에서 볼 다섯 가지</tspan></text><rect x="90" y="226" width="122" height="120" rx="14" fill="#F4F8FC"/><rect x="136" y="246" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#4E9A86" stroke-width="3"/><text x="151" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="151" dy="0">허리둘레</tspan></text><rect x="222" y="226" width="122" height="120" rx="14" fill="#F4F8FC"/><rect x="268" y="246" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#4E9A86" stroke-width="3"/><text x="283" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="283" dy="0">혈압</tspan></text><rect x="354" y="226" width="122" height="120" rx="14" fill="#F4F8FC"/><rect x="400" y="246" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#4E9A86" stroke-width="3"/><text x="415" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="415" dy="0">공복혈당</tspan></text><rect x="486" y="226" width="122" height="120" rx="14" fill="#F4F8FC"/><rect x="532" y="246" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#4E9A86" stroke-width="3"/><text x="547" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="547" dy="0">중성지방</tspan></text><rect x="618" y="226" width="122" height="120" rx="14" fill="#F4F8FC"/><rect x="664" y="246" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#4E9A86" stroke-width="3"/><text x="679" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="679" dy="0">HDL 콜레스테롤</tspan></text><text x="410" y="386" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#38608F" text-anchor="middle"><tspan x="410" dy="0">체중이 같아도 근육이 줄고 지방이 늘면</tspan></text><text x="410" y="412" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#38608F" text-anchor="middle"><tspan x="410" dy="0">배 둘레가 먼저 커지는 경우가 있습니다</tspan></text><text x="410" y="440" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="410" dy="0">필요하다고 판단될 때 인바디로 근육량·체지방 확인</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">기록해 오시면 좋은 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">최근 2~3년</tspan><tspan x="110.0" dy="20">검진 결과지</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">앉아 있는 시간과</tspan><tspan x="330.0" dy="20">걷는 양</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">야식·단 음료 횟수</tspan><tspan x="550.0" dy="20">가족력·복용 약</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">검진 수치가 기준을</tspan><tspan x="834" dy="21">크게 넘은 경우</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갈증이 심하고</tspan><tspan x="834" dy="21">소변이 많아지는 경우</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">이유 없이</tspan><tspan x="834" dy="21">체중이 빠지는 경우</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">진단과 약 조절은</tspan><tspan x="816" dy="19">내과에서 먼저 확인</tspan></text>
