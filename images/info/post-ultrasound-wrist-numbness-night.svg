살핍니다</tspan></text><rect x="500" y="160" width="640" height="220" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="530" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="530" dy="0">손목일까요, 목일까요</tspan></text><rect x="530" y="222" width="285" height="130" rx="16" fill="#F4F8FC"/><text x="672" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#38608F" text-anchor="middle"><tspan x="672" dy="0">손목 안쪽 통로</tspan></text><text x="672" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#4A5D75" text-anchor="middle"><tspan x="672" dy="0">밤·새벽에 잦고</tspan><tspan x="672" dy="22">털면 줄어드는 저림</tspan></text><rect x="830" y="222" width="285" height="130" rx="16" fill="#F4F8FC"/><text x="972" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#38608F" text-anchor="middle"><tspan x="972" dy="0">목에서 내려오는 신경</tspan></text><text x="972" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#4A5D75" text-anchor="middle"><tspan x="972" dy="0">목·어깨 통증과</tspan><tspan x="972" dy="22">함께 오는 저림</tspan></text><rect x="500" y="396" width="640" height="76" rx="18" fill="#1F3552"/><text x="530" y="428" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="530" dy="0">필요할 때 초음파로 손목 안쪽 통로 주변을 함께 봅니다</tspan></text><text x="530" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#FBE78A" text-anchor="start"><tspan x="530" dy="0">신경 기능 검사가 필요하면 다른 의료기관을 안내합니다</tspan></text><rect x="500" y="488" width="640" height="132" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="530" cy="522" r="12" fill="#E8A33D"/><text x="530" y="528" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="530" dy="0">!</tspan></text><text x="552" y="529" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="552" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="530" cy="560" r="4.5" fill="#E8A33D"/><text x="544" y="566" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="544" dy="0">힘이 빠져 물건을 자주 떨어뜨릴 때</tspan><tspan x="544" dy="20">말이 어눌하고 한쪽 팔다리가 저릴 때 → 119</tspan></text>
