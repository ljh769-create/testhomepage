<text x="110" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110" dy="0">잠든 시각과</tspan><tspan x="110" dy="20">아침 개운함 점수</tspan></text>
