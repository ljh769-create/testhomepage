<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><circle cx="410" cy="310" r="62" fill="#FBE78A"/><text x="410" y="302" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="410" dy="0">헛기침</tspan></text><text x="410" y="328" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#38608F" text-anchor="middle"><tspan x="410" dy="0">“흠흠”</tspan></text><rect x="70" y="184" width="240" height="70" rx="14" fill="#DCE8F5"/><text x="190" y="214" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="190" dy="0">코·부비동 콧물이</tspan><tspan x="190" dy="20">목 뒤로</tspan></text><path d="M270 254 L362 274" stroke="#90B2DD" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="510" y="184" width="240" height="70" rx="14" fill="#DCE8F5"/><text x="630" y="214" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="630" dy="0">건조한 실내에서</tspan><tspan x="630" dy="20">끈적한 콧물</tspan></text><path d="M550 254 L458 274" stroke="#90B2DD" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="70" y="364" width="240" height="70" rx="14" fill="#DCE8F5"/><text x="190" y="394" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="190" dy="0">위산이 목까지</tspan><tspan x="190" dy="20">올라올 때</tspan></text><path d="M270 364 L362 346" stroke="#90B2DD" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="510" y="364" width="240" height="70" rx="14" fill="#DCE8F5"/><text x="630" y="394" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="630" dy="0">헛기침이 목을</tspan><tspan x="630" dy="20">더 예민하게</tspan></text><path d="M550 364 L458 346" stroke="#90B2DD" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">헛기침 대신 해 볼 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">물 한 모금</tspan><tspan x="110.0" dy="20">삼키기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">실내 습도 맞추고</tspan><tspan x="330.0" dy="20">물 자주 마시기</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">잠들기 2~3시간 전</tspan><tspan x="550.0" dy="20">먹지 않기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">누런 콧물·얼굴 통증·열이</tspan><tspan x="834" dy="21">열흘 넘게 이어질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">한쪽 코만 막히고</tspan><tspan x="834" dy="21">피 섞인 콧물</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">삼키기 어렵거나</tspan><tspan x="834" dy="21">목소리가 계속 쉴 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">숨이 차고 입술이 파래지면 가까운 응급실</tspan><tspan x="816" dy="19">흡입기·약은 임의로 끊지 않기</tspan></text>
