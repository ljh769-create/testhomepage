ans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="489" dy="0">혀를 세게</tspan><tspan x="489" dy="20">긁는 양치</tspan></text><rect x="576" y="222" width="150" height="150" rx="14" fill="#F4F8FC"/><circle cx="651" cy="264" r="26" fill="#DCE8F5"/><g transform="translate(651 264) scale(0.8)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -12 h36 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 h-20 l-10 8 v-8 h-6 a6 6 0 0 1 -6 -6 v-16 a6 6 0 0 1 6 -6 z"/><path d="M-8 0 h16"/></g><text x="651" y="318" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="651" dy="0">입 숨쉬기·</tspan><tspan x="651" dy="20">흡연·일부 약</tspan></text><rect x="90" y="390" width="640" height="70" rx="14" fill="#DCE8F5"/><text x="110" y="420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">진료 30분 전부터 색 진한 것은 피하기</tspan></text><text x="110" y="444" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="110" dy="0">맹물은 괜찮고, 드신 것은 그대로 말하기</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 준비해 오세요</tspan></text><circle cx="96.0" cy="566" r="5" fill="#FBE78A"/><text x="110.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">평소처럼만</tspan><tspan x="110.0" dy="20">양치하기</tspan></text><circle cx="316.0" cy="566" r="5" fill="#FBE78A"/><text x="330.0"