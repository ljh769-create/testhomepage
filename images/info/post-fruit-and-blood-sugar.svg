span><tspan x="410" dy="21">빨리 흡수된다고 알려짐</tspan></text><rect x="335" y="410" width="150" height="30" rx="15.0" fill="#DCE8F5"/><text x="410.0" y="430.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="410.0" dy="0">생과일로 바꾸기</tspan></text><rect x="534" y="160" width="226" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><circle cx="647" cy="224" r="40" fill="#B08455" opacity="0.18"/><circle cx="647" cy="224" r="24" fill="#B08455"/><text x="647" y="296" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="647" dy="0">말린 과일</tspan></text><text x="647" y="322" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#B08455" text-anchor="middle"><tspan x="647" dy="0">부피가 작아</tspan></text><text x="647" y="356" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="647" dy="0">생각보다 많이 먹기 쉬워</tspan><tspan x="647" dy="21">작은 접시에 덜어 두기</tspan></text><rect x="572" y="410" width="150" height="30" rx="15.0" fill="#DCE8F5"/><text x="647.0" y="430.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="647.0" dy="0">양을 정해 두기</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">먹는 때도 함께 봅니다</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">간식으로 따로보다</tspan><tspan x="110.0" dy="20">식사 중·뒤에 조금</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">채소·견과류를</tspan><tspan x="330.0" dy="20">조금 곁들이기</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">일주일 과일 먹은</tspan><tspan x="550.0" dy="20">시간과 양 적기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">당뇨약·인슐린을 쓰는 경우</tspan><tspan x="834" dy="21">과일 양과 시간은 처방한</tspan><tspan x="834" dy="21">의사와 상의하세요</tspan></text><circle cx="820" cy="310" r="4.5" fill="#E8A33D"/><text x="834" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갈증·소변량이 부쩍 늘고</tspan><tspan x="834" dy="21">체중이 줄어들 때</tspan></text><circle cx="820" cy="365" r="4.5" fill="#E8A33D"/><text x="834" y="371" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">식사 뒤 식은땀이나</tspan><tspan x="834" dy="21">손 떨림이 있을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">이런 경우에는 내과 등에서</tspan><tspan x="816" dy="19">먼저 확인하세요</tspan></text>
