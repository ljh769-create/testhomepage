<text x="674" y="302" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" fill="#5A3B0A" text-anchor="start"><tspan x="674" dy="0">다리가 심하게 붓고</tspan><tspan x="674" dy="22">숨이 차는 경우</tspan></text>
