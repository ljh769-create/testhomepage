span><tspan x="562" dy="20">자주 깨게 하기 쉬움</tspan></text><rect x="546" y="320" width="200" height="86" rx="14" fill="#2C4568"/><text x="562" y="358.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">기름진 음식은</tspan><tspan x="562" dy="20">소화에 시간이 걸림</tspan></text><rect x="546" y="418" width="200" height="86" rx="14" fill="#2C4568"/><text x="562" y="456.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">들뜬 기분에 머리가</tspan><tspan x="562" dy="20">늦게까지 깨어 있음</tspan></text><rect x="546" y="516" width="200" height="86" rx="14" fill="#2C4568"/><text x="562" y="554.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">늦잠 보충이 그날</tspan><tspan x="562" dy="20">밤잠을 또 밀어냄</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">술 없이는 잠들기</tspan><tspan x="834" dy="21">어렵다고 느껴질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y