<rect x="60" y="160" width="340" height="466" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="86" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="86" dy="0">변비가 생기기 쉬운 이유</tspan></text><rect x="84" y="222" width="292" height="86" rx="14" fill="#F4F8FC"/><circle cx="120" cy="265.0" r="22" fill="#DCE8F5"/><g transform="translate(120 265.0) scale(0.7)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -18 C10 -4 14 2 14 8 a14 14 0 0 1 -28 0 c0 -6 4 -12 14 -26 z"/></g><text x="156" y="261.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="156" dy="0">물을 적게 마셔</tspan><tspan x="156" dy="19">변이 단단해짐</tspan></text><rect x="84" y="318" width="292" height="86" rx="14" fill="#F4F8FC"/><circle cx="120" cy="361.0" r="22" fill="#DCE8F5"/><g transform="translate(120 361.0) scale(0.7)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-14" r="6"/><path d="M0 -8 v16 M-12 -2 l12 -2 l12 2 M0 8 l-8 14 M0 8 l8 14"/></g><text x="156" y="357.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="156" dy="0">오래 앉아</tspan><tspan x="156" dy="19">움직임이 줄어듦</tspan></text><rect x="84" y="414" width="292" height="86" rx="14" fill="#F4F8FC"/><circle cx="120" cy="457.0" r="22" fill="#DCE8F5"/><g transform="translate(120 457.0) scale(0.7)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-22 2 h10 l5 -12 l8 22 l6 -14 l4 4 h11"/></g><text x="156" y="453.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="156" dy="0">변의를 자주 참아</tspan><tspan x="156" dy="19">리듬이 흐트러짐</tspan></text><rect x="84" y="510" width="292" height="86" rx="14" fill="#F4F8FC"/><circle cx="120" cy="553.0" r="22" fill="#DCE8F5"/><g transform="translate(120 553.0) scale(0.7)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 -2 h40 a20 18 0 0 1 -40 0 z"/><path d="M-8 -8 q4 -6 0 -12 M2 -8 q4 -6 0 -12"/></g><text x="156" y="549.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="156" dy="0">간단한 음식 위주,</tspan><tspan x="156" dy="19">채소·과일 부족</tspan></text><rect x="420" y="160" width="340" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="446" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="446" dy="0">운행 하루에 묶어 두기</tspan></text><rect x="446" y="222" width="290" height="86" rx="14" fill="#2C4568"/><text x="464" y="250" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="464" dy="0">첫 운행 전</tspan></text><text x="464" y="274" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="464" dy="0">아침 먹고 10분쯤</tspan><tspan x="464" dy="19">화장실에 앉아 보기</tspan></text><rect x="446" y="320" width="290" height="86" rx="14" fill="#2C4568"/><text x="464" y="348" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="464" dy="0">종점마다</tspan></text><text x="464" y="372" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="464" dy="0">물 두세 모금과</tspan><tspan x="464" dy="19">짧은 걷기 한 번</tspan></text><rect x="446" y="418" width="290" height="86" rx="14" fill="#2C4568"/><text x="464" y="446" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="464" dy="0">하루 한 번</tspan></text><text x="464" y="470" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="464" dy="0">채소·과일·잡곡</tspan><tspan x="464" dy="19">챙기기</tspan></text><rect x="446" y="516" width="290" height="86" rx="14" fill="#2C4568"/><text x="464" y="544" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="464" dy="0">미리 알아 두기</tspan></text><text x="464" y="568" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="464" dy="0">노선의 화장실 위치,</tspan><tspan x="464" dy="19">쉬는 시간에 들르기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">피가 섞인 변이나</tspan><tspan x="834" dy="21">검은 변을 볼 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">배가 심하게 아프고</tspan><tspan x="834" dy="21">가스나 변이 안 나올 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">소변 볼 때 통증이 있거나</tspan><tspan x="834" dy="21">피가 보일 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">변비와 함께 체중이</tspan><tspan x="834" dy="21">이유 없이 줄어들 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">변비약 등 드시는 약은</tspan><tspan x="816" dy="19">임의로 끊지 마세요</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
