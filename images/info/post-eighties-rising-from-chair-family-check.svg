h d="M405.0 280.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="419.0" y="222" width="146.5" height="130" rx="14" fill="#F4F8FC"/><circle cx="445.0" cy="250" r="15" fill="#3E9C8A"/><text x="445.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="445.0" dy="0">3</tspan></text><text x="467.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="467.0" dy="0">잠깐 멈춤</tspan></text><text x="437.0" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="437.0" dy="0">일어선 직후</tspan><tspan x="437.0" dy="19">균형 잡기</tspan></text><path d="M569.5 280.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="583.5" y="222" width="146.5" height="130" rx="14" fill="#F4F8FC"/><circle cx="609.5" cy="250" r="15" fill="#3E9C8A"/><text x="609.5" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="609.5" dy="0">4</tspan></text><text x="631.5" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="631.5" dy="0">걷기 시작</tspan></text><text x="601.5" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="601.5" dy="0">균형을 잡은</tspan><tspan x="601.5" dy="19">뒤에 걷기</tspan></text><rect x="90" y="372" width="640" height="60" rx="12" fill="#DCE8F5"/><text x="112" y="407.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#3E9C8A" text-anchor="start"><tspan x="112" dy="0">의자 고르기</tspan></text><text x="220" y="397.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="220" dy="0">팔걸이 있고 높이가 적당한 단단한 의자,</tspan><tspan x="220" dy="20">낮은 소파에는 방석을 더해 높이 올리기</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">가족이 적어 오시면 좋은 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">어려워진 시기와</tspan><tspan x="110.0" dy="20">갑작스러운 변화</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">어지럽다고 하신</tspan><tspan x="330.0" dy="20">날과 시간대</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">복용 약 목록</tspan><tspan x="550.0" dy="20">(최근 바뀐 약 표시)</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">한쪽 팔다리 힘이 빠지거나</tspan><tspan x="834" dy="21">말이 어눌해질 때 (즉시 가까운 응급실)</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">일어설 때 정신을 잃거나</tspan><tspan x="834" dy="21">가슴이 답답할 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어진 뒤 걷거나 서기</tspan><tspan x="834" dy="21">어려워졌을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">복용 약은 처방 의사와 상의</tspan><tspan x="816" dy="19">없이 줄이거나 끊지 않기</tspan></text>
