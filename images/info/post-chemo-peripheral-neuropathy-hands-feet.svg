<text x="110" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110" dy="0">손발 그림에</tspan><tspan x="110" dy="20">저린 범위 색칠</tspan></text>
<circle cx="316" cy="566" r="5" fill="#FBE78A"/>
<text x="330" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330" dy="0">저림 세기</tspan><tspan x="330" dy="20">0~10과 시간대</tspan></text>
<circle cx="536" cy="566" r="5" fill="#FBE78A"/>
<text x="550" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550" dy="0">어려워진 동작</tspan><tspan x="550" dy="20">휘청한 순간</tspan></text>
<rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/>
<circle cx="820" cy="194" r="12" fill="#E8A33D"/>
<text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text>
<text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text>
<circle cx="820" cy="234" r="4.5" fill="#E8A33D"/>
<text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">항암 치료 중 열이 남</tspan></text>
<circle cx="820" cy="271" r="4.5" fill="#E8A33D"/>
<text x="834" y="277" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손발 상처가 붉게 붓고</tspan><tspan x="834" dy="21">고름이 생김</tspan></text>
<circle cx="820" cy="329" r="4.5" fill="#E8A33D"/>
<text x="834" y="335" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">저림이 며칠 사이</tspan><tspan x="834" dy="21">빠르게 심해짐</tspan></text>
<circle cx="820" cy="387" r="4.5" fill="#E8A33D"/>
<text x="834" y="393" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리 힘이 빠지거나</tspan><tspan x="834" dy="21">소변·대변 조절이 어려움</tspan></text>
<rect x="812" y="554" width="306" height="2" fill="#E8A33D" opacity="0.5"/>
<text x="816" y="580" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">이런 신호가 있으면 가까운 병원이나 응급실을</tspan><tspan x="816" dy="20">먼저 찾으세요.</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
