<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">부담이 모이기 쉬운 곳</tspan></text><rect x="90.0" y="222" width="204.0" height="150" rx="14" fill="#F4F8FC"/><circle cx="124.0" cy="256" r="21" fill="#DCE8F5"/><g transform="translate(124.0 256) scale(0.62)" fill="none" stroke="#C9575B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-6 16 v-20 a4 4 0 0 1 8 0 v12"/><path d="M2 4 v-6 a4 4 0 0 1 8 0 v8"/><path d="M10 6 v-2 a4 4 0 0 1 8 0 v8 a14 14 0 0 1 -14 14 h-4 a12 12 0 0 1 -10 -6 l-8 -12 a4 4 0 0 1 6 -4 l6 6"/></g><text x="154.0" y="263" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#C9575B" text-anchor="start"><tspan x="154.0" dy="0">손목·엄지</tspan></text><text x="108.0" y="308" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="108.0" dy="0">손목을 꺾은 채</tspan><tspan x="108.0" dy="21">엄지에 힘을 줄 때</tspan></text><rect x="308.0" y="222" width="204.0" height="150" rx="14" fill="#F4F8FC"/><circle cx="342.0" cy="256" r="21" fill="#DCE8F5"/><g transform="translate(342.0 256) scale(0.62)" fill="none" stroke="#C9575B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-14" r="6"/><path d="M0 -8 v16 M-12 -2 l12 -2 l12 2 M0 8 l-8 14 M0 8 l8 14"/></g><text x="372.0" y="263" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#C9575B" text-anchor="start"><tspan x="372.0" dy="0">어깨·목</tspan></text><text x="326.0" y="308" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="326.0" dy="0">늘 같은 팔로</tspan><tspan x="326.0" dy="21">안아 한쪽만 긴장</tspan></text><rect x="526.0" y="222" width="204.0" height="150" rx="14" fill="#F4F8FC"/><circle cx="560.0" cy="256" r="21" fill="#DCE8F5"/><g transform="translate(560.0 256) scale(0.62)" fill="none" stroke="#C9575B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -16 a16 16 0 1 0 8 26 a13 13 0 1 1 -8 -26 z"/></g><text x="590.0" y="263" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#C9575B" text-anchor="start"><tspan x="590.0" dy="0">등</tspan></text><text x="544.0" y="308" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="544.0" dy="0">수유하며 앞으로</tspan><tspan x="544.0" dy="21">숙이는 시간이 길 때</tspan></text><rect x="90" y="388" width="640" height="60" rx="12" fill="#DCE8F5"/><text x="112" y="423.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#C9575B" text-anchor="start"><tspan x="112" dy="0">아기띠</tspan></text><text x="220" y="413.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="220" dy="0">어깨끈과 허리 지지대를 몸에 맞게 조절하기,</tspan><tspan x="220" dy="20">가능하면 다른 보호자와 안는 시간 나누기</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일상에서 먼저 해 볼 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">안는 팔 번갈아,</tspan><tspan x="110.0" dy="20">몸 가까이 붙여 안기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">수유 땐 쿠션으로</tspan><tspan x="330.0" dy="20">아기 높이기</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">손목 꺾지 말고</tspan><tspan x="550.0" dy="20">팔 전체로 안기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손가락에 힘이 빠지고</tspan><tspan x="834" dy="21">물건을 자주 놓칠 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손목·팔에 붓기와 열감,</tspan><tspan x="834" dy="21">붉어짐이 함께 있을 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">출산 후 심한 통증이나</tspan><tspan x="834" dy="21">출혈, 열이 있을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">수유 중 먹는 약은 처방 의사와</tspan><tspan x="816" dy="19">상의 없이 바꾸지 않기</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
