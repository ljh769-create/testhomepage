ht="500" fill="#4A5D75" text-anchor="start"><tspan x="327.33333333333337" dy="0">추위·열감·붓기·</tspan><tspan x="327.33333333333337" dy="19">쥐·잠은 어떤지</tspan></text><path d="M514.6666666666667 273.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="528.6666666666667" y="222" width="201.33333333333334" height="116" rx="14" fill="#F4F8FC"/><circle cx="554.6666666666667" cy="250" r="15" fill="#38608F"/><text x="554.6666666666667" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="554.6666666666667" dy="0">3</tspan></text><text x="576.6666666666667" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="576.6666666666667" dy="0">살피고 정하기</tspan></text><text x="546.6666666666667" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="546.6666666666667" dy="0">필요하면 진찰·초음파,</tspan><tspan x="546.6666666666667" dy="19">침·추나·한약 상담</tspan></text><circle cx="96" cy="373" r="5" fill="#38608F"/><text x="110" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">첫날 정한 방법은 다음 진료 때 조정해요</tspan></text><circle cx="96" cy="403" r="5" fill="#38608F"/><text x="110" y="408" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">귀가 전 집에서 지켜볼 점을 알려 드려요</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">적어 오시면 좋아요</tspan></text><circle cx="96.0" cy="566" r="5" fill="#FBE78A"/><text x="110.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">아픈 동작과</tspan><tspan x="110.0" dy="20">정도(0~10)</tspan></text><circle cx="316.0" cy="566" r="5" fill="#FBE78A"/><text x="330.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">하루 중</tspan><tspan x="330.0" dy="20">아픈 시간대</tspan></text><circle cx="536.0" cy="566" r="5" fill="#FBE78A"/><text x="550.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">복용 약과</tspan><tspan x="550.0" dy="20">검사 결과지</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어지거나 사고 뒤</tspan><tspan x="834" dy="21">심한 통증과 붓기</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리 힘 빠짐이나</tspan><tspan x="834" dy="21">대소변 조절 어려움</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">열과 함께</tspan><tspan x="834" dy="21">허리가 아플 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">다리 힘 빠짐·대소변 문제는</tspan><tspan x="816" dy="19">바로 응급실로</tspan></text>
