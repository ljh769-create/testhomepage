<text x="562" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">진료 전 한두 시간은</tspan><tspan x="562" dy="20">진한 커피 피하기</tspan></text>
