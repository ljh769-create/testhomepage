gun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#4A5D75" text-anchor="middle"><tspan x="711" dy="0">피부 질환이나</tspan><tspan x="711" dy="19">금속 알레르기</tspan></text><text x="60" y="430" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">무섭다는 마음도 미리 말씀해 주시면 천천히 설명하며 진행합니다</tspan></text><rect x="60" y="456" width="720" height="174" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="492" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">치료 전에 하면 좋은 것</tspan></text><circle cx="96.0" cy="520" r="5" fill="#FBE78A"/><text x="110.0" y="526" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">너무 배고픈 상태 피하기</tspan></text><circle cx="316.0" cy="520" r="5" fill="#FBE78A"/><text x="330.0" y="526" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">편한 옷으로 오기</tspan></text><circle cx="536.0" cy="520" r="5" fill="#FBE78A"/><text x="550.0" y="526" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">전날 과음 피하기</tspan></text><circle cx="96.0" cy="550" r="5" fill="#FBE78A"/><text x="110.0" y="556" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">불편하면 바로 말하기</tspan></text><circle cx="316.0" cy="550" r="5" fill="#FBE78A"/><text x="330.0" y="556" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" f