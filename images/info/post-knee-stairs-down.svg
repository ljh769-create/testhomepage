<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#E6EEF8"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1F3552" flood-opacity=".10"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><circle cx="1130" cy="40" r="150" fill="#DCE8F5" opacity=".55"/><circle cx="40" cy="650" r="110" fill="#DCE8F5" opacity=".5"/><g transform="translate(1100,90)"><path d="M-40,30 h20 v-20 h20 v-20 h20 v-20 h20" fill="none" stroke="#38608F" stroke-width="4" stroke-linejoin="round"/></g><text x="60" y="72" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="36" fill="#1F3552" font-weight="800" text-anchor="start"><tspan x="60" dy="0">계단을 내려갈 때 무릎이 아프다면</tspan></text><text x="60" y="108" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" fill="#38608F" font-weight="500" text-anchor="start"><tspan x="60" dy="0">"무릎이 아프다"에서 한 걸음 더, 오를 때와 내려갈 때를 나눠 봅니다</tspan></text><rect x="60" y="122" width="56" height="4" rx="2" fill="#38608F"/><rect x="40" y="150" width="360" height="260" rx="22" fill="#fff" filter="url(#sh)"/><path d="M80,370 h60 v-45 h60 v-45 h60 v-45 h60" fill="none" stroke="#90B2DD" stroke-width="6" stroke-linejoin="round"/><path d="M300,250 l-130,110" stroke="#E8A33D" stroke-width="3" stroke-dasharray="7 6"/><path d="M178,340 l-10,22 l22,-8" fill="none" stroke="#E8A33D" stroke-width="3"/><text x="70" y="190" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#1F3552" font-weight="800" text-anchor="start"><tspan x="70" dy="0">내려갈 때 더 부담이 큰 이유</tspan></text><text x="70" y="220" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" fill="#51657F" font-weight="400" text-anchor="start"><tspan x="70" dy="0">무릎이 체중을 받으며</tspan><tspan x="70" dy="22">천천히 버텨야 하는 동작</tspan></text><rect x="420" y="150" width="380" height="260" rx="22" fill="#fff" filter="url(#sh)"/><text x="450" y="190" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#1F3552" font-weight="800" text-anchor="start"><tspan x="450" dy="0">먼저 이렇게 여쭙니다</tspan></text><circle cx="460" cy="227" r="5" fill="#38608F"/><text x="476" y="232" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#1F3552" font-weight="500" text-anchor="start"><tspan x="476" dy="0">오를 때와 내려갈 때 중</tspan><tspan x="476" dy="22">언제 더 불편한가요?</tspan></text><circle cx="460" cy="285" r="5" fill="#38608F"/><text x="476" y="290" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#1F3552" font-weight="500" text-anchor="start"><tspan x="476" dy="0">난간 없이 몇 층까지</tspan><tspan x="476" dy="22">내려갈 수 있나요?</tspan></text><circle cx="460" cy="343" r="5" fill="#38608F"/><text x="476" y="348" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#1F3552" font-weight="500" text-anchor="start"><tspan x="476" dy="0">평지·쪼그려 앉을 때는</tspan><tspan x="476" dy="22">어떤가요?</tspan></text><rect x="830" y="150" width="330" height="260" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2"/><circle cx="860" cy="182" r="12" fill="#E8A33D"/><text x="860" y="188" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="860" dy="0">!</tspan></text><text x="882" y="188" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" fill="#8A5A12" font-weight="800" text-anchor="start"><tspan x="882" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="860" cy="217" r="4" fill="#E8A33D"/><text x="874" y="222" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#1F3552" font-weight="500" text-anchor="start"><tspan x="874" dy="0">넘어진 뒤 갑자기 붓고 아픔</tspan></text><circle cx="860" cy="251" r="4" fill="#E8A33D"/><text x="874" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#1F3552" font-weight="500" text-anchor="start"><tspan x="874" dy="0">붉고 뜨거우며 열이 남</tspan></text><circle cx="860" cy="285" r="4" fill="#E8A33D"/><text x="874" y="290" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" fill="#1F3552" font-weight="500" text-anchor="start"><tspan x="874" dy="0">체중을 못 싣거나</tspan><tspan x="874" dy="21">걸리듯 잠김</tspan></text><text x="1140" y="394" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" fill="#8A5A12" font-weight="500" text-anchor="end"><tspan x="1140" dy="0">영상 검사 가능한 의료기관 먼저</tspan></text><rect x="40" y="430" width="1120" height="180" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="72" y="470" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#FBE78A" font-weight="800" text-anchor="start"><tspan x="72" dy="0">작은 변화도 기록합니다 · 같은 동작으로 다시 확인</tspan></text><rect x="72" y="490" width="335" height="100" rx="16" fill="#2B4566"/><text x="92" y="524" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" fill="#fff" font-weight="700" text-anchor="start"><tspan x="92" dy="0">첫날</tspan></text><text x="92" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" fill="#DCE8F5" font-weight="400" text-anchor="start"><tspan x="92" dy="0">계단을 내려갈 때</tspan><tspan x="92" dy="22">꼭 난간을 잡음</tspan></text><path d="M415,540 l14,0 M423,533 l7,7 l-7,7" fill="none" stroke="#FBE78A" stroke-width="2.5"/><rect x="437" y="490" width="335" height="100" rx="16" fill="#2B4566"/><text x="457" y="524" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" fill="#fff" font-weight="700" text-anchor="start"><tspan x="457" dy="0">다시 왔을 때</tspan></text><text x="457" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" fill="#DCE8F5" font-weight="400" text-anchor="start"><tspan x="457" dy="0">한 층은 난간 없이</tspan><tspan x="457" dy="22">내려옴</tspan></text><path d="M780,540 l14,0 M788,533 l7,7 l-7,7" fill="none" stroke="#FBE78A" stroke-width="2.5"/><rect x="802" y="490" width="335" height="100" rx="16" fill="#2B4566"/><text x="822" y="524" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" fill="#fff" font-weight="700" text-anchor="start"><tspan x="822" dy="0">다음 확인</tspan></text><text x="822" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" fill="#DCE8F5" font-weight="400" text-anchor="start"><tspan x="822" dy="0">"요즘은 몇 층까지</tspan><tspan x="822" dy="22">괜찮으세요?"</tspan></text><text x="1140" y="628" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" fill="#51657F" font-weight="500" text-anchor="end"><tspan x="1140" dy="0">예시는 이해를 돕기 위한 가상 사례입니다</tspan></text><rect x="0" y="637" width="1200" height="38" fill="#1F3552"/><text x="600" y="662" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" fill="#fff" font-weight="500" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 노량진점 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text></svg>