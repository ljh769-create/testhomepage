<text x="94.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" fill="#fff" text-anchor="start"><tspan x="94.0" dy="0">내려갈 때 보폭 줄이고 난간 잡기</tspan></text>
