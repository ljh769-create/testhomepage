<text x="674" y="364" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" fill="#5A3B0A" text-anchor="start"><tspan x="674" dy="0">검진에서 혈당·혈압</tspan><tspan x="674" dy="22">추가 검사를 권유받은 경우</tspan></text>
