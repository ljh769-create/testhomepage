<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">기침을 두 칸으로 나눠 적어 보세요</tspan></text><rect x="90" y="222" width="312" height="214" rx="14" fill="#F4F8FC"/><circle cx="130" cy="258" r="24" fill="#DCE8F5"/><g transform="translate(130 258) scale(0.7)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 0 q5 -10 10 0 t10 0 t10 0 t10 0"/><path d="M-20 10 q5 -10 10 0 t10 0 t10 0 t10 0"/></g><text x="166" y="266" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="166" dy="0">마른기침</tspan></text><text x="112" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="112" dy="0">목이 간질간질하고</tspan><tspan x="112" dy="21">가래 없이 나는 기침</tspan></text><rect x="112" y="352" width="268" height="2" fill="#DCE8F5"/><text x="112" y="382" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="112" dy="0">생길 수 있는 경우</tspan></text><text x="112" y="406" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="112" dy="0">감기 뒤 목·기관지가</tspan><tspan x="112" dy="19">한동안 예민할 때</tspan></text><rect x="416" y="222" width="312" height="214" rx="14" fill="#F4F8FC"/><circle cx="456" cy="258" r="24" fill="#DCE8F5"/><g transform="translate(456 258) scale(0.7)" fill="none" stroke="#3E9C8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -18 C10 -4 14 2 14 8 a14 14 0 0 1 -28 0 c0 -6 4 -12 14 -26 z"/></g><text x="492" y="266" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#3E9C8A" text-anchor="start"><tspan x="492" dy="0">가래 섞인 기침</tspan></text><text x="438" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="438" dy="0">가래가 함께</tspan><tspan x="438" dy="21">나오는 기침</tspan></text><rect x="438" y="352" width="268" height="2" fill="#DCE8F5"/><text x="438" y="382" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="800" fill="#3E9C8A" text-anchor="start"><tspan x="438" dy="0">생길 수 있는 경우</tspan></text><text x="438" y="406" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="438" dy="0">콧물이 목으로 넘어가거나</tspan><tspan x="438" dy="19">분비물이 많을 때</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 기록해 오시면 쉬워요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">시작된 날짜,</tspan><tspan x="110.0" dy="20">심했던 시간대</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">가래의 양과 색을</tspan><tspan x="330.0" dy="20">한 단어로</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">심해지는 상황,</tspan><tspan x="550.0" dy="20">밤에 깬 횟수</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">기침이 3주 넘게</tspan><tspan x="834" dy="21">이어질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">피가 섞인 가래가</tspan><tspan x="834" dy="21">나올 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">숨이 차고 쌕쌕거리거나</tspan><tspan x="834" dy="21">가슴이 아플 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">고열이 며칠째 이어지거나</tspan><tspan x="834" dy="21">체중이 줄 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">복용 중인 약과 흡입기는</tspan><tspan x="816" dy="19">상의 없이 끊지 않아요</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
