#FBE78A"/><text x="110.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">한 번·하루 앉는 시간</tspan></text><circle cx="436.0" cy="580" r="5" fill="#FBE78A"/><text x="450.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="450.0" dy="0">의자 재질·방석</tspan></text><circle cx="776.0" cy="580" r="5" fill="#FBE78A"/><text x="790.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="790.0" dy="0">가장 아픈 순간</tspan></text>
