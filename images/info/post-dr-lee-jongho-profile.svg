 y="428" width="380" height="34" rx="17" fill="#F4F8FC"/><circle cx="112" cy="445" r="5" fill="#38608F"/><text x="126" y="450" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="126" dy="0">동작구 치매예방·실버한방케어 지정</tspan></text><rect x="90" y="470" width="380" height="34" rx="17" fill="#F4F8FC"/><circle cx="112" cy="487" r="5" fill="#38608F"/><text x="126" y="492" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="126" dy="0">동작구 한의약 난임치료 지원사업 지정</tspan></text><rect x="90" y="512" width="380" height="34" rx="17" fill="#F4F8FC"/><circle cx="112" cy="529" r="5" fill="#38608F"/><text x="126" y="534" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="126" dy="0">은로초·중대부중·숭의여중 교의</tspan></text><rect x="90" y="554" width="380" height="34" rx="17" fill="#F4F8FC"/><circle cx="112" cy="571" r="5" fill="#38608F"/><text x="126" y="576" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="126" dy="0">MBN·EBC 건강 프로그램 고정 패널</tspan></text><text x="90" y="610" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="90" dy="0">프로필 카드 기준, 지정 사업은 해마다 달라질 수 있음</tspan></text><rect x="520" y="160" width="250" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">진료 분야로 소개</tspan></text><rect x="546" y="220" width="200" height="40" rx="20" fill="#2C4568"/><text x="646" y="246" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="646" dy="0">뇌기능 재활</tspan></text><rect x="546" y="268" width="200" height="40" rx="20" fill="#2C4568"/><text x="646" y="294" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="646" dy="0">당뇨·대사증후군·다이어트</tspan></text><text x="546" y="346" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">상담은 이렇게</tspan></text><text x="546" y="374" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="546" dy="0">증상·생활·복용 약을</tspan><tspan x="546" dy="20">충분히 듣고, 필요할 때</tspan><tspan x="546" dy="20">진맥·설진·복진,</tspan><tspan x="546" dy="20">체성분 분석으로 살핀 뒤</tspan><tspan x="546" dy="20">침이나 한약 상담 등을</tspan><tspan x="546" dy="20">정합니다</tspan></text><text x="546" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">약재는 매주</tspan><tspan x="546" dy="20">대표원장이 직접 확인</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x=