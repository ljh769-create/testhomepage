<text x="562" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">2주간 먹은 진통제</tspan><tspan x="562" dy="20">횟수 세어 보기</tspan></text>
