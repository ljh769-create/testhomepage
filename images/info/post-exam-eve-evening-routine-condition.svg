" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -12 h36 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 h-20 l-10 8 v-8 h-6 a6 6 0 0 1 -6 -6 v-16 a6 6 0 0 1 6 -6 z"/><path d="M-8 0 h16"/></g><text x="180" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="180" dy="0">마지막 공부</tspan></text><text x="180" y="482" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="180" dy="0">새 내용보다 정리한 노트만 훑어보기</tspan></text><circle cx="130" cy="560" r="30" fill="#DCE8F5" stroke="#fff" stroke-width="4"/><g transform="translate(130 560) scale(0.9)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -16 a16 16 0 1 0 8 26 a13 13 0 1 1 -8 -26 z"/></g><text x="180" y="554" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="180" dy="0">평소 잠드는 시각</tspan></text><text x="180" y="582" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="180" dy="0">잠이 안 와도 눈 감고 쉬기</tspan></text><rect x="780" y="160" width="360" height="230" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="810" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="810" dy="0">이런 날이 많았다면</tspan></text><text x="810" y="236" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="810" dy="0">마지막까지 한 장 더 보려다</tspan><tspan x="810" dy="22">늦게 잠들고 머리가 무거웠다</tspan></text><text x="810" y="312" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" fill="#90B2DD" text-anchor="start"><tspan x="810" dy="0">'꼭 자야 한다'는 압박이</tspan><tspan x="810" dy="22">잠을 더 멀게 하기도 합니다</tspan></text><rect x="780" y="410" width="360" height="220" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="810" cy="444" r="12" fill="#E8A33D"/><text x="810" y="450" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="810" dy="0">!</tspan></text><text x="832" y="451" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="832" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="810" cy="482" r="4.5" fill="#E8A33D"/><text x="824" y="488" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="824" dy="0">며칠째 거의 못 잠</tspan></text><circle cx="810" cy="514" r="4.5" fill="#E8A33D"/><text x="824" y="520" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="824" dy="0">두근거림·숨 가쁨이</tspan><tspan x="824" dy="20">심해 공부가 어려움</tspan></text><circle cx="810" cy="566" r="4.5" fill="#E8A33D"/><text x="824" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="824" dy="0">극단적인 생각 → 109·119</tspan></text>
