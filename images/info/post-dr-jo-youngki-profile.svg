othic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">필요할 때</tspan><tspan x="562" dy="20">초음파로 확인</tspan></text><rect x="546" y="460" width="200" height="68" rx="14" fill="#2C4568"/><text x="562" y="489.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">침·약침·추나·체외</tspan><tspan x="562" dy="20">충격파 중 정하기</tspan></text><rect x="546" y="540" width="200" height="68" rx="14" fill="#2C4568"/><text x="562" y="569.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">같은 동작으로</tspan><tspan x="562" dy="20">달라진 점 기록</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다친 뒤 팔이나 다리에</tspan><tspan x="834" dy="21">힘이 빠질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">배변·배뇨가 갑자기</tspan><tspan x="834" dy="