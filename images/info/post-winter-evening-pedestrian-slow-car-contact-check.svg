dth="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="489" r="21" fill="#DCE8F5"/><g transform="translate(124 489) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -16 a16 16 0 1 0 8 26 a13 13 0 1 1 -8 -26 z"/></g><text x="158" y="495" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">사고 뒤 잠·놀란 느낌</tspan></text><rect x="520" y="160" width="250" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">일상에서 해 볼 것</tspan></text><rect x="546" y="218" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">연락처·차량 번호</tspan><tspan x="562" dy="20">현장 사진 남기기</tspan></text><rect x="546" y="288" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">붓고 뜨거우면 얼음</tspan><tspan x="562" dy="20">감싸서 10~15분</tspan></text><rect x="546" y="358" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">계단은 난간 잡고</tspan><tspan x="562" dy="20">한 칸씩 천천히</tspan></text><rect x="546" y="428" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">저녁 길엔 밝은 옷</tspan><tspan x="562" dy="20">반사띠 하나 챙기기</tspan></text><rect x="546" y="500" width="200" height="104" rx="14" fill="#FFFFFF"/><text x="562" y="526" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="562" dy="0">적어 오시면 좋아요</tspan></text><text x="562" y="550" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="562" dy="0">멍·붓기 날짜별 사진,</tspan><tspan x="562" dy="19">아픈 정도 0~10</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">머리 부딪힌 뒤 두통</tspan><tspan x="834" dy="21">구토·심한 졸음</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">크게 붓고 모양이</tspan><tspan x="834" dy="21">달라 보일 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">체중을 실을 수 없을</tspan><tspan x="834" dy="21">만큼 아플 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">엉덩방아 뒤 다리를</tspan><tspan x="834" dy="21">들기 어려울 때</tspan></text><circle cx="820" cy="454" r="4.5" fill="#E8A33D"/><text x="834" y="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리·팔이 저리고</tspan><tspan x="834" dy="21">힘이 빠질 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">의식이 흐리거나 숨쉬기</tspan><tspan x="816" dy="19">힘들면 바로 가까운 응급실</tspan></text>
