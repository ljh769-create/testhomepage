6.0" dy="0">팔을 머리 위로</tspan><tspan x="326.0" dy="21">올릴 때</tspan></text><rect x="526.0" y="222" width="204.0" height="136" rx="14" fill="#F4F8FC"/><circle cx="560.0" cy="256" r="21" fill="#DCE8F5"/><g transform="translate(560.0 256) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-18" y="-12" width="36" height="28" rx="4"/><path d="M-18 -4 h36 M-6 4 h12"/></g><text x="590.0" y="263" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="590.0" dy="0">선반</tspan></text><text x="544.0" y="308" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="544.0" dy="0">높은 선반에</tspan><tspan x="544.0" dy="21">손을 뻗을 때</tspan></text><rect x="90" y="376" width="640" height="60" rx="12" fill="#DCE8F5"/><text x="112" y="411.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="112" dy="0">기억할 점</tspan></text><text x="220" y="401.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="220" dy="0">어깨는 쓰는 범위가 줄면 그만큼 더 굳기 쉬워</tspan><tspan x="220" dy="20">작은 변화를 일찍 알아차리는 것이 중요해요</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일상에서 먼저 해 볼 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">팔을 머리 위로</tspan><tspan x="110.0" dy="20">천천히 올렸다 내리기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">벽 짚고 가슴 앞쪽</tspan><tspan x="330.0" dy="20">열어 주는 스트레칭</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">가방은 양쪽 번갈아,</tspan><tspan x="550.0" dy="20">아픈 쪽으로 눕지 않기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">팔을 거의 올릴 수 없을 만큼</tspan><tspan x="834" dy="21">갑자기 굳었을 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">가슴 통증·식은땀·숨참이</tspan><tspan x="834" dy="21">함께 있을 때 (즉시 119)</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어지거나 부딪힌 뒤</tspan><tspan x="834" dy="21">어깨에 힘이 빠질 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">통증이 느껴지는 범위를 넘지</tspan><tspan x="816" dy="19">않게 부드럽게 움직이세요</tspan></text>
