" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">변에 피가 섞이거나</tspan><tspan x="834" dy="21">검은 변을 볼 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">소아청소년과 진료가 먼저입니다</tspan><tspan x="816" dy="19">아이 눈높이로 천천히 설명합니다</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
