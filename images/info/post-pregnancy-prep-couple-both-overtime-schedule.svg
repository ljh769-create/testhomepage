<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#C97B84" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">맞벌이 부부, 둘 다 야근이 잦을 때 임신 준비</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">잠과 식사 시각을 조금씩 맞추는 것이 첫걸음입니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#C97B84"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">두 사람의 하루를 조금씩 맞춥니다</tspan></text><text x="90" y="246" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="90" dy="0">남편</tspan></text><text x="90" y="296" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#C97B84" text-anchor="start"><tspan x="90" dy="0">아내</tspan></text><rect x="160" y="228" width="560" height="28" rx="14" fill="#DCE8F5"/><rect x="520" y="228" width="200" height="28" rx="14" fill="#38608F" opacity="0.8"/><rect x="160" y="278" width="560" height="28" rx="14" fill="#DCE8F5"/><rect x="580" y="278" width="140" height="28" rx="14" fill="#C97B84" opacity="0.8"/><text x="440" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="440" dy="0">예시 · 색칠한 곳은 퇴근 뒤 늦은 시간</tspan></text><rect x="90" y="356" width="204" height="84" rx="14" fill="#FBE78A"/><text x="192" y="390" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="192" dy="0">주 2~3번은 같은 시각에</tspan><tspan x="192" dy="20">잠자리에 들기</tspan></text><rect x="306" y="356" width="204" height="84" rx="14" fill="#F4F8FC"/><text x="408" y="390" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="408" dy="0">야근해도 저녁은</tspan><tspan x="408" dy="20">밤 9시 전에 간단히</tspan></text><rect x="522" y="356" width="204" height="84" rx="14" fill="#F4F8FC"/><text x="624" y="390" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="624" dy="0">주말 기상 시각은</tspan><tspan x="624" dy="20">평일과 비슷하게</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">함께 적어 오세요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">두 사람의 퇴근·</tspan><tspan x="110.0" dy="20">잠·기상 시각</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">최근 3~6개월</tspan><tspan x="330.0" dy="20">월경 시작일</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">음주·흡연·</tspan><tspan x="550.0" dy="20">카페인 습관</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">1년 넘게 시도했는데 검사 전</tspan><tspan x="834" dy="21">(35세 이상은 6개월)</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">월경이 석 달 넘게 없거나</tspan><tspan x="834" dy="21">출혈이 지나치게 많을 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">심한 아랫배 통증</tspan><tspan x="834" dy="21">또는 열</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">산부인과·비뇨의학과 검사가 먼저</tspan><tspan x="816" dy="19">급한 통증·출혈은 119·응급실</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>