 KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="436" dy="0">새 가구 냄새는</tspan><tspan x="436" dy="20">자기 전 충분히 환기</tspan></text><circle cx="420" cy="383" r="5" fill="#38608F"/><text x="436" y="388" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="436" dy="0">늦게 잔 날도</tspan><tspan x="436" dy="20">일어나는 시각은 그대로</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 적어 오세요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">이사 날짜와</tspan><tspan x="110.0" dy="20">잠이 달라진 날</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">잠드는 데 걸린 시간·</tspan><tspan x="330.0" dy="20">깬 횟수</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">거슬리는 소리·</tspan><tspan x="550.0" dy="20">빛·냄새</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-