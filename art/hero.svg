<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="구름 위에서 잠든 달 캐릭터와 별, 잔잔한 물결">
<style>
.moon{animation:bob 6s ease-in-out infinite}
.star{animation:tw 3.4s ease-in-out infinite}.s2{animation-delay:1.1s}.s3{animation-delay:2.2s}
.wv{animation:drift 10s ease-in-out infinite alternate}.w2{animation-duration:13s}
.zz{animation:zz 4s ease-in-out infinite}.z2{animation-delay:1.3s}.z3{animation-delay:2.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}40%{opacity:1}100%{opacity:0;transform:translate(14px,-22px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE0F3"/><stop offset="1" stop-color="#EEF4FB"/></linearGradient>
<linearGradient id="w1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90B2DD"/><stop offset="1" stop-color="#6A94CB"/></linearGradient>
<linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4672AD"/><stop offset="1" stop-color="#2B4A72"/></linearGradient>
<radialGradient id="mg" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFF6C4"/><stop offset="1" stop-color="#FBE78A"/></radialGradient>
<clipPath id="cp"><rect width="640" height="560" rx="52"/></clipPath></defs><g clip-path="url(#cp)">
<rect width="640" height="560" rx="52" fill="url(#sky)"/>
<g fill="#FFFFFF" opacity=".95"><ellipse cx="150" cy="170" rx="58" ry="22"/><ellipse cx="190" cy="156" rx="36" ry="20"/><ellipse cx="490" cy="130" rx="52" ry="19"/><ellipse cx="522" cy="118" rx="30" ry="17"/></g>
<g fill="#FBE78A"><path class="star" d="M110 90l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/><path class="star s2" d="M540 220l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path class="star s3" d="M78 300l3.6 9 9 3.6-9 3.6-3.6 9-3.6-9-9-3.6 9-3.6z"/><path class="star s2" d="M470 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></g>
<g class="moon">
<ellipse cx="318" cy="378" rx="168" ry="44" fill="#FFFFFF"/><ellipse cx="238" cy="366" rx="70" ry="38" fill="#FFFFFF"/><ellipse cx="402" cy="364" rx="76" ry="40" fill="#FFFFFF"/>
<circle cx="318" cy="250" r="128" fill="url(#mg)" stroke="#E5C23E" stroke-width="5"/>
<circle cx="372" cy="196" r="14" fill="#F4D764" opacity=".55"/><circle cx="262" cy="300" r="10" fill="#F4D764" opacity=".5"/><circle cx="392" cy="290" r="8" fill="#F4D764" opacity=".5"/>
<path d="M246 232q22 22 44 0M346 232q22 22 44 0" stroke="#1F3552" stroke-width="8" fill="none" stroke-linecap="round"/>
<path d="M290 282q28 26 56 0" stroke="#1F3552" stroke-width="8" fill="none" stroke-linecap="round"/>
<ellipse cx="238" cy="266" rx="20" ry="12" fill="#F5B8A0" opacity=".7"/><ellipse cx="398" cy="266" rx="20" ry="12" fill="#F5B8A0" opacity=".7"/>
<path d="M218 150C250 74 366 52 438 124c-44-14-96-4-134 28-30 4-60 0-86-2z" fill="#4672AD"/><path d="M218 150c26 4 56 8 86 2 38-32 90-42 134-28" stroke="#2B4A72" stroke-width="4" fill="none"/><circle cx="444" cy="122" r="19" fill="#FFFFFF"/>
</g>
<g fill="none" stroke="#1F3552" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path class="zz" d="M470 210h26l-26 30h26"/><path class="zz z2" d="M510 160h20l-20 24h20" opacity=".8"/><path class="zz z3" d="M540 118h14l-14 18h14" opacity=".6"/></g>
<g class="wv w2"><path d="M-30 470c80-34 160-34 240 0s160 34 240 0 160-34 240 0V560H-30z" fill="url(#w1)"/></g>
<g class="wv"><path d="M-30 508c80-30 160-30 240 0s160 30 240 0 160-30 240 0V560H-30z" fill="url(#w2)"/></g>
</g></svg>
