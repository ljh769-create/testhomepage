<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">손님과 손님 사이, 시술 단계 사이에 잠깐씩</tspan></text><rect x="90" y="222" width="148" height="150" rx="16" fill="#DCE8F5"/><circle cx="118" cy="248" r="15" fill="#3E8E9E"/><text x="118" y="254" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="118" dy="0">1</tspan></text><g transform="translate(164 290) scale(1.0)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-14" r="6"/><path d="M0 -8 v16 M-12 -2 l12 -2 l12 2 M0 8 l-8 14 M0 8 l8 14"/></g><text x="164" y="338" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="164" dy="0">어깨 으쓱</tspan></text><text x="164" y="360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="164" dy="0">귀 쪽으로 올렸다가</tspan></text><rect x="252" y="222" width="148" height="150" rx="16" fill="#DCE8F5"/><circle cx="280" cy="248" r="15" fill="#3E8E9E"/><text x="280" y="254" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="280" dy="0">2</tspan></text><g transform="translate(326 290) scale(1.0)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-14" r="6"/><path d="M0 -8 v16 M-12 -2 l12 -2 l12 2 M0 8 l-8 14 M0 8 l8 14"/></g><text x="326" y="338" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="326" dy="0">툭 떨어뜨리기</tspan></text><text x="326" y="360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="326" dy="0">숨을 길게 내쉬며</tspan></text><rect x="414" y="222" width="148" height="150" rx="16" fill="#DCE8F5"/><circle cx="442" cy="248" r="15" fill="#3E8E9E"/><text x="442" y="254" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="442" dy="0">3</tspan></text><g transform="translate(488 290) scale(1.0)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-14" r="6"/><path d="M0 -8 v16 M-12 -2 l12 -2 l12 2 M0 8 l-8 14 M0 8 l8 14"/></g><text x="488" y="338" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="488" dy="0">팔 내리기</tspan></text><text x="488" y="360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="488" dy="0">드라이 중간에 한 번</tspan></text><rect x="576" y="222" width="148" height="150" rx="16" fill="#DCE8F5"/><circle cx="604" cy="248" r="15" fill="#3E8E9E"/><text x="604" y="254" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="604" dy="0">4</tspan></text><g transform="translate(650 290) scale(1.0)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-14" r="6"/><path d="M0 -8 v16 M-12 -2 l12 -2 l12 2 M0 8 l-8 14 M0 8 l8 14"/></g><text x="650" y="338" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="650" dy="0">반대쪽 돌리기</tspan></text><text x="650" y="360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="650" dy="0">안 쓴 어깨도 천천히</tspan></text><text x="410" y="410" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#38608F" text-anchor="middle"><tspan x="410" dy="0">시술 의자 높이를 손님마다 조절해</tspan><tspan x="410" dy="22">팔꿈치가 어깨보다 너무 높이 올라가지 않게</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 적어 오세요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">하루 손님 수와</tspan><tspan x="110.0" dy="20">가장 바쁜 시간대</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">뻐근함이 시작되는</tspan><tspan x="330.0" dy="20">시점과 동작</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">저리다면</tspan><tspan x="550.0" dy="20">어느 손가락인지</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">팔 힘이 갑자기 빠지거나</tspan><tspan x="834" dy="21">저림이 점점 심해질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">어깨·팔로 뻗치는 가슴 통증,</tspan><tspan x="834" dy="21">식은땀, 숨참</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">어깨를 전혀 들 수 없을 만큼</tspan><tspan x="834" dy="21">갑자기 아플 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">가슴 통증이면 망설이지 말고 119</tspan><tspan x="816" dy="19">복용 약은 임의로 끊지 않기</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
