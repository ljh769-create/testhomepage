roke="#fff" stroke-width="4"/><g transform="translate(650 270) scale(0.85)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 2 L0 -16 L18 2"/><path d="M-12 -4 v20 h24 v-20"/><path d="M-4 16 v-10 h8 v10"/></g><text x="650" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="650" dy="0">추워서 다시 덮음</tspan></text><text x="410" y="364" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#38608F" text-anchor="middle"><tspan x="410" dy="0">땀이 나는 시각과 깨는 횟수를 일주일 적어 오시면 좋습니다</tspan></text><rect x="60" y="398" width="700" height="232" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="436" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">침실과 저녁 준비</tspan></text><path d="M92 470 l6 6 l10 -12" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round"/><text x="120" y="476" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="120" dy="0">얇은 이불을 여러 겹으로</tspan></text><path d="M422 470 l6 6 l10 -12" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round"/><text x="450" y="476" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="450" dy="0">땀을 잘 흡수하는 면 잠옷</tspan></text><path d="M92 514 l6 6 l10 -12" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round"/><text x="120" y="520" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="120" dy="0">침실은 조금 서늘하게</tspan></text><path d="M422 514 l6 6 l