ic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="430" dy="0">갈라짐</tspan></text><text x="430" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="430" dy="0">가운데·가장자리</tspan></text><text x="170" y="330" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#38608F" text-anchor="end"><tspan x="170" dy="0">이 자국</tspan></text><text x="170" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#4A5D75" text-anchor="end"><tspan x="170" dy="0">가장자리 자국</tspan></text><text x="430" y="410" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="430" dy="0">촉촉함</tspan></text><text x="430" y="432" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="430" dy="0">촉촉·건조</tspan></text><text x="170" y="410" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#38608F" text-anchor="end"><tspan x="170" dy="0">크기·모양</tspan></text><text x="170" y="432" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#4A5D75" text-anchor="end"><tspan x="170" dy="0">부은지·마른지</tspan></text><text x="340" y="540" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#38608F" text-anchor="middle"><tspan x="340" dy="0">혀 아래 핏줄의 색과 굵기도 봅니다</tspan></text><rect x="640" y="160" width="500" height="190" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="668" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="668" dy="0">알아 두면 좋은 한계</tspan></text><text x="668" y="234" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="668" dy="0">혀는 하루 중에도 변합니다</tspan><tspan x="668" dy="26">커피·카레·약·흡연으로 색이 달라져요</tspan><tspan x="668" dy="26">혀 하나로 병을 단정하지 않고</tspan><tspan x="668" dy="26">진맥·복진 등과 함께 참고합니다</tspan></text><rect x="640" y="365" width="500" height="212" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="670" cy="399" r="12" fill="#E8A33D"/><text x="670" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="670" dy="0">!</tspan></text><text x="692" y="406" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="692" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="670" cy="437" r="4.5" fill="#E8A33D"/><text x="684" y="443" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="684" dy="0">낫지 않는 궤양·덩어리가</tspan><tspan x="684" dy="20">2주 넘게 있을 때</tspan></text><circle cx="670" cy="489" r="4.5" fill="#E8A33D"/><text x="684" y="495" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="684" dy="0">갑자기 하얗게 변하고 아플 때</tspan></text><circle cx="670" cy="521" r="4.5" fill="#E8A33D"/><text x="684" y="527" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="684" dy="0">삼키기 어렵거나 말이 어눌할 때</tspan><tspan x="684" dy="20">(말이 어눌하면 바로 119)</tspan></text>
