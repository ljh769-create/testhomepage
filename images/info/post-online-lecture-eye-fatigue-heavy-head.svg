nt-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="112" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="90" cy="582" r="4.5" fill="#E8A33D"/><text x="104" y="588" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="104" dy="0">시야가 갑자기 흐려지거나 겹쳐 보임 · 눈이 빨갛고 통증이 심함 · 처음 겪는 심한 두통 → 바로 확인</tspan></text>
