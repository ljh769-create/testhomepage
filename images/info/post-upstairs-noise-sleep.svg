span x="506" dy="0">먼저 해 볼 수 있는 것</tspan></text><rect x="502" y="222" width="236" height="50" rx="10" fill="#F4F8FC"/><circle cx="520" cy="247" r="5" fill="#38608F"/><text x="534" y="253" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="534" dy="0">귀마개·잔잔한 백색소음</tspan></text><rect x="502" y="280" width="236" height="50" rx="10" fill="#F4F8FC"/><circle cx="520" cy="305" r="5" fill="#38608F"/><text x="534" y="301" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="534" dy="0">침대를 소리가 덜한</tspan><tspan x="534" dy="19">벽 쪽으로</tspan></text><rect x="502" y="338" width="236" height="50" rx="10" fill="#F4F8FC"/><circle cx="520" cy="363" r="5" fill="#38608F"/><text x="534" y="359" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="534" dy="0">잠들기 전 할 일 하나</tspan><tspan x="534" dy="19">(호흡·가벼운 독서)</tspan></text><rect x="502" y="396" width="236" height="50" rx="10" fill="#F4F8FC"/><circle cx="520" cy="421" r="5" fill="#38608F"/><text x="534" y="427" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3552" text-anchor="start"><tspan x="534" dy="0">가벼운 스트레칭</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일주일만 적어 보세요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">소리가 난 시각과</tspan><tspan x="110.0" dy="20">깬 시각</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">다시 잠들기까지</tspan><tspan x="330.0" dy="20">걸린 시간</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">소음 문제는 관리사무소·</tspan><tspan x="550.0" dy="20">공공 상담 창구와 상의</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">위험한 다툼이 생길 것 같으면</tspan><tspan x="834" dy="21">관리·상담 기관에 도움 요청</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">귀에서 소리가 계속 나거나</tspan><tspan x="834" dy="21">한쪽 청력이 갑자기 떨어질 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">가슴 두근거림과</tspan><tspan x="834" dy="21">호흡 불편이 함께 있을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">갑자기 한쪽 귀가 잘 안 들리면</tspan><tspan x="816" dy="19">빨리 이비인후과를 찾으세요</tspan></text>
