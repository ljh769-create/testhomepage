<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">자기 전 휴대폰, 현실적으로 줄이기</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">완전히 끊기보다 15분씩, 침대에서 멀리</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="320" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">자기 전 화면, 이렇게 줄여요</tspan></text><rect x="90.0" y="222" width="201.33333333333334" height="116" rx="14" fill="#F4F8FC"/><circle cx="116.0" cy="250" r="15" fill="#38608F"/><text x="116.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="116.0" dy="0">1</tspan></text><text x="138.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="138.0" dy="0">15분 먼저 끄기</tspan></text><text x="108.0" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="108.0" dy="0">일주일마다</tspan><tspan x="108.0" dy="19">15분씩 늘리기</tspan></text><path d="M295.33333333333337 273.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="309.33333333333337" y="222" width="201.33333333333334" height="116" rx="14" fill="#F4F8FC"/><circle cx="335.33333333333337" cy="250" r="15" fill="#38608F"/><text x="335.33333333333337" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="335.33333333333337" dy="0">2</tspan></text><text x="357.33333333333337" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="357.33333333333337" dy="0">밝기 낮추기</tspan></text><text x="327.33333333333337" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="327.33333333333337" dy="0">꼭 봐야 하면</tspan><tspan x="327.33333333333337" dy="19">야간 모드</tspan></text><path d="M514.6666666666667 273.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="528.6666666666667" y="222" width="201.33333333333334" height="116" rx="14" fill="#F4F8FC"/><circle cx="554.6666666666667" cy="250" r="15" fill="#38608F"/><text x="554.6666666666667" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="554.6666666666667" dy="0">3</tspan></text><text x="576.6666666666667" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="576.6666666666667" dy="0">멀리 두기</tspan></text><text x="546.6666666666667" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="546.6666666666667" dy="0">알림은 무음,</tspan><tspan x="546.6666666666667" dy="19">손 닿지 않는 곳</tspan></text><circle cx="96" cy="373" r="5" fill="#38608F"/><text x="110" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">화면 대신 종이책·잔잔한 음악·스트레칭</tspan></text><circle cx="96" cy="403" r="5" fill="#38608F"/><text x="110" y="408" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">알람은 별도 시계로 맞추기</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">적어 오시면 좋아요</tspan></text><circle cx="96.0" cy="566" r="5" fill="#FBE78A"/><text x="110.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">화면 본 시간과</tspan><tspan x="110.0" dy="20">본 내용</tspan></text><circle cx="316.0" cy="566" r="5" fill="#FBE78A"/><text x="330.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">화면 끈 시각과</tspan><tspan x="330.0" dy="20">실제 잠든 시각</tspan></text><circle cx="536.0" cy="566" r="5" fill="#FBE78A"/><text x="550.0" y="572" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">밤중에 깬 횟수,</tspan><tspan x="550.0" dy="20">아침 눈·목 상태</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">휴대폰을 놓지 못해</tspan><tspan x="834" dy="21">일상과 일이 무너질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">낮에 참을 수 없이</tspan><tspan x="834" dy="21">졸릴 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">우울감이 깊거나</tspan><tspan x="834" dy="21">극단적인 생각이 들 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">마음이 위급할 때는</tspan><tspan x="816" dy="19">109(24시간)나 119로</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
