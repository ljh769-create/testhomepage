<text x="562" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">재검 48시간 전엔</tspan><tspan x="562" dy="20">격한 운동 쉬기</tspan></text>
