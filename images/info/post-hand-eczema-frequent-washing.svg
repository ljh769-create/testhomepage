<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#D97F78" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">손을 자주 씻는 일, 손가락 사이가 갈라질 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">일을 쉬기 어렵다면 장갑과 보습으로 자극부터 줄입니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#D97F78"/>
<rect x="60" y="160" width="330" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="225" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="225" dy="0">갈라지기 쉬운 곳</tspan></text><path d="M170 420 v-110 q0 -10 10 -10 q10 0 10 10 v-60 q0 -10 10 -10 q10 0 10 10 v50 v-62 q0 -10 10 -10 q10 0 10 10 v62 v-50 q0 -10 10 -10 q10 0 10 10 v70 v-30 q0 -10 10 -10 q10 0 10 10 v70 q0 50 -40 60 h-40 q-20 0 -20 -20 z" fill="#F7DCCB" stroke="#C99A82" stroke-width="3"/><circle cx="200" cy="300" r="7" fill="#D97F78" opacity="0.75"/><circle cx="220" cy="300" r="7" fill="#D97F78" opacity="0.75"/><circle cx="240" cy="300" r="7" fill="#D97F78" opacity="0.75"/><text x="225" y="448" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#D97F78" text-anchor="middle"><tspan x="225" dy="0">손가락 사이에 물기가 남기 쉬워요</tspan></text><rect x="410" y="160" width="350" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="585" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="585" dy="0">물·세제 일을 할 때</tspan></text><rect x="436" y="220" width="300" height="64" rx="14" fill="#DCE8F5"/><text x="586" y="260" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#38608F" text-anchor="middle"><tspan x="586" dy="0">면장갑 위에 고무장갑</tspan></text><circle cx="446" cy="313" r="5" fill="#38608F"/><text x="462" y="318" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="462" dy="0">씻은 뒤 손가락 사이까지 닦고 바로 크림</tspan></text><circle cx="446" cy="353" r="5" fill="#38608F"/><text x="462" y="358" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="462" dy="0">자기 전 보습제 두껍게 + 면장갑</tspan></text><circle cx="446" cy="393" r="5" fill="#38608F"/><text x="462" y="398" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="462" dy="0">순한 세정제, 장갑 속 땀은 자주 말리기</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 기록해 오세요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">하루 손 씻는 횟수와</tspan><tspan x="110.0" dy="20">물에 닿는 일</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">쓰는 세제·소독제</tspan><tspan x="330.0" dy="20">이름</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">일하는 날·쉬는 날</tspan><tspan x="550.0" dy="20">손 사진</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갈라진 곳에서 고름이 나오거나</tspan><tspan x="834" dy="21">붓고 열이 날 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">작은 물집이 무리 지어 생기며</tspan><tspan x="834" dy="21">통증이 심할 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손톱 모양이 변하거나</tspan><tspan x="834" dy="21">손톱 주변이 부을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">바르는 연고는 임의로 끊지 않기</tspan><tspan x="816" dy="19">사진 기록을 함께 보면 좋아요</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>