 r="34" fill="#DCE8F5"/><text x="490" y="274" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="490" dy="0">귀가</tspan></text><path d="M530 268 L618 268" stroke="#90B2DD" stroke-width="3" stroke-dasharray="6 6" fill="none"/><circle cx="618" cy="268" r="5" fill="#90B2DD"/><text x="490" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="490" dy="0">따뜻한 샤워</tspan></text><text x="490" y="360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="490" dy="0">가벼운 스트레칭</tspan></text><circle cx="660" cy="268" r="34" fill="#FBE78A"/><text x="660" y="274" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="660" dy="0">잠들기 전</tspan></text><text x="660" y="334" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="660" dy="0">조명 낮추기</tspan></text><text x="660" y="360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="660" dy="0">매출 앱 열지 않기</tspan></text><rect x="90" y="392" width="640" height="52" rx="12" fill="#F4F8FC"/><text x="410" y="424" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#38608F" text-anchor="middle"><tspan x="410" dy="0">쉬는 날에도 일어나는 시각은 크게 바꾸지 않기</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fo