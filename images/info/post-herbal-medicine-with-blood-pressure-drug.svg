<circle cx="1120" cy="70" r="120" fill="#5BA68A" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">혈압약·당뇨약과 한약을 함께 먹어도 될까요</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">약을 정확히 알려 주시는 것이 가장 중요합니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#5BA68A"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">양약과 한약, 시간이 겹치지 않게 함께 정합니다</tspan></text><path d="M110 300 H720" stroke="#90B2DD" stroke-width="4"/><rect x="100" y="250" width="190" height="120" rx="14" fill="#DCE8F5"/><circle cx="195" cy="282" r="22" fill="#FFFFFF"/><g transform="translate(195 284) scale(0.75)" fill="none" stroke="#5BA68A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 12 L8 -10 L14 -4 L-8 18 L-16 20 Z"/><path d="M4 -6 L10 0"/></g><text x="195" y="330" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="195" dy="0">약 확인</tspan></text><text x="195" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="195" dy="0">이름·용량·복용 시간</tspan><tspan x="195" dy="17">약 봉투 사진으로</tspan></text><path d="M292 310 L313 310" stroke="#90B2DD" stroke-width="3" stroke-dasharray="6 6" fill="none"/><circle cx="313" cy="310" r="5" fill="#90B2DD"/><rect x="315" y="250" width="190" height="120" rx="14" fill="#DCE8F5"/><circle cx="410" cy="282" r="22" fill="#FFFFFF"/><g transform="translate(410 284) scale(0.75)" fill="none" stroke="#5BA68A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-22 2 h10 l5 -12 l8 22 l6 -14 l4 4 h11"/></g><text x="410" y="330" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="410" dy="0">수치 확인</tspan></text><text x="410" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="410" dy="0">최근 혈압·혈당</tspan><tspan x="410" dy="17">집에서 잰 기록</tspan></text><path d="M507 310 L528 310" stroke="#90B2DD" stroke-width="3" stroke-dasharray="6 6" fill="none"/><circle cx="528" cy="310" r="5" fill="#90B2DD"/><rect x="530" y="250" width="190" height="120" rx="14" fill="#DCE8F5"/><circle cx="625" cy="282" r="22" fill="#FFFFFF"/><g transform="translate(625 284) scale(0.75)" fill="none" stroke="#5BA68A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-18" y="-12" width="36" height="28" rx="6"/><path d="M-8 -2 a8 8 0 0 1 16 0"/><path d="M0 -2 l4 -5"/></g><text x="625" y="330" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="625" dy="0">함께 정하기</tspan></text><text x="625" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="625" dy="0">한약 처방과</tspan><tspan x="625" dy="17">복용 간격</tspan></text><text x="410" y="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13.5" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="410" dy="0">드시는 약과 수치를 알아야 처방을 정할 수 있습니다</tspan></text><text x="410" y="432" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="middle"><tspan x="410" dy="0">양약은 처방한 의사와 상의 없이 끊거나 줄이지 않습니다</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 챙겨 오세요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">약 봉투·처방전</tspan><tspan x="110.0" dy="20">사진</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">최근 2주 혈압·혈당</tspan><tspan x="330.0" dy="20">집에서 잰 기록</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">영양제·</tspan><tspan x="550.0" dy="20">건강기능식품</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">어지럼·식은땀·손떨림 같은</tspan><tspan x="834" dy="21">저혈당 증상</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">혈압이 평소보다 크게</tspan><tspan x="834" dy="21">오르거나 떨어질 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">가슴 통증이나</tspan><tspan x="834" dy="21">숨 가쁨 (119·응급실)</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">정기 검진은 그대로 받으세요</tspan><tspan x="816" dy="19">임신·수유·알레르기도 꼭 알려 주세요</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
