<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">식탁에서 이 순서로 해 보세요</tspan></text><rect x="90.0" y="222" width="146.5" height="140" rx="14" fill="#F4F8FC"/><circle cx="116.0" cy="250" r="15" fill="#38608F"/><text x="116.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="116.0" dy="0">1</tspan></text><text x="138.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="138.0" dy="0">앉기 전</tspan></text><text x="108.0" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="108.0" dy="0">먹고 싶은 음식</tspan><tspan x="108.0" dy="19">한두 가지와</tspan><tspan x="108.0" dy="19">술 양 정하기</tspan></text><path d="M240.5 285.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="254.5" y="222" width="146.5" height="140" rx="14" fill="#F4F8FC"/><circle cx="280.5" cy="250" r="15" fill="#38608F"/><text x="280.5" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="280.5" dy="0">2</tspan></text><text x="302.5" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="302.5" dy="0">먼저 먹기</tspan></text><text x="272.5" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="272.5" dy="0">나물과</tspan><tspan x="272.5" dy="19">국 건더기부터</tspan></text><path d="M405.0 285.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="419.0" y="222" width="146.5" height="140" rx="14" fill="#F4F8FC"/><circle cx="445.0" cy="250" r="15" fill="#38608F"/><text x="445.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="445.0" dy="0">3</tspan></text><text x="467.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="467.0" dy="0">덜어 먹기</tspan></text><text x="437.0" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="437.0" dy="0">전·튀김은 한 접시,</tspan><tspan x="437.0" dy="19">술은 물과 함께</tspan></text><path d="M569.5 285.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="583.5" y="222" width="146.5" height="140" rx="14" fill="#F4F8FC"/><circle cx="609.5" cy="250" r="15" fill="#38608F"/><text x="609.5" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="609.5" dy="0">4</tspan></text><text x="631.5" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="631.5" dy="0">천천히</tspan></text><text x="601.5" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="601.5" dy="0">한 입마다 수저 놓고</tspan><tspan x="601.5" dy="19">80%쯤 차면 쉬기</tspan></text><rect x="90" y="380" width="640" height="60" rx="12" fill="#DCE8F5"/><text x="114" y="415" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="114" dy="0">다음 날</tspan></text><text x="196" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="196" dy="0">굶지 말고 평소처럼 세 끼, 한 끼는</tspan><tspan x="196" dy="20">채소와 단백질로 가볍게</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 기록해 오시면 쉬워요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">명절 동안 먹은</tspan><tspan x="110.0" dy="20">음식과 술의 양</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">불편이 시작된 날과</tspan><tspan x="330.0" dy="20">이어진 기간</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">복용 중인 혈압·</tspan><tspan x="550.0" dy="20">혈당·지질 약</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">명절 뒤에도 심한 복통, 구토,</tspan><tspan x="834" dy="21">설사가 이어질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">식사 뒤 가슴이 심하게 아프거나</tspan><tspan x="834" dy="21">숨이 찰 때 (즉시 가까운 응급실)</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">혈당·혈압 약을 드시는데</tspan><tspan x="834" dy="21">수치가 크게 흔들릴 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">복용 중인 약은 명절에도</tspan><tspan x="816" dy="19">처방대로 드세요</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
