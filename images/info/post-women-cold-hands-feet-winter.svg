<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#E58FA0" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">겨울에 손발이 유난히 찰 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">날씨와 함께 잠·식사·활동·생리 주기를 살핍니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#E58FA0"/>
<rect x="60" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="230" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="230" dy="0">세 곳을 덮어 주세요</tspan></text><circle cx="230" cy="250" r="20" fill="#DCE8F5" stroke="#38608F" stroke-width="3"/><path d="M230 270 v90 M196 300 l34 -10 l34 10 M230 360 l-22 56 M230 360 l22 56" stroke="#38608F" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="230" cy="274" r="11" fill="#E8A33D" opacity="0.85"/><text x="300" y="279" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#8A5A12" text-anchor="middle"><tspan x="300" dy="0">목</tspan></text><circle cx="196" cy="300" r="11" fill="#E8A33D" opacity="0.85"/><text x="120" y="305" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#8A5A12" text-anchor="middle"><tspan x="120" dy="0">손목</tspan></text><circle cx="212" cy="406" r="11" fill="#E8A33D" opacity="0.85"/><text x="130" y="411" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#8A5A12" text-anchor="middle"><tspan x="130" dy="0">발목</tspan></text><rect x="420" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="446" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="446" dy="0">왜 손발이 차게 느껴질까요</tspan></text><circle cx="456" cy="233" r="5" fill="#38608F"/><text x="472" y="238" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="472" dy="0">추우면 손발 쪽 혈관이</tspan><tspan x="472" dy="20">좁아지는 반응</tspan></text><circle cx="456" cy="285" r="5" fill="#38608F"/><text x="472" y="290" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="472" dy="0">식사량이 적거나</tspan><tspan x="472" dy="20">끼니를 거를 때</tspan></text><circle cx="456" cy="337" r="5" fill="#38608F"/><text x="472" y="342" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="472" dy="0">오래 앉아 있고</tspan><tspan x="472" dy="20">활동이 적을 때</tspan></text><circle cx="456" cy="389" r="5" fill="#38608F"/><text x="472" y="394" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="472" dy="0">빈혈·갑상선 확인이</tspan><tspan x="472" dy="20">필요한 경우도</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">일상에서 먼저 해 볼 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">자기 30분 전, 미지근한</tspan><tspan x="110.0" dy="20">물에 발 10분쯤</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">한 시간에 한 번</tspan><tspan x="330.0" dy="20">발목 돌리고 걷기</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">아침 거르지 않고</tspan><tspan x="550.0" dy="20">데운 음식 챙기기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손가락·발가락이 하얗게,</tspan><tspan x="834" dy="21">파랗게 변하며 아플 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">한쪽 손발만 차갑고</tspan><tspan x="834" dy="21">저리거나 힘이 빠질 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">숨참, 어지럼, 이유 없는</tspan><tspan x="834" dy="21">체중 감소가 함께 있을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">색이 변한 모습은 사진으로</tspan><tspan x="816" dy="19">한쪽 힘 빠짐·말 어눌함은 119</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>