<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">택시 운전 뒤 허리가 바로 안 펴질 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">오래 앉은 자세와 진동이 허리·골반을 굳게 할 수 있습니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="330" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">운전 중·내릴 때, 이 순서로 챙겨 보세요</tspan></text><circle cx="110" cy="250" r="17" fill="#1F3552"/><text x="110" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="110" dy="0">1</tspan></text><text x="142" y="248" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="142" dy="0">신호 대기 때</tspan></text><text x="142" y="270" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="142" dy="0">엉덩이를 좌석 깊숙이, 등은 등받이에</tspan></text><circle cx="110" cy="312" r="17" fill="#1F3552"/><text x="110" y="318" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="110" dy="0">2</tspan></text><text x="142" y="310" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="142" dy="0">1~2시간마다</tspan></text><text x="142" y="332" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="142" dy="0">차에서 내려 허리를 천천히 젖히고 걷기</tspan></text><circle cx="110" cy="374" r="17" fill="#1F3552"/><text x="110" y="380" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="110" dy="0">3</tspan></text><text x="142" y="372" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="142" dy="0">내릴 때</tspan></text><text x="142" y="394" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="142" dy="0">두 다리를 먼저 밖으로, 그다음 일어서기</tspan></text><circle cx="110" cy="436" r="17" fill="#1F3552"/><text x="110" y="442" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="110" dy="0">4</tspan></text><text x="142" y="434" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="142" dy="0">앉기 전에</tspan></text><text x="142" y="456" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="142" dy="0">뒷주머니 지갑·휴대폰은 빼 두기</tspan></text><rect x="790" y="160" width="350" height="330" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="232" r="4.5" fill="#E8A33D"/><text x="834" y="238" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리 힘이 빠지거나</tspan><tspan x="834" dy="20">감각이 둔해질 때</tspan></text><circle cx="820" cy="284" r="4.5" fill="#E8A33D"/><text x="834" y="290" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">대소변 조절이 어려우면</tspan><tspan x="834" dy="20">바로 응급실</tspan></text><circle cx="820" cy="336" r="4.5" fill="#E8A33D"/><text x="834" y="342" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">열이 나거나 밤에 누워도</tspan><tspan x="834" dy="20">점점 심해질 때</tspan></text><rect x="60" y="510" width="1080" height="120" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="546" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 기록해 오시면 상담이 쉬워집니다</tspan></text><circle cx="96.0" cy="580" r="5" fill="#FBE78A"/><text x="110.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">하루 운전·쉬는 간격</tspan></text><circle cx="436.0" cy="580" r="5" fill="#FBE78A"/><text x="450.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="450.0" dy="0">가장 뻣뻣한 때</tspan></text><circle cx="776.0" cy="580" r="5" fill="#FBE78A"/><text x="790.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="790.0" dy="0">다리 저림 여부·쪽</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
