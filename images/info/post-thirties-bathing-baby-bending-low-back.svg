<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">아이 씻기고 안을 때 허리가 아프면</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">무릎을 쓰는 자세로 높이와 순서를 바꿔 봅니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">아이를 들 때, 이 순서로 바꿔 보세요</tspan></text><rect x="90.0" y="222" width="146.5" height="130" rx="14" fill="#F4F8FC"/><circle cx="116.0" cy="250" r="15" fill="#38608F"/><text x="116.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="116.0" dy="0">1</tspan></text><text x="138.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="138.0" dy="0">앉아서</tspan></text><text x="108.0" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="108.0" dy="0">허리 펴고 무릎</tspan><tspan x="108.0" dy="19">굽혀 높이 맞추기</tspan></text><path d="M240.5 280.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="254.5" y="222" width="146.5" height="130" rx="14" fill="#F4F8FC"/><circle cx="280.5" cy="250" r="15" fill="#38608F"/><text x="280.5" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="280.5" dy="0">2</tspan></text><text x="302.5" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="302.5" dy="0">당기기</tspan></text><text x="272.5" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="272.5" dy="0">들기 전 아이를</tspan><tspan x="272.5" dy="19">몸 쪽으로</tspan></text><path d="M405.0 280.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="419.0" y="222" width="146.5" height="130" rx="14" fill="#F4F8FC"/><circle cx="445.0" cy="250" r="15" fill="#38608F"/><text x="445.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="445.0" dy="0">3</tspan></text><text x="467.0" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="467.0" dy="0">다리 힘</tspan></text><text x="437.0" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="437.0" dy="0">다리 힘으로</tspan><tspan x="437.0" dy="19">일어나기</tspan></text><path d="M569.5 280.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="583.5" y="222" width="146.5" height="130" rx="14" fill="#F4F8FC"/><circle cx="609.5" cy="250" r="15" fill="#38608F"/><text x="609.5" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="609.5" dy="0">4</tspan></text><text x="631.5" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="631.5" dy="0">몸 전체</tspan></text><text x="601.5" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="601.5" dy="0">허리 비틀지 말고</tspan><tspan x="601.5" dy="19">몸 전체로 돌기</tspan></text><rect x="90" y="372" width="640" height="60" rx="12" fill="#DCE8F5"/><text x="112" y="407.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#38608F" text-anchor="start"><tspan x="112" dy="0">목욕할 때</tspan></text><text x="220" y="397.0" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="220" dy="0">욕실 의자나 낮은 받침에 앉아 숙이는 시간 줄이기,</tspan><tspan x="220" dy="20">교환대·침대 높이도 허리 부담이 적게</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 기록해 오시면 쉬워요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">허리가 아픈 순간</tspan><tspan x="110.0" dy="20">(씻길 때·들 때)</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">욕조·침대·</tspan><tspan x="330.0" dy="20">교환대 높이</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">아이 체중과 하루</tspan><tspan x="550.0" dy="20">안아 올리는 횟수</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리로 내려가는 저림과</tspan><tspan x="834" dy="21">힘 빠짐이 함께 있을 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">소변·대변을 보기 어려운</tspan><tspan x="834" dy="21">변화가 생겼을 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갑자기 시작된 심한 허리</tspan><tspan x="834" dy="21">통증으로 움직이기 어려울 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">복용 중인 약은 처방 의사와</tspan><tspan x="816" dy="19">상의 없이 줄이거나 끊지 않기</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
