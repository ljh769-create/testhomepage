<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">매운 음식 뒤 속이 쓰릴 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">공복 여부와 함께 먹은 것, 불편이 시작된 때를 먼저 여쭙니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#D9695A"/>
