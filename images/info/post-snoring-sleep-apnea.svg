<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">코를 크게 골고 숨이 멎는 듯할 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">수면 검사가 가능한 의료기관에서 먼저 확인하는 것이 순서입니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="230" y="204" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="230" dy="0">똑바로 누웠을 때</tspan></text><rect x="110" y="318" width="240" height="18" rx="9" fill="#DCE8F5"/><rect x="110" y="300" width="56" height="22" rx="10" fill="#90B2DD"/><circle cx="152" cy="284" r="17" fill="none" stroke="#1F3552" stroke-width="3"/><path d="M172 296 H330" stroke="#1F3552" stroke-width="12" stroke-linecap="round"/><path d="M180 250 q10 -12 0 -24 M198 250 q10 -12 0 -24" stroke="#E8A33D" stroke-width="3" fill="none" stroke-linecap="round"/><text x="230" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="230" dy="0">혀와 목젖이 뒤로 처져</tspan><tspan x="230" dy="21">숨길이 좁아지기 쉬워요</tspan></text><rect x="200" y="432" width="60" height="5" rx="2.5" fill="#E8A33D"/><rect x="420" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="590" y="204" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="590" dy="0">옆으로 누웠을 때</tspan></text><rect x="470" y="318" width="240" height="18" rx="9" fill="#DCE8F5"/><rect x="470" y="300" width="56" height="22" rx="10" fill="#90B2DD"/><circle cx="512" cy="282" r="17" fill="none" stroke="#1F3552" stroke-width="3"/><path d="M532 290 q70 -34 150 4" stroke="#1F3552" stroke-width="12" stroke-linecap="round" fill="none"/><rect x="570" y="262" width="70" height="20" rx="10" fill="#FBE78A"/><text x="590" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="590" dy="0">등 뒤에 베개를 받쳐</tspan><tspan x="590" dy="21">자세를 유지해 보세요</tspan></text><rect x="560" y="432" width="60" height="5" rx="2.5" fill="#4E9A86"/><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">가족이 도와주면 좋은 기록</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">코골이·숨 멎음을</tspan><tspan x="110.0" dy="20">휴대폰으로 녹음·촬영</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">아침 두통·입 마름·</tspan><tspan x="330.0" dy="20">낮 졸음이 있던 날</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">최근 1년 체중 변화</tspan><tspan x="550.0" dy="20">술 마시는 횟수</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">자다가 숨이 멎는 모습이</tspan><tspan x="834" dy="21">자주 보이는 경우</tspan><tspan x="834" dy="21">(수면 검사로 먼저 확인)</tspan></text><circle cx="820" cy="310" r="4.5" fill="#E8A33D"/><text x="834" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">운전 중 졸음을</tspan><tspan x="834" dy="21">참기 어려운 경우</tspan></text><circle cx="820" cy="365" r="4.5" fill="#E8A33D"/><text x="834" y="371" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">아침 두통과 함께 혈압이</tspan><tspan x="834" dy="21">잘 조절되지 않는 경우</tspan></text><circle cx="820" cy="420" r="4.5" fill="#E8A33D"/><text x="834" y="426" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">숨이 막혀 깨거나</tspan><tspan x="834" dy="21">가슴이 두근거리는 경우</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">자기 전 술은 피하기</tspan><tspan x="816" dy="19">졸린 날은 운전을 미루기</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
