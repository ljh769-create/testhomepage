<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="밥, 채소, 국이 차려진 소박한 한 끼와 아침 해">
<style>
.st{animation:steam 4s ease-in-out infinite}.s2{animation-delay:1.2s}.s3{animation-delay:2.4s}
.sun{animation:pulse 6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes steam{0%{opacity:0;transform:translateY(10px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-18px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
