<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">얼굴 한쪽이 저리거나 감각이 둔할 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">의과 확인이 먼저인지 보고, 남는 불편을 살핍니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">어디서 먼저 확인할지 이렇게 나눕니다</tspan></text><circle cx="108" cy="253" r="15" fill="#38608F"/><text x="108" y="259" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="108" dy="0">1</tspan></text><rect x="134" y="222" width="296" height="62" rx="14" fill="#F4F8FC"/><text x="282" y="249" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#4A5D75" text-anchor="middle"><tspan x="282" dy="0">갑자기 생겼거나 얼굴 처짐·</tspan><tspan x="282" dy="19">말 어눌함이 함께라면</tspan></text><path d="M436 253 H464" stroke="#38608F" stroke-width="4"/><path d="M460 244 l12 9 l-12 9" fill="none" stroke="#38608F" stroke-width="4"/><rect x="480" y="222" width="250" height="62" rx="14" fill="#DCE8F5"/><text x="605" y="249" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="605" dy="0">119·응급실로</tspan><tspan x="605" dy="19">바로 확인</tspan></text><circle cx="108" cy="327" r="15" fill="#38608F"/><text x="108" y="333" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="108" dy="0">2</tspan></text><rect x="134" y="296" width="296" height="62" rx="14" fill="#F4F8FC"/><text x="282" y="323" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#4A5D75" text-anchor="middle"><tspan x="282" dy="0">아직 신경과 진료나</tspan><tspan x="282" dy="19">검사를 받기 전이라면</tspan></text><path d="M436 327 H464" stroke="#38608F" stroke-width="4"/><path d="M460 318 l12 9 l-12 9" fill="none" stroke="#38608F" stroke-width="4"/><rect x="480" y="296" width="250" height="62" rx="14" fill="#DCE8F5"/><text x="605" y="323" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="605" dy="0">신경과 등</tspan><tspan x="605" dy="19">의과 진료 먼저</tspan></text><circle cx="108" cy="401" r="15" fill="#38608F"/><text x="108" y="407" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="108" dy="0">3</tspan></text><rect x="134" y="370" width="296" height="62" rx="14" fill="#F4F8FC"/><text x="282" y="397" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#4A5D75" text-anchor="middle"><tspan x="282" dy="0">검사에서 큰 이상이 없는데</tspan><tspan x="282" dy="19">저림이 남는다면</tspan></text><path d="M436 401 H464" stroke="#38608F" stroke-width="4"/><path d="M460 392 l12 9 l-12 9" fill="none" stroke="#38608F" stroke-width="4"/><rect x="480" y="370" width="250" height="62" rx="14" fill="#DCE8F5"/><text x="605" y="397" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="605" dy="0">얼굴·목 긴장, 잠과</tspan><tspan x="605" dy="19">피로를 함께 살핌</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">이렇게 기록해 오시면 쉬워요</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">처음 생긴 날짜·시각,</tspan><tspan x="110.0" dy="20">갑자기였는지</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">저린 범위(볼·입</tspan><tspan x="330.0" dy="20">주변·이마)와 변화</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">검사지와 복용 약,</tspan><tspan x="550.0" dy="20">앓고 있는 질환</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">갑자기 얼굴 한쪽이 처지거나</tspan><tspan x="834" dy="21">말이 어눌해질 때 (119)</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">한쪽 팔다리 힘 빠짐이나</tspan><tspan x="834" dy="21">시야 이상이 함께일 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">얼굴에 물집이나 심한</tspan><tspan x="834" dy="21">통증이 함께 생겼을 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">물집과 통증이 함께면 피부과</tspan><tspan x="816" dy="19">등 의과 진료를 빨리 받으세요</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>