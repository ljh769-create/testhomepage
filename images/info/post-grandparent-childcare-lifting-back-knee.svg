<rect x="60" y="160" width="700" height="98" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="216" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">들어 올릴 때</tspan></text><rect x="232" y="184" width="226" height="50" rx="14" fill="#FFF7EA"/><text x="345" y="215" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#5E4520" text-anchor="middle"><tspan x="345" dy="0">허리를 굽혀 번쩍</tspan></text><path d="M468 209 h26 m-8 -7 l8 7 l-8 7" stroke="#38608F" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="506" y="184" width="232" height="50" rx="14" fill="#DCE8F5"/><text x="622" y="215" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="622" dy="0">무릎을 굽혀 몸 가까이</tspan></text><rect x="60" y="272" width="700" height="98" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="328" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">놀아 줄 때</tspan></text><rect x="232" y="296" width="226" height="50" rx="14" fill="#FFF7EA"/><text x="345" y="327" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#5E4520" text-anchor="middle"><tspan x="345" dy="0">바닥에 앉았다 일어나기</tspan></text><path d="M468 321 h26 m-8 -7 l8 7 l-8 7" stroke="#38608F" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="506" y="296" width="232" height="50" rx="14" fill="#DCE8F5"/><text x="622" y="327" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="622" dy="0">낮은 의자·소파에 앉아</tspan></text><rect x="60" y="384" width="700" height="98" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="440" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">안고 걸을 때</tspan></text><rect x="232" y="408" width="226" height="50" rx="14" fill="#FFF7EA"/><text x="345" y="439" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#5E4520" text-anchor="middle"><tspan x="345" dy="0">한쪽 팔로 오래 안기</tspan></text><path d="M468 433 h26 m-8 -7 l8 7 l-8 7" stroke="#38608F" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="506" y="408" width="232" height="50" rx="14" fill="#DCE8F5"/><text x="622" y="439" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="622" dy="0">아기띠·유모차 쓰기</tspan></text><rect x="790" y="160" width="350" height="322" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="232" r="4.5" fill="#E8A33D"/><text x="834" y="238" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">넘어진 뒤 허리·엉덩이가</tspan><tspan x="834" dy="20">아파 걷기 어려운 경우</tspan><tspan x="834" dy="20">(골절 확인 먼저)</tspan></text><circle cx="820" cy="304" r="4.5" fill="#E8A33D"/><text x="834" y="310" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">무릎이 갑자기 크게</tspan><tspan x="834" dy="20">붓고 열이 나는 경우</tspan></text><circle cx="820" cy="356" r="4.5" fill="#E8A33D"/><text x="834" y="362" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">다리 힘 빠짐·저림이</tspan><tspan x="834" dy="20">점점 심해지는 경우</tspan></text><rect x="60" y="510" width="1080" height="120" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="546" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">기록해 오시면 좋은 것</tspan></text><circle cx="96.0" cy="580" r="5" fill="#FBE78A"/><text x="110.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">돌봄 시간, 아이 나이·몸무게</tspan></text><circle cx="436.0" cy="580" r="5" fill="#FBE78A"/><text x="450.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="450.0" dy="0">아픈 동작</tspan></text><circle cx="776.0" cy="580" r="5" fill="#FBE78A"/><text x="790.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="790.0" dy="0">복용 중인 약</tspan></text>
