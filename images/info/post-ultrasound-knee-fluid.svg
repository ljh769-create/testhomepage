span></text><circle cx="474" cy="342" r="6" fill="#3E8C84"/><text x="492" y="348" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="492" dy="0">무릎 앞뒤 힘줄의 부기</tspan></text><circle cx="474" cy="390" r="6" fill="#3E8C84"/><text x="492" y="396" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="492" dy="0">반대쪽 무릎과의 차이</tspan></text><rect x="800" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><circle cx="834" cy="196" r="16" fill="#9AA9BC"/><text x="834" y="202" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="834" dy="0">–</tspan></text><text x="860" y="203" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="860" dy="0">보기 어려운 것</tspan></text><circle cx="834" cy="246" r="6" fill="#9AA9BC"/><text x="852" y="252" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="852" dy="0">연골·반월상연골 전체</tspan></text><circle cx="834" cy="294" r="6" fill="#9AA9BC"/><text x="852" y="300" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="852" dy="0">뼈 속 상태</tspan></text><text x="830" y="380" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#38608F" text-anchor="start"><tspan x="830" dy="0">의심되면 X선·MRI 같은</tspan></text><text x="830" y="404" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" fill="#38608F" text-anchor="start"><tspan x="830" dy="0">다른 검사를 안내합니다</tspan></text><rect x="440" y="480" width="700" height="140" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="470" cy="514" r="12" fill="#E8A33D"/><text x="470" y="520" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="470" dy="0">!</tspan></text><text x="492" y="521" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="492" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="470" cy="552" r="4.5" fill="#E8A33D"/><text x="484" y="558" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="484" dy="0">무릎이 뜨겁고 붉으며 열이 날 때</tspan><tspan x="484" dy="20">다친 뒤 갑자기 붓고 디딜 수 없을 때</tspan></text><text x="464" y="602" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#8A5A12" text-anchor="start"><tspan x="464" dy="0">열과 함께 붓는 무릎은 다른 의료기관 진료를 먼저 받으세요</tspan></text>
