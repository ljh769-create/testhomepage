ic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">손·팔에 저림이나 힘 빠짐이 있는지</tspan></text><rect x="90" y="456" width="380" height="66" rx="14" fill="#F4F8FC"/><circle cx="124" cy="489" r="21" fill="#DCE8F5"/><g transform="translate(124 489) scale(0.62)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-6" y="-18" width="12" height="22" rx="4"/><path d="M-10 4 h20 l-3 12 h-14 z"/></g><text x="158" y="495" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="start"><tspan x="158" dy="0">X선이나 영상 검사를 받았는지</tspan></text><rect x="520" y="160" width="250" height="466" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="546" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="546" dy="0">일상에서 해 볼 것</tspan></text><rect x="546" y="218" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">무거운 물건 들기,</tspan><tspan x="562" dy="20">머리 위 동작 줄이기</tspan></text><rect x="546" y="288" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="314" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">잘 때 아픈 팔</tspan><tspan x="562" dy="20">아래 베개 받치기</tspan></text><rect x="546" y="358" width="200" height="62" rx="14" fill="#2C4568"/><text x="562" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">아프지 않은 범위에서</tspan><tspan x="562" dy="20">천천히 움직이기</tspan></text><rect x