<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#38608F" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">건강한 리듬의 두 축, 잠과 식욕</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">사람의 가장 기본적인 두 욕구가 흔들리면 몸의 리듬이 함께 흔들립니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#38608F"/>
<rect x="60" y="160" width="520" height="350" rx="22" fill="#fff" filter="url(#sh)"/><circle cx="140" cy="240" r="48" fill="#DCE8F5"/><g transform="translate(140 240) scale(1.3)" fill="none" stroke="#1F3552" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 -16 a16 16 0 1 0 8 26 a13 13 0 1 1 -8 -26 z"/></g><rect x="210" y="206" width="84" height="30" rx="15" fill="#FBE78A"/><text x="252" y="227" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="252" dy="0">수면욕</tspan></text><text x="210" y="274" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="28" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="210" dy="0">불면·수면</tspan></text><text x="110" y="340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" fill="#33475F" text-anchor="start"><tspan x="110" dy="0">잠들기 어렵다, 자주 깬다</tspan><tspan x="110" dy="34">새벽에 깬다, 개운하지 않다</tspan><tspan x="110" dy="34">잠의 모양을 먼저 묻고</tspan><tspan x="110" dy="34">생활 리듬과 함께 살핍니다</tspan></text><rect x="620" y="160" width="520" height="350" rx="22" fill="#fff" filter="url(#sh)"/><circle cx="700" cy="240" r="48" fill="#DCE8F5"/><g transform="translate(700 240) scale(1.3)" fill="none" stroke="#1F3552" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 -2 h40 a20 18 0 0 1 -40 0 z"/><path d="M-8 -8 q4 -6 0 -12 M2 -8 q4 -6 0 -12"/></g><rect x="770" y="206" width="84" height="30" rx="15" fill="#FBE78A"/><text x="812" y="227" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="812" dy="0">식욕</tspan></text><text x="770" y="274" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="28" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="770" dy="0">대사증후군·식욕</tspan></text><text x="670" y="340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" fill="#33475F" text-anchor="start"><tspan x="670" dy="0">체중·혈압·혈당·콜레스테롤</tspan><tspan x="670" dy="34">걱정될 때 수치보다 먼저</tspan><tspan x="670" dy="34">식욕과 식사, 잠의 리듬을</tspan><tspan x="670" dy="34">함께 살핍니다</tspan></text><path d="M580 335 h40" stroke="#38608F" stroke-width="3"/><circle cx="600" cy="335" r="20" fill="#38608F"/><text x="600" y="342" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="600" dy="0">+</tspan></text><rect x="60" y="530" width="1080" height="84" rx="20" fill="#1F3552"/><text x="600" y="564" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="600" dy="0">잠이 부족하면 식욕이 커지는 경향이 있는 것으로 알려져 있어,</tspan></text><text x="600" y="592" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" fill="#FBE78A" text-anchor="middle"><tspan x="600" dy="0">두 문제는 함께 오는 경우가 많습니다. 복용 중인 약은 임의로 중단하지 않습니다.</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>