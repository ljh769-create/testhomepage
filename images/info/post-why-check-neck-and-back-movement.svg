ght="500" fill="#4A5D75" text-anchor="start"><tspan x="327.33333333333337" dy="0">어디서 걸리고</tspan><tspan x="327.33333333333337" dy="19">어디가 편한지</tspan></text><path d="M514.6666666666667 273.0 l9 7 l-9 7" fill="none" stroke="#90B2DD" stroke-width="3"/><rect x="528.6666666666667" y="222" width="201.33333333333334" height="116" rx="14" fill="#F4F8FC"/><circle cx="554.6666666666667" cy="250" r="15" fill="#38608F"/><text x="554.6666666666667" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="554.6666666666667" dy="0">3</tspan></text><text x="576.6666666666667" y="256" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="576.6666666666667" dy="0">같은 동작 비교</tspan></text><text x="546.6666666666667" y="288" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="546.6666666666667" dy="0">치료 뒤 다시</tspan><tspan x="546.6666666666667" dy="19">움직여 확인</tspan></text><circle cx="96" cy="373" r="5" fill="#38608F"/><text x="110" y="378" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">팔다리 저림이 함께 있으면</tspan><tspan x="110" dy="20">신경 쪽 문제를 따로 확인해요</tspan></text><circle cx="96" cy="433" r="5" fill="#38608F"/><text x="110" y="438" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="110" dy="0">아프기 직전까지만 움직이시면 돼요</tspan></text><rect x="60" y="500" width="700" height="126" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="536" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" te