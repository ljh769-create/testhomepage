<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#C0504D" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">상도동 언덕 걷기, 혈압이 걱정될 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">혈압약은 임의로 끊지 않고, 강도는 천천히 올립니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#C0504D"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">처음 2주는 평지, 언덕은 천천히 조금씩</tspan></text><line x1="110" y1="410" x2="720" y2="410" stroke="#90B2DD" stroke-width="2"/><path d="M110 380 L 400 380 C 450 380, 470 350, 520 340 C 580 330, 620 300, 700 280" fill="none" stroke="#38608F" stroke-width="6" stroke-linecap="round"/><path d="M110 380 L 400 380 C 450 380, 470 350, 520 340 C 580 330, 620 300, 700 280 L 700 410 L 110 410 Z" fill="#DCE8F5" opacity="0.7"/><text x="250" y="366" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="250" dy="0">1~2주 · 평지 위주</tspan></text><text x="600" y="270" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="600" dy="0">3주부터 · 언덕 조금씩</tspan></text><text x="400" y="438" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="500" fill="#4A5D75" text-anchor="middle"><tspan x="400" dy="0">※ 걷는 강도는 내과 주치의와 상의하세요</tspan></text><rect x="780" y="160" width="360" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="810" y="198" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="810" dy="0">걸을 때 세 가지</tspan></text><circle cx="835" cy="248" r="26" fill="#DCE8F5"/><g transform="translate(835 248) scale(0.75)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -12 h36 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 h-20 l-10 8 v-8 h-6 a6 6 0 0 1 -6 -6 v-16 a6 6 0 0 1 6 -6 z"/><path d="M-8 0 h16"/></g><text x="875" y="244" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="875" dy="0">말할 수 있는 속도</tspan></text><text x="875" y="267" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="875" dy="0">옆 사람과 대화가 될 만큼</tspan></text><circle cx="835" cy="320" r="26" fill="#DCE8F5"/><g transform="translate(835 320) scale(0.75)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle r="9"/><path d="M0 -18 v-4 M0 18 v4 M-18 0 h-4 M18 0 h4 M-13 -13 l-3 -3 M13 13 l3 3 M-13 13 l-3 3 M13 -13 l3 -3"/></g><text x="875" y="316" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="875" dy="0">해가 오른 낮 시간</tspan></text><text x="875" y="339" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="875" dy="0">추운 이른 아침은 피하기</tspan></text><circle cx="835" cy="392" r="26" fill="#DCE8F5"/><g transform="translate(835 392) scale(0.75)" fill="none" stroke="#38608F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 12 L8 -10 L14 -4 L-8 18 L-16 20 Z"/><path d="M4 -6 L10 0"/></g><text x="875" y="388" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="875" dy="0">걷기 전후 기록</tspan></text><text x="875" y="411" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#4A5D75" text-anchor="start"><tspan x="875" dy="0">혈압과 느낌을 수첩에</tspan></text><rect x="60" y="480" width="1080" height="150" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="90" cy="514" r="12" fill="#E8A33D"/><text x="90" y="520" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="90" dy="0">!</tspan></text><text x="112" y="521" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="112" dy="0">걷다가 이러면 바로 멈추세요</tspan></text><circle cx="100" cy="554" r="4.5" fill="#E8A33D"/><text x="114" y="560" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="114" dy="0">가슴이 조이듯 아프고</tspan><tspan x="114" dy="21">식은땀이 날 때 → 119</tspan></text><circle cx="450" cy="554" r="4.5" fill="#E8A33D"/><text x="464" y="560" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="464" dy="0">한쪽 팔다리 힘 빠짐·</tspan><tspan x="464" dy="21">말이 어눌해질 때 → 119</tspan></text><circle cx="800" cy="554" r="4.5" fill="#E8A33D"/><text x="814" y="560" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="814" dy="0">평소보다 혈압이 훨씬 높고</tspan><tspan x="814" dy="21">두통이 심할 때</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 노량진점 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
