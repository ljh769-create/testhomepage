<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#7B6FC0" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">사상체질은 무엇이고 어떻게 알아보나요</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">몸의 경향을 정리하는 틀, 지금의 상태가 늘 더 중요합니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#7B6FC0"/>
<rect x="60" y="160" width="700" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="90" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="90" dy="0">체질을 살필 때 함께 보는 것</tspan></text><circle cx="140" cy="280" r="40" fill="#DCE8F5"/><g transform="translate(140 280) scale(1.0)" fill="none" stroke="#7B6FC0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-14" r="6"/><path d="M0 -8 v16 M-12 -2 l12 -2 l12 2 M0 8 l-8 14 M0 8 l8 14"/></g><text x="140" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="140" dy="0">체형·얼굴</tspan><tspan x="140" dy="19">목소리</tspan></text><circle cx="270" cy="280" r="40" fill="#DCE8F5"/><g transform="translate(270 280) scale(1.0)" fill="none" stroke="#7B6FC0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-20 -2 h40 a20 18 0 0 1 -40 0 z"/><path d="M-8 -8 q4 -6 0 -12 M2 -8 q4 -6 0 -12"/></g><text x="270" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="270" dy="0">소화·식욕</tspan><tspan x="270" dy="19">변 상태</tspan></text><circle cx="400" cy="280" r="40" fill="#DCE8F5"/><g transform="translate(400 280) scale(1.0)" fill="none" stroke="#7B6FC0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle r="9"/><path d="M0 -18 v-4 M0 18 v4 M-18 0 h-4 M18 0 h4 M-13 -13 l-3 -3 M13 13 l3 3 M-13 13 l-3 3 M13 -13 l3 -3"/></g><text x="400" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="400" dy="0">땀, 추위와</tspan><tspan x="400" dy="19">더위 타는 정도</tspan></text><circle cx="530" cy="280" r="40" fill="#DCE8F5"/><g transform="translate(530 280) scale(1.0)" fill="none" stroke="#7B6FC0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 -12 h36 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 h-20 l-10 8 v-8 h-6 a6 6 0 0 1 -6 -6 v-16 a6 6 0 0 1 6 -6 z"/><path d="M-8 0 h16"/></g><text x="530" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="530" dy="0">성격과 감정</tspan><tspan x="530" dy="19">반응의 경향</tspan></text><circle cx="660" cy="280" r="40" fill="#DCE8F5"/><g transform="translate(660 280) scale(1.0)" fill="none" stroke="#7B6FC0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 12 L8 -10 L14 -4 L-8 18 L-16 20 Z"/><path d="M4 -6 L10 0"/></g><text x="660" y="352" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="660" dy="0">병력과</tspan><tspan x="660" dy="19">가족력</tspan></text><text x="90" y="430" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="500" fill="#4A5D75" text-anchor="start"><tspan x="90" dy="0">체질은 고정된 꼬리표가 아니라, 지금의 증상을 이해하는 실마리입니다.</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">알아 두면 좋은 점</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">인터넷 설문 한 번으로</tspan><tspan x="110.0" dy="20">음식을 가리지 않기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">알레르기·질환은</tspan><tspan x="330.0" dy="20">의학적 기준이 우선</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">체질을 이유로</tspan><tspan x="550.0" dy="20">약을 끊지 않기</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">체질에 맞춘다며 음식을 끊어</tspan><tspan x="834" dy="21">체중이 줄거나 기운이 빠질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">당뇨·콩팥 질환 등으로</tspan><tspan x="834" dy="21">식이 조절이 필요할 때</tspan><tspan x="834" dy="21">(담당 의료진 지침이 우선)</tspan></text><circle cx="820" cy="365" r="4.5" fill="#E8A33D"/><text x="834" y="371" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">체질식 중 어지럼이나</tspan><tspan x="834" dy="21">기운 없음이 심해질 때</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
</svg>