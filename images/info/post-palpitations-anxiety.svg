xt><rect x="790" y="160" width="350" height="470" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="232" r="4.5" fill="#E8A33D"/><text x="834" y="238" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">가슴 통증과 함께 숨이 차고</tspan><tspan x="834" dy="20">식은땀이 나는 경우 → 가까운 응급실</tspan></text><circle cx="820" cy="284" r="4.5" fill="#E8A33D"/><text x="834" y="290" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">실신하거나 의식이</tspan><tspan x="834" dy="20">흐려지는 경우 → 가까운 응급실</tspan></text><circle cx="820" cy="336" r="4.5" fill="#E8A33D"/><text x="834" y="342" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">맥박이 매우 빠르거나</tspan><tspan x="834" dy="20">불규칙하며 오래 이어질 때</tspan></text><circle cx="820" cy="388" r="4.5" fill="#E8A33D"/><text x="834" y="394" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">불안으로 일상과 일이</tspan><tspan x="834" dy="20">어려운 경우</tspan></text><circle cx="820" cy="440" r="4.5" fill="#E8A33D"/><text x="834" y="446" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" fon