<text x="834" y="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">심한 두통·구토</tspan><tspan x="834" dy="21">복통이 있을 때</tspan></text>
