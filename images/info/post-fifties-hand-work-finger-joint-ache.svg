<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F3552" flood-opacity="0.12"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1120" cy="70" r="120" fill="#7A6BB5" opacity="0.10"/><circle cx="60" cy="640" r="90" fill="#90B2DD" opacity="0.18"/>
<text x="60" y="76" font-family="'Nanum Myeongjo','Noto Serif KR','Malgun Gothic',serif" font-size="40" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="60" dy="0">손일 많은 50대, 손가락 마디가 욱신거릴 때</tspan></text>
<text x="60" y="114" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" fill="#38608F" text-anchor="start"><tspan x="60" dy="0">아픈 마디와 쓰는 방식, 쉬는 간격을 함께 봅니다</tspan></text>
<rect x="60" y="130" width="64" height="5" rx="2.5" fill="#7A6BB5"/>
<rect x="60" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="230" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#1F3552" text-anchor="middle"><tspan x="230" dy="0">어느 마디인가요</tspan></text><rect x="150" y="268" width="28" height="92" rx="14" fill="#DCE8F5" stroke="#90B2DD" stroke-width="3"/><circle cx="164" cy="290" r="6" fill="#E8A33D"/><rect x="188" y="248" width="28" height="112" rx="14" fill="#DCE8F5" stroke="#90B2DD" stroke-width="3"/><circle cx="202" cy="270" r="6" fill="#E8A33D"/><rect x="226" y="254" width="28" height="106" rx="14" fill="#DCE8F5" stroke="#90B2DD" stroke-width="3"/><circle cx="240" cy="276" r="6" fill="#E8A33D"/><rect x="264" y="274" width="28" height="86" rx="14" fill="#DCE8F5" stroke="#90B2DD" stroke-width="3"/><circle cx="278" cy="296" r="6" fill="#E8A33D"/><rect x="146" y="352" width="150" height="70" rx="26" fill="#DCE8F5" stroke="#90B2DD" stroke-width="3"/><rect x="104" y="336" width="58" height="26" rx="13" fill="#DCE8F5" stroke="#90B2DD" stroke-width="3" transform="rotate(-30 133 349)"/><circle cx="144" cy="366" r="7" fill="#7A6BB5"/><text x="230" y="446" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#4A5D75" text-anchor="middle"><tspan x="230" dy="0">주황 끝 마디 · 보라 엄지 뿌리</tspan></text><rect x="420" y="160" width="340" height="300" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="446" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#1F3552" text-anchor="start"><tspan x="446" dy="0">손일 나눠 하기</tspan></text><circle cx="456" cy="241" r="5" fill="#38608F"/><text x="472" y="246" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="472" dy="0">30분마다 손 털고 펴기</tspan></text><circle cx="456" cy="287" r="5" fill="#38608F"/><text x="472" y="292" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="472" dy="0">굵고 부드러운 손잡이 도구</tspan></text><circle cx="456" cy="333" r="5" fill="#38608F"/><text x="472" y="338" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="472" dy="0">찬물 대신 미지근한 물,</tspan><tspan x="472" dy="20">끝나면 손 따뜻하게</tspan></text><circle cx="456" cy="379" r="5" fill="#38608F"/><text x="472" y="384" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#1F3552" text-anchor="start"><tspan x="472" dy="0">김장 같은 큰일은 며칠에</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">적어 오시면 좋은 것</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">아픈 마디 위치</tspan><tspan x="110.0" dy="20">(엄지·검지·끝 마디)</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">손일 종류와</tspan><tspan x="330.0" dy="20">하루에 하는 시간</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">아침 뻣뻣함이</tspan><tspan x="550.0" dy="20">이어지는 시간</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">마디가 붓고 붉으며</tspan><tspan x="834" dy="21">열감이 있을 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">여러 마디가 함께 붓고</tspan><tspan x="834" dy="21">아침 뻣뻣함이 1시간 넘게</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손가락이 구부러진 채</tspan><tspan x="834" dy="21">펴지지 않을 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">손끝 감각이 둔하고</tspan><tspan x="834" dy="21">물건을 자주 놓칠 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">복용 중인 약은 임의로</tspan><tspan x="816" dy="19">줄이거나 끊지 않기</tspan></text>
<text x="600" y="652" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" fill="#5B6E86" text-anchor="middle"><tspan x="600" dy="0">좋은꿈참사랑한의원 · 02-815-7510 · 일반 건강 정보이며 진단·치료를 대신하지 않습니다</tspan></text>
