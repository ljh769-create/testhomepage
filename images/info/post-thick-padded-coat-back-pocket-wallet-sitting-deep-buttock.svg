<text x="562" y="454" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start"><tspan x="562" dy="0">숫자 4 자세로</tspan><tspan x="562" dy="20">20~30초 늘리기</tspan></text>
