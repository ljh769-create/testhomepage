증이</tspan><tspan x="834" dy="21">점점 심해질 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">이런 신호가 있으면 기다리지 말고</tspan><tspan x="816" dy="19">가까운 응급실로</tspan></text>
