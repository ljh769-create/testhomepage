.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">타는 도중 가슴 통증이나</tspan><tspan x="834" dy="21">숨참이 반복될 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">넘어져 다쳤다면 영상 검사가</tspan><tspan x="816" dy="19">가능한 의료기관 확인이 먼저</tspan></text>
