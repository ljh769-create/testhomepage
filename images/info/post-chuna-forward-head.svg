ill="#90B2DD"/><path d="M510 420 H730" stroke="#1F3552" stroke-width="3"/><path d="M572 262 L626 284" stroke="#5BA68A" stroke-width="2.5" stroke-dasharray="5 5"/><text x="590" y="446" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1F3552" text-anchor="middle"><tspan x="590" dy="0">모니터 윗부분을 눈높이에</tspan></text><rect x="60" y="480" width="700" height="146" rx="22" fill="#1F3552" filter="url(#sh)"/><text x="90" y="516" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="800" fill="#FBE78A" text-anchor="start"><tspan x="90" dy="0">하루 중에</tspan></text><circle cx="96.0" cy="546" r="5" fill="#FBE78A"/><text x="110.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="110.0" dy="0">한 시간에 한 번 턱 당기고</tspan><tspan x="110.0" dy="20">어깨 크게 돌리기</tspan></text><circle cx="316.0" cy="546" r="5" fill="#FBE78A"/><text x="330.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="330.0" dy="0">휴대폰은 눈높이로,</tspan><tspan x="330.0" dy="20">엎드려 보지 않기</tspan></text><circle cx="536.0" cy="546" r="5" fill="#FBE78A"/><text x="550.0" y="552" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start"><tspan x="550.0" dy="0">목이 꺾이지 않는</tspan><tspan x="550.0" dy="20">베개 높이</tspan></text><rect x="790" y="160" width="350" height="466" rx="22" fill="#FFF7EA" stroke="#E8A33D" stroke-width="2" filter="url(#sh)"/><circle cx="820" cy="194" r="12" fill="#E8A33D"/><text x="820" y="200" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan x="820" dy="0">!</tspan></text><text x="842" y="201" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start"><tspan x="842" dy="0">먼저 확인이 필요한 신호</tspan></text><circle cx="820" cy="234" r="4.5" fill="#E8A33D"/><text x="834" y="240" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">팔 저림·힘 빠짐이</tspan><tspan x="834" dy="21">점점 심해질 때</tspan></text><circle cx="820" cy="289" r="4.5" fill="#E8A33D"/><text x="834" y="295" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">걸음이 불안정하거나</tspan><tspan x="834" dy="21">손이 둔해질 때</tspan></text><circle cx="820" cy="344" r="4.5" fill="#E8A33D"/><text x="834" y="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">사고나 낙상 뒤</tspan><tspan x="834" dy="21">목이 아플 때</tspan></text><circle cx="820" cy="399" r="4.5" fill="#E8A33D"/><text x="834" y="405" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="500" fill="#5E4520" text-anchor="start"><tspan x="834" dy="0">열과 함께 목이 뻣뻣하고</tspan><tspan x="834" dy="21">두통이 심할 때</tspan></text><text x="816" y="587" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="700" fill="#8A5A12" text-anchor="start"><tspan x="816" dy="0">영상 검사가 가능한</tspan><tspan x="816" dy="19">의료기관 확인이 먼저입니다</tspan></text>
